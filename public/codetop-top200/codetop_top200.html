</code></pre>
<p><strong>示例 4：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/15/inorder_5.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,2]
输出：[1,2]
</code></pre>
<p><strong>示例 5：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/15/inorder_4.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,null,2]
输出：[1,2]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>树中节点数目在范围<code>[0, 100]</code>内</li>
<li><code>-100 &lt;= Node.val &lt;= 100</code></li>
</ul>
<p><strong>进阶：</strong>递归算法很简单，你可以通过迭代算法完成吗？</p></section><section class="q-block solution"><p><strong>方法一：递归遍历</strong></p>
<p>我们先访问根节点，然后递归左子树和右子树。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数，空间复杂度主要取决于递归调用的栈空间。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    private List&lt;Integer&gt; ans = new ArrayList&lt;&gt;();

    public List&lt;Integer&gt; preorderTraversal(TreeNode root) {
        dfs(root);
        return ans;
    }

    private void dfs(TreeNode root) {
        if (root == null) {
            return;
        }
        ans.add(root.val);
        dfs(root.left);
        dfs(root.right);
    }
}
</code></pre>

</section></template>
<template id="panel-q-84"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">84</span>    <h2 class="q-title">543. 二叉树的直径</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 82</span>    <span class="pill algo">树、深度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/diameter-of-binary-tree" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一棵二叉树，你需要计算它的直径长度。一棵二叉树的直径长度是任意两个结点路径长度中的最大值。这条路径可能穿过也可能不穿过根结点。</p>
<p><strong>示例 :</strong>
给定二叉树</p>
<pre><code class="language-text">          1
         / \
        2   3
       / \
      4   5
</code></pre>
<p>返回<strong>3</strong>, 它的长度是路径 [4,2,1,3] 或者 [5,2,1,3]。</p>
<p><strong>注意：</strong>两结点之间的路径长度是以它们之间边的数目表示。</p></section><section class="q-block solution"><p><strong>方法一：枚举 + DFS</strong></p>
<p>我们可以枚举二叉树的每个节点，以该节点为根节点，计算其左右子树的最大深度 <span class="arithmatex">\(\textit{l}\)</span> 和 <span class="arithmatex">\(\textit{r}\)</span>，则该节点的直径为 <span class="arithmatex">\(\textit{l} + \textit{r}\)</span>。取所有节点的直径的最大值即为二叉树的直径。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为二叉树的节点个数。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    private int ans;

    public int diameterOfBinaryTree(TreeNode root) {
        dfs(root);
        return ans;
    }

    private int dfs(TreeNode root) {
        if (root == null) {
            return 0;
        }
        int l = dfs(root.left);
        int r = dfs(root.right);
        ans = Math.max(ans, l + r);
        return 1 + Math.max(l, r);
    }
}
</code></pre>

</section></template>
<template id="panel-q-85"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">85</span>    <h2 class="q-title">162. 寻找峰值</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 80</span>    <span class="pill algo">数组、二分查找</span>    <a class="pill link" href="https://leetcode.cn/problems/find-peak-element" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>峰值元素是指其值严格大于左右相邻值的元素。</p>
<p>给你一个整数数组<code>nums</code>，找到峰值元素并返回其索引。数组可能包含多个峰值，在这种情况下，返回<strong>任何一个峰值</strong>所在位置即可。</p>
<p>你可以假设<code>nums[-1] = nums[n] = -∞</code>。</p>
<p>你必须实现时间复杂度为<code>O(log n)</code>**的算法来解决此问题。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,3,1]
输出：2
解释：3 是峰值元素，你的函数应该返回其索引 2。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,1,3,5,6,4]
输出：1 或 5
解释：你的函数可以返回索引 1，其峰值元素为 2；
     或者返回索引 5， 其峰值元素为 6。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 1000</code></li>
<li><code>-2&lt;sup&gt;31&lt;/sup&gt; &lt;= nums[i] &lt;= 2&lt;sup&gt;31&lt;/sup&gt; - 1</code></li>
<li>对于所有有效的<code>i</code>都有<code>nums[i] != nums[i + 1]</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：二分查找</strong></p>
<p>我们定义二分查找的左边界 <span class="arithmatex">\(left=0\)</span>，右边界 <span class="arithmatex">\(right=n-1\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组的长度。在每一步二分查找中，我们找到当前区间的中间元素 <span class="arithmatex">\(mid\)</span>，然后比较 <span class="arithmatex">\(mid\)</span> 与其右边元素 <span class="arithmatex">\(mid+1\)</span> 的值：</p>
<ul>
<li>如果 <span class="arithmatex">\(mid\)</span> 的值大于 <span class="arithmatex">\(mid+1\)</span> 的值，则左侧存在峰值元素，我们将右边界 <span class="arithmatex">\(right\)</span> 更新为 <span class="arithmatex">\(mid\)</span>；</li>
<li>否则，右侧存在峰值元素，我们将左边界 <span class="arithmatex">\(left\)</span> 更新为 <span class="arithmatex">\(mid+1\)</span>。</li>
<li>最后，当左边界 <span class="arithmatex">\(left\)</span> 与右边界 <span class="arithmatex">\(right\)</span> 相等时，我们就找到了数组的峰值元素。</li>
</ul>
<p>时间复杂度 <span class="arithmatex">\(O(\log n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组 <span class="arithmatex">\(nums\)</span> 的长度。每一步二分查找可以将搜索区间减少一半，因此时间复杂度为 <span class="arithmatex">\(O(\log n)\)</span>。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int findPeakElement(int[] nums) {
        int left = 0, right = nums.length - 1;
        while (left &lt; right) {
            int mid = (left + right) &gt;&gt; 1;
            if (nums[mid] &gt; nums[mid + 1]) {
                right = mid;
            } else {
                left = mid + 1;
            }
        }
        return left;
    }
}
</code></pre>

</section></template>
<template id="panel-q-86"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">86</span>    <h2 class="q-title">560. 和为K的子数组</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 79</span>    <span class="pill algo">数组、哈希表、前缀和</span>    <a class="pill link" href="https://leetcode.cn/problems/subarray-sum-equals-k" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个整数数组<code>nums</code>和一个整数<code>k</code>，请你统计并返回该数组中和为<code>k</code>****的连续子数组的个数。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,1,1], k = 2
输出：2
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,3], k = 3
输出：2
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 2 * 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>-1000 &lt;= nums[i] &lt;= 1000</code></li>
<li><code>-10&lt;sup&gt;7&lt;/sup&gt; &lt;= k &lt;= 10&lt;sup&gt;7&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：哈希表 + 前缀和</strong></p>
<p>我们定义一个哈希表 <span class="arithmatex">\(\textit{cnt}\)</span>，用于存储数组 <span class="arithmatex">\(\textit{nums}\)</span> 的前缀和出现的次数。初始时，我们将 <span class="arithmatex">\(\textit{cnt}[0]\)</span> 的值设为 <span class="arithmatex">\(1\)</span>，表示前缀和 <span class="arithmatex">\(0\)</span> 出现了一次。</p>
<p>我们遍历数组 <span class="arithmatex">\(\textit{nums}\)</span>，计算前缀和 <span class="arithmatex">\(\textit{s}\)</span>，然后将 <span class="arithmatex">\(\textit{cnt}[s - k]\)</span> 的值累加到答案中，并将 <span class="arithmatex">\(\textit{cnt}[s]\)</span> 的值增加 <span class="arithmatex">\(1\)</span>。</p>
<p>遍历结束后，我们返回答案。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为数组 <span class="arithmatex">\(\textit{nums}\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int subarraySum(int[] nums, int k) {
        Map&lt;Integer, Integer&gt; cnt = new HashMap&lt;&gt;();
        cnt.put(0, 1);
        int ans = 0, s = 0;
        for (int x : nums) {
            s += x;
            ans += cnt.getOrDefault(s - k, 0);
            cnt.merge(s, 1, Integer::sum);
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-87"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">87</span>    <h2 class="q-title">113. 路径总和 II</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 78</span>    <span class="pill algo">树、深度优先搜索、回溯、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/path-sum-ii" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你二叉树的根节点<code>root</code>和一个整数目标和<code>targetSum</code>，找出所有<strong>从根节点到叶子节点</strong>路径总和等于给定目标和的路径。</p>
<p><strong>叶子节点</strong>是指没有子节点的节点。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/01/18/pathsumii1.jpg" /></p>
<pre><code class="language-text">
输入：root = [5,4,8,11,null,13,4,7,2,null,null,5,1], targetSum = 22
输出：[[5,4,11,2],[5,8,4,5]]
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/01/18/pathsum2.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,2,3], targetSum = 5
输出：[]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：root = [1,2], targetSum = 0
输出：[]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>树中节点总数在范围<code>[0, 5000]</code>内</li>
<li><code>-1000 &lt;= Node.val &lt;= 1000</code></li>
<li><code>-1000 &lt;= targetSum &lt;= 1000</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：DFS</strong></p>
<p>我们从根节点开始，递归遍历所有从根节点到叶子节点的路径，并记录路径和。当遍历到叶子节点时，如果此时路径和等于 <code>targetSum</code>，则将此路径加入答案。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n^2)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数。空间复杂度 <span class="arithmatex">\(O(n)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    private List&lt;List&lt;Integer&gt;&gt; ans = new ArrayList&lt;&gt;();
    private List&lt;Integer&gt; t = new ArrayList&lt;&gt;();

    public List&lt;List&lt;Integer&gt;&gt; pathSum(TreeNode root, int targetSum) {
        dfs(root, targetSum);
        return ans;
    }

    private void dfs(TreeNode root, int s) {
        if (root == null) {
            return;
        }
        s -= root.val;
        t.add(root.val);
        if (root.left == null &amp;&amp; root.right == null &amp;&amp; s == 0) {
            ans.add(new ArrayList&lt;&gt;(t));
        }
        dfs(root.left, s);
        dfs(root.right, s);
        t.remove(t.size() - 1);
    }
}
</code></pre>

</section></template>
<template id="panel-q-88"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">88</span>    <h2 class="q-title">62. 不同路径</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 78</span>    <span class="pill algo">数学、动态规划、组合数学</span>    <a class="pill link" href="https://leetcode.cn/problems/unique-paths" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>一个机器人位于一个<code>m x n</code>**网格的左上角 （起始点在下图中标记为 “Start” ）。</p>
<p>机器人每次只能向下或者向右移动一步。机器人试图达到网格的右下角（在下图中标记为 “Finish” ）。</p>
<p>问总共有多少条不同的路径？</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2018/10/22/robot_maze.png" /></p>
<pre><code class="language-text">
输入：m = 3, n = 7
输出：28
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：m = 3, n = 2
输出：3
解释：
从左上角开始，总共有 3 条路径可以到达右下角。
1. 向右 -&gt; 向下 -&gt; 向下
2. 向下 -&gt; 向下 -&gt; 向右
3. 向下 -&gt; 向右 -&gt; 向下
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：m = 7, n = 3
输出：28
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：m = 3, n = 3
输出：6
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= m, n &lt;= 100</code></li>
<li>题目数据保证答案小于等于<code>2 * 10&lt;sup&gt;9&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：动态规划</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i][j]\)</span> 表示从左上角走到 <span class="arithmatex">\((i, j)\)</span> 的路径数量，初始时 <span class="arithmatex">\(f[0][0] = 1\)</span>，答案为 <span class="arithmatex">\(f[m - 1][n - 1]\)</span>。</p>
<p>考虑 <span class="arithmatex">\(f[i][j]\)</span>：</p>
<ul>
<li>如果 <span class="arithmatex">\(i \gt 0\)</span>，那么 <span class="arithmatex">\(f[i][j]\)</span> 可以从 <span class="arithmatex">\(f[i - 1][j]\)</span> 走一步到达，因此 <span class="arithmatex">\(f[i][j] = f[i][j] + f[i - 1][j]\)</span>；</li>
<li>如果 <span class="arithmatex">\(j \gt 0\)</span>，那么 <span class="arithmatex">\(f[i][j]\)</span> 可以从 <span class="arithmatex">\(f[i][j - 1]\)</span> 走一步到达，因此 <span class="arithmatex">\(f[i][j] = f[i][j] + f[i][j - 1]\)</span>。</li>
</ul>
<p>因此，我们有如下的状态转移方程：</p>
<div class="arithmatex">\[
f[i][j] = \begin{cases}
1 &amp; i = 0, j = 0 \\
f[i - 1][j] + f[i][j - 1] &amp; \textit{otherwise}
\end{cases}
\]</div>
<p>最终的答案即为 <span class="arithmatex">\(f[m - 1][n - 1]\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别是网格的行数和列数。</p>
<p>我们注意到 <span class="arithmatex">\(f[i][j]\)</span> 仅与 <span class="arithmatex">\(f[i - 1][j]\)</span> 和 <span class="arithmatex">\(f[i][j - 1]\)</span> 有关，因此我们优化掉第一维空间，仅保留第二维空间，得到时间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span> 的实现。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int uniquePaths(int m, int n) {
        var f = new int[m][n];
        f[0][0] = 1;
        for (int i = 0; i &lt; m; ++i) {
            for (int j = 0; j &lt; n; ++j) {
                if (i &gt; 0) {
                    f[i][j] += f[i - 1][j];
                }
                if (j &gt; 0) {
                    f[i][j] += f[i][j - 1];
                }
            }
        }
        return f[m - 1][n - 1];
    }
}
</code></pre>

</section></template>
<template id="panel-q-89"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">89</span>    <h2 class="q-title">198. 打家劫舍</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 75</span>    <span class="pill algo">数组、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/house-robber" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>你是一个专业的小偷，计划偷窃沿街的房屋。每间房内都藏有一定的现金，影响你偷窃的唯一制约因素就是相邻的房屋装有相互连通的防盗系统，<strong>如果两间相邻的房屋在同一晚上被小偷闯入，系统会自动报警</strong>。</p>
<p>给定一个代表每个房屋存放金额的非负整数数组，计算你<strong>不触动警报装置的情况下</strong>，一夜之内能够偷窃到的最高金额。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：[1,2,3,1]
输出：4
解释：偷窃 1 号房屋 (金额 = 1) ，然后偷窃 3 号房屋 (金额 = 3)。
     偷窃到的最高金额 = 1 + 3 = 4 。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：[2,7,9,3,1]
输出：12
解释：偷窃 1 号房屋 (金额 = 2), 偷窃 3 号房屋 (金额 = 9)，接着偷窃 5 号房屋 (金额 = 1)。
     偷窃到的最高金额 = 2 + 9 + 1 = 12 。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 100</code></li>
<li><code>0 &lt;= nums[i] &lt;= 400</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：记忆化搜索</strong></p>
<p>我们设计一个函数 <span class="arithmatex">\(\textit{dfs}(i)\)</span>，表示从第 <span class="arithmatex">\(i\)</span> 间房屋开始偷窃能够得到的最高金额。那么答案即为 <span class="arithmatex">\(\textit{dfs}(0)\)</span>。</p>
<p>函数 <span class="arithmatex">\(\textit{dfs}(i)\)</span> 的执行过程如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(i \ge \textit{len}(\textit{nums})\)</span>，表示所有房屋都被考虑过了，直接返回 <span class="arithmatex">\(0\)</span>；</li>
<li>否则，考虑偷窃第 <span class="arithmatex">\(i\)</span> 间房屋，那么 <span class="arithmatex">\(\textit{dfs}(i) = \textit{nums}[i] + \textit{dfs}(i+2)\)</span>；不偷窃第 <span class="arithmatex">\(i\)</span> 间房屋，那么 <span class="arithmatex">\(\textit{dfs}(i) = \textit{dfs}(i+1)\)</span>。</li>
<li>返回 <span class="arithmatex">\(\max(\textit{nums}[i] + \textit{dfs}(i+2), \textit{dfs}(i+1))\)</span>。</li>
</ul>
<p>为了避免重复计算，我们使用记忆化搜索的方法，将 <span class="arithmatex">\(\textit{dfs}(i)\)</span> 的结果保存在一个数组或哈希表中，每次计算前先查询是否已经计算过，如果计算过直接返回结果。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是数组长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private Integer[] f;
    private int[] nums;

    public int rob(int[] nums) {
        this.nums = nums;
        f = new Integer[nums.length];
        return dfs(0);
    }

    private int dfs(int i) {
        if (i &gt;= nums.length) {
            return 0;
        }
        if (f[i] == null) {
            f[i] = Math.max(nums[i] + dfs(i + 2), dfs(i + 1));
        }
        return f[i];
    }
}
</code></pre>

</section></template>
<template id="panel-q-90"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">90</span>    <h2 class="q-title">209. 长度最小的子数组</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 74</span>    <span class="pill algo">数组、二分查找、前缀和、滑动窗口</span>    <a class="pill link" href="https://leetcode.cn/problems/minimum-size-subarray-sum" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个含有<code>n</code><strong><em>*个正整数的数组和一个正整数<code>target</code></em>*。</strong></p>
<p>找出该数组中满足其和<strong><em>*<code>≥ target</code></em></strong><em>的长度最小的</em><em>连续子数组</em><em><code>[nums&lt;sub&gt;l&lt;/sub&gt; , nums&lt;sub&gt;l+1&lt;/sub&gt; , ..., nums&lt;sub&gt;r-1&lt;/sub&gt; , nums&lt;sub&gt;r&lt;/sub&gt; ]</code>，并返回其长度</em><em>。</em>*如果不存在符合条件的子数组，返回<code>0</code>。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：target = 7, nums = [2,3,1,2,4,3]
输出：2
解释：子数组 [4,3] 是该条件下的长度最小的子数组。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：target = 4, nums = [1,4,4]
输出：1
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：target = 11, nums = [1,1,1,1,1,1,1,1]
输出：0
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= target &lt;= 10&lt;sup&gt;9&lt;/sup&gt;</code></li>
<li><code>1 &lt;= nums.length &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>1 &lt;= nums[i] &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
</ul>
<p><strong>进阶：</strong></p>
<ul>
<li>如果你已经实现**<code>O(n)</code>时间复杂度的解法, 请尝试设计一个<code>O(n log(n))</code>时间复杂度的解法。</li>
</ul></section><section class="q-block solution"><p><strong>方法一：前缀和 + 二分查找</strong></p>
<p>我们先预处理出数组 <span class="arithmatex">\(nums\)</span> 的前缀和数组 <span class="arithmatex">\(s\)</span>，其中 <span class="arithmatex">\(s[i]\)</span> 表示数组 <span class="arithmatex">\(nums\)</span> 前 <span class="arithmatex">\(i\)</span> 项元素之和。由于数组 <span class="arithmatex">\(nums\)</span> 中的元素都是正整数，因此数组 <span class="arithmatex">\(s\)</span> 也是单调递增的。另外，我们初始化答案 <span class="arithmatex">\(ans = n + 1\)</span>，其中 <span class="arithmatex">\(n\)</span> 为数组 <span class="arithmatex">\(nums\)</span> 的长度。</p>
<p>接下来，我们遍历前缀和数组 <span class="arithmatex">\(s\)</span>，对于其中的每个元素 <span class="arithmatex">\(s[i]\)</span>，我们可以通过二分查找的方法找到满足 <span class="arithmatex">\(s[j] \geq s[i] + target\)</span> 的最小下标 <span class="arithmatex">\(j\)</span>，如果 <span class="arithmatex">\(j \leq n\)</span>，则说明存在满足条件的子数组，我们可以更新答案，即 <span class="arithmatex">\(ans = min(ans, j - i)\)</span>。</p>
<p>最后，如果 <span class="arithmatex">\(ans \leq n\)</span>，则说明存在满足条件的子数组，返回 <span class="arithmatex">\(ans\)</span>，否则返回 <span class="arithmatex">\(0\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n \times \log n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为数组 <span class="arithmatex">\(nums\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int minSubArrayLen(int target, int[] nums) {
        int n = nums.length;
        long[] s = new long[n + 1];
        for (int i = 0; i &lt; n; ++i) {
            s[i + 1] = s[i] + nums[i];
        }
        int ans = n + 1;
        for (int i = 0; i &lt;= n; ++i) {
            int j = search(s, s[i] + target);
            if (j &lt;= n) {
                ans = Math.min(ans, j - i);
            }
        }
        return ans &lt;= n ? ans : 0;
    }

    private int search(long[] nums, long x) {
        int l = 0, r = nums.length;
        while (l &lt; r) {
            int mid = (l + r) &gt;&gt; 1;
            if (nums[mid] &gt;= x) {
                r = mid;
            } else {
                l = mid + 1;
            }
        }
        return l;
    }
}
</code></pre>

</section></template>
<template id="panel-q-91"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">91</span>    <h2 class="q-title">24. 两两交换链表中的节点</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 73</span>    <span class="pill algo">递归、链表</span>    <a class="pill link" href="https://leetcode.cn/problems/swap-nodes-in-pairs" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个链表，两两交换其中相邻的节点，并返回交换后的链表。</p>
<p><strong>你不能只是单纯的改变节点内部的值</strong>，而是需要实际的进行节点交换。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/10/03/swap_ex1.jpg" /></p>
<pre><code class="language-text">
输入：head = [1,2,3,4]
输出：[2,1,4,3]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：head = []
输出：[]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：head = [1]
输出：[1]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>链表中节点的数目在范围<code>[0, 100]</code>内</li>
<li><code>0 &lt;= Node.val &lt;= 100</code></li>
</ul>
<p><strong>进阶：</strong>你能在不修改链表节点值的情况下解决这个问题吗?（也就是说，仅修改节点本身。）</p></section><section class="q-block solution"><p><strong>方法一：递归</strong></p>
<p>我们可以通过递归的方式实现两两交换链表中的节点。</p>
<p>递归的终止条件是链表中没有节点，或者链表中只有一个节点，此时无法进行交换，直接返回该节点。</p>
<p>否则，我们递归交换链表 <span class="arithmatex">\(head.next.next\)</span>，记交换后的头节点为 <span class="arithmatex">\(t\)</span>，然后我们记 <span class="arithmatex">\(head\)</span> 的下一个节点为 <span class="arithmatex">\(p\)</span>，然后令 <span class="arithmatex">\(p\)</span> 指向 <span class="arithmatex">\(head\)</span>，而 <span class="arithmatex">\(head\)</span> 指向 <span class="arithmatex">\(t\)</span>，最后返回 <span class="arithmatex">\(p\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是链表的长度。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for singly-linked list.
 * public class ListNode {
 *     int val;
 *     ListNode next;
 *     ListNode() {}
 *     ListNode(int val) { this.val = val; }
 *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }
 * }
 */
class Solution {
    public ListNode swapPairs(ListNode head) {
        if (head == null || head.next == null) {
            return head;
        }
        ListNode t = swapPairs(head.next.next);
        ListNode p = head.next;
        p.next = head;
        head.next = t;
        return p;
    }
}
</code></pre>

</section></template>
<template id="panel-q-92"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">92</span>    <h2 class="q-title">112. 路径总和</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 72</span>    <span class="pill algo">树、深度优先搜索、广度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/path-sum" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你二叉树的根节点<code>root</code>和一个表示目标和的整数<code>targetSum</code>，判断该树中是否存在<strong>根节点到叶子节点</strong>的路径，这条路径上所有节点值相加等于目标和<code>targetSum</code>。</p>
<p><strong>叶子节点</strong>是指没有子节点的节点。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/01/18/pathsum1.jpg" /></p>
<pre><code class="language-text">
输入：root = [5,4,8,11,null,13,4,7,2,null,null,null,1], targetSum = 22
输出：true
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/01/18/pathsum2.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,2,3], targetSum = 5
输出：false
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：root = [1,2], targetSum = 0
输出：false
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>树中节点的数目在范围<code>[0, 5000]</code>内</li>
<li><code>-1000 &lt;= Node.val &lt;= 1000</code></li>
<li><code>-1000 &lt;= targetSum &lt;= 1000</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：递归</strong></p>
<p>从根节点开始，递归地对树进行遍历，并在遍历过程中更新节点的值为从根节点到该节点的路径和。当遍历到叶子节点时，判断该路径和是否等于目标值，如果相等则返回 <code>true</code>，否则返回 <code>false</code>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数。对每个节点访问一次。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public boolean hasPathSum(TreeNode root, int targetSum) {
        return dfs(root, targetSum);
    }

    private boolean dfs(TreeNode root, int s) {
        if (root == null) {
            return false;
        }
        s -= root.val;
        if (root.left == null &amp;&amp; root.right == null &amp;&amp; s == 0) {
            return true;
        }
        return dfs(root.left, s) || dfs(root.right, s);
    }
}
</code></pre>

</section></template>
<template id="panel-q-93"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">93</span>    <h2 class="q-title">83. 删除排序链表中的重复元素</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 69</span>    <span class="pill algo">链表</span>    <a class="pill link" href="https://leetcode.cn/problems/remove-duplicates-from-sorted-list" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>存在一个按升序排列的链表，给你这个链表的头节点<code>head</code>，请你删除所有重复的元素，使每个元素<strong>只出现一次</strong>。</p>
<p>返回同样按升序排列的结果链表。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/01/04/list1.jpg" /></p>
<pre><code class="language-text">
输入：head = [1,1,2]
输出：[1,2]
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/01/04/list2.jpg" /></p>
<pre><code class="language-text">
输入：head = [1,1,2,3,3]
输出：[1,2,3]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>链表中节点数目在范围<code>[0, 300]</code>内</li>
<li><code>-100 &lt;= Node.val &lt;= 100</code></li>
<li>题目数据保证链表已经按升序排列</li>
</ul></section><section class="q-block solution"><p><strong>方法一：一次遍历</strong></p>
<p>我们用一个指针 <span class="arithmatex">\(cur\)</span> 来遍历链表。如果当前 <span class="arithmatex">\(cur\)</span> 与 <span class="arithmatex">\(cur.next\)</span> 对应的元素相同，我们就将 <span class="arithmatex">\(cur\)</span> 的 <span class="arithmatex">\(next\)</span> 指针指向 <span class="arithmatex">\(cur\)</span> 的下下个节点。否则，说明链表中 <span class="arithmatex">\(cur\)</span> 对应的元素是不重复的，因此可以将 <span class="arithmatex">\(cur\)</span> 指针移动到下一个节点。</p>
<p>遍历结束后，返回链表的头节点即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是链表的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for singly-linked list.
 * public class ListNode {
 *     int val;
 *     ListNode next;
 *     ListNode() {}
 *     ListNode(int val) { this.val = val; }
 *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }
 * }
 */
class Solution {
    public ListNode deleteDuplicates(ListNode head) {
        ListNode cur = head;
        while (cur != null &amp;&amp; cur.next != null) {
            if (cur.val == cur.next.val) {
                cur.next = cur.next.next;
            } else {
                cur = cur.next;
            }
        }
        return head;
    }
}
</code></pre>

</section></template>
<template id="panel-q-94"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">94</span>    <h2 class="q-title">139. 单词拆分</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 69</span>    <span class="pill algo">字典树、记忆化、数组、哈希表、字符串、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/word-break" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个<strong>非空</strong>字符串<em>s</em>和一个包含<strong>非空</strong>单词的列表<em>wordDict</em>，判定<em>s</em>是否可以被空格拆分为一个或多个在字典中出现的单词。</p>
<p><strong>说明：</strong></p>
<ul>
<li>拆分时可以重复使用字典中的单词。</li>
<li>你可以假设字典中没有重复的单词。</li>
</ul>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入: s = &quot;leetcode&quot;, wordDict = [&quot;leet&quot;, &quot;code&quot;]
输出: true
解释: 返回 true 因为 &quot;leetcode&quot; 可以被拆分成 &quot;leet code&quot;。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入: s = &quot;applepenapple&quot;, wordDict = [&quot;apple&quot;, &quot;pen&quot;]
输出: true
解释: 返回 true 因为 &quot;applepenapple&quot; 可以被拆分成 &quot;apple pen apple&quot;。
     注意你可以重复使用字典中的单词。
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">输入: s = &quot;catsandog&quot;, wordDict = [&quot;cats&quot;, &quot;dog&quot;, &quot;sand&quot;, &quot;and&quot;, &quot;cat&quot;]
输出: false
</code></pre></section><section class="q-block solution"><p><strong>方法一：哈希表 + 动态规划</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i]\)</span> 表示字符串 <span class="arithmatex">\(s\)</span> 的前 <span class="arithmatex">\(i\)</span> 个字符能否拆分成 <span class="arithmatex">\(wordDict\)</span> 中的单词，初始时 <span class="arithmatex">\(f[0]=true\)</span>，其余为 <span class="arithmatex">\(false\)</span>。答案为 <span class="arithmatex">\(f[n]\)</span>。</p>
<p>考虑 <span class="arithmatex">\(f[i]\)</span>，如果存在 <span class="arithmatex">\(j \in [0, i)\)</span> 使得 <span class="arithmatex">\(f[j] \land s[j:i] \in wordDict\)</span>，则 <span class="arithmatex">\(f[i]=true\)</span>。为了优化效率，我们可以使用哈希表存储 <span class="arithmatex">\(wordDict\)</span> 中的单词，这样可以快速判断 <span class="arithmatex">\(s[j:i]\)</span> 是否在 <span class="arithmatex">\(wordDict\)</span> 中。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n^3)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为字符串 <span class="arithmatex">\(s\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public boolean wordBreak(String s, List&lt;String&gt; wordDict) {
        Set&lt;String&gt; words = new HashSet&lt;&gt;(wordDict);
        int n = s.length();
        boolean[] f = new boolean[n + 1];
        f[0] = true;
        for (int i = 1; i &lt;= n; ++i) {
            for (int j = 0; j &lt; i; ++j) {
                if (f[j] &amp;&amp; words.contains(s.substring(j, i))) {
                    f[i] = true;
                    break;
                }
            }
        }
        return f[n];
    }
}
</code></pre>

</section></template>
<template id="panel-q-95"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">95</span>    <h2 class="q-title">227. 基本计算器 II</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 69</span>    <span class="pill algo">栈、数学、字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/basic-calculator-ii" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个字符串表达式<code>s</code>，请你实现一个基本计算器来计算并返回它的值。</p>
<p>整数除法仅保留整数部分。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;3+2*2&quot;
输出：7
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：s = &quot; 3/2 &quot;
输出：1
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：s = &quot; 3+5 / 2 &quot;
输出：5
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= s.length &lt;= 3 * 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>s</code>由整数和算符<code>('+', '-', '*', '/')</code>组成，中间由一些空格隔开</li>
<li><code>s</code>表示一个<strong>有效表达式</strong></li>
<li>表达式中的所有整数都是非负整数，且在范围<code>[0, 2&lt;sup&gt;31&lt;/sup&gt; - 1]</code>内</li>
<li>题目数据保证答案是一个<strong>32-bit 整数</strong></li>
</ul></section><section class="q-block solution"><p><strong>方法一：栈</strong></p>
<p>遍历字符串 <span class="arithmatex">\(s\)</span>，并用变量 <code>sign</code> 记录每个数字之前的运算符，对于第一个数字，其之前的运算符视为加号。每次遍历到数字末尾时，根据 <code>sign</code> 来决定计算方式：</p>
<ul>
<li>加号：将数字压入栈；</li>
<li>减号：将数字的相反数压入栈；</li>
<li>乘除号：计算数字与栈顶元素，并将栈顶元素替换为计算结果。</li>
</ul>
<p>遍历结束后，将栈中元素求和即为答案。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为字符串 <span class="arithmatex">\(s\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int calculate(String s) {
        Deque&lt;Integer&gt; stk = new ArrayDeque&lt;&gt;();
        char sign = '+';
        int v = 0;
        for (int i = 0; i &lt; s.length(); ++i) {
            char c = s.charAt(i);
            if (Character.isDigit(c)) {
                v = v * 10 + (c - '0');
            }
            if (i == s.length() - 1 || c == '+' || c == '-' || c == '*' || c == '/') {
                if (sign == '+') {
                    stk.push(v);
                } else if (sign == '-') {
                    stk.push(-v);
                } else if (sign == '*') {
                    stk.push(stk.pop() * v);
                } else {
                    stk.push(stk.pop() / v);
                }
                sign = c;
                v = 0;
            }
        }
        int ans = 0;
        while (!stk.isEmpty()) {
            ans += stk.pop();
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-96"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">96</span>    <h2 class="q-title">718. 最长重复子数组</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 68</span>    <span class="pill algo">数组、二分查找、动态规划、滑动窗口、哈希函数、滚动哈希</span>    <a class="pill link" href="https://leetcode.cn/problems/maximum-length-of-repeated-subarray" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给两个整数数组<code>A</code>和<code>B</code>，返回两个数组中公共的、长度最长的子数组的长度。</p>
<p><strong>示例：</strong></p>
<pre><code class="language-text">输入：
A: [1,2,3,2,1]
B: [3,2,1,4,7]
输出：3
解释：
长度最长的公共子数组是 [3, 2, 1] 。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= len(A), len(B) &lt;= 1000</code></li>
<li><code>0 &lt;= A[i], B[i] &lt; 100</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：动态规划</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i][j]\)</span> 表示以 <span class="arithmatex">\(nums1[i - 1]\)</span> 和 <span class="arithmatex">\(nums2[j - 1]\)</span> 结尾的最长公共子数组的长度，那么我们可以得到状态转移方程：</p>
<div class="arithmatex">\[
f[i][j]=
\begin{cases}
0, &amp; nums1[i - 1] \neq nums2[j - 1] \\
f[i - 1][j - 1] + 1, &amp; nums1[i - 1] = nums2[j - 1]
\end{cases}
\]</div>
<p>最终的答案即为所有 <span class="arithmatex">\(f[i][j]\)</span> 中的最大值。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别是数组 <span class="arithmatex">\(nums1\)</span> 和 <span class="arithmatex">\(nums2\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int findLength(int[] nums1, int[] nums2) {
        int m = nums1.length;
        int n = nums2.length;
        int[][] f = new int[m + 1][n + 1];
        int ans = 0;
        for (int i = 1; i &lt;= m; ++i) {
            for (int j = 1; j &lt;= n; ++j) {
                if (nums1[i - 1] == nums2[j - 1]) {
                    f[i][j] = f[i - 1][j - 1] + 1;
                    ans = Math.max(ans, f[i][j]);
                }
            }
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-97"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">97</span>    <h2 class="q-title">226. 翻转二叉树</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 68</span>    <span class="pill algo">树、深度优先搜索、广度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/invert-binary-tree" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>翻转一棵二叉树。</p>
<p><strong>示例：</strong></p>
<p>输入：</p>
<pre><code class="language-text">     4
   /   \
  2     7
 / \   / \
1   3 6   9
</code></pre>
<p>输出：</p>
<pre><code class="language-text">     4
   /   \
  7     2
 / \   / \
9   6 3   1
</code></pre>
<p><strong>备注:</strong>
这个问题是受到<a href="https://twitter.com/mxcl">Max Howell</a> 的<a href="https://twitter.com/mxcl/status/608682016205344768">原问题</a> 启发的 ：</p>
<p>谷歌：我们90％的工程师使用您编写的软件(Homebrew)，但是您却无法在面试时在白板上写出翻转二叉树这道题，这太糟糕了。</p></section><section class="q-block solution"><p><strong>方法一：递归</strong></p>
<p>我们首先判断 <span class="arithmatex">\(\textit{root}\)</span> 是否为空，若为空则直接返回 <span class="arithmatex">\(\text{null}\)</span>。然后递归地对树的左右子树进行翻转，将翻转后的右子树作为新的左子树，将翻转后的左子树作为新的右子树，返回 <span class="arithmatex">\(\textit{root}\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点个数。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public TreeNode invertTree(TreeNode root) {
        if (root == null) {
            return null;
        }
        TreeNode l = invertTree(root.left);
        TreeNode r = invertTree(root.right);
        root.left = r;
        root.right = l;
        return root;
    }
}
</code></pre>

</section></template>
<template id="panel-q-98"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">98</span>    <h2 class="q-title">169. 多数元素</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 68</span>    <span class="pill algo">数组、哈希表、分治、计数、排序</span>    <a class="pill link" href="https://leetcode.cn/problems/majority-element" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个大小为<em>n</em>的数组，找到其中的多数元素。多数元素是指在数组中出现次数<strong>大于</strong><code>⌊ n/2 ⌋</code>的元素。</p>
<p>你可以假设数组是非空的，并且给定的数组总是存在多数元素。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：[3,2,3]
输出：3
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：[2,2,1,1,1,2,2]
输出：2
</code></pre>
<p><strong>进阶：</strong></p>
<ul>
<li>尝试设计时间复杂度为 O(n)、空间复杂度为 O(1) 的算法解决此问题。</li>
</ul></section><section class="q-block solution"><p><strong>方法一：摩尔投票法</strong></p>
<p>摩尔投票法的基本步骤如下：</p>
<p>初始化元素 <span class="arithmatex">\(m\)</span>，并初始化计数器 <span class="arithmatex">\(cnt=0\)</span>。接下来，对于输入列表中每一个元素 <span class="arithmatex">\(x\)</span>：</p>
<ol>
<li>如果 <span class="arithmatex">\(cnt=0\)</span>，那么 <span class="arithmatex">\(m=x\)</span> 并且 <span class="arithmatex">\(cnt=1\)</span>；</li>
<li>否则，如果 <span class="arithmatex">\(m=x\)</span>，那么 <span class="arithmatex">\(cnt = cnt + 1\)</span>，否则 <span class="arithmatex">\(cnt = cnt - 1\)</span>。</li>
</ol>
<p>一般而言，摩尔投票法需要对输入的列表进行<strong>两次遍历</strong>。在第一次遍历中，我们生成候选值 <span class="arithmatex">\(m\)</span>，如果存在多数，那么该候选值就是多数值。在第二次遍历中，只需要简单地计算候选值的频率，以确认是否是多数值。由于本题已经明确说明存在多数值，所以第一次遍历结束后，直接返回 <span class="arithmatex">\(m\)</span> 即可，无需二次遍历确认是否是多数值。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组 <span class="arithmatex">\(nums\)</span> 的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int majorityElement(int[] nums) {
        int cnt = 0, m = 0;
        for (int x : nums) {
            if (cnt == 0) {
                m = x;
                cnt = 1;
            } else {
                cnt += m == x ? 1 : -1;
            }
        }
        return m;
    }
}
</code></pre>

</section></template>
<template id="panel-q-99"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">99</span>    <h2 class="q-title">207. 课程表</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 67</span>    <span class="pill algo">深度优先搜索、广度优先搜索、图、拓扑排序</span>    <a class="pill link" href="https://leetcode.cn/problems/course-schedule" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>你这个学期必须选修<code>numCourses</code>门课程，记为<code>0</code>到<code>numCourses - 1</code>。</p>
<p>在选修某些课程之前需要一些先修课程。 先修课程按数组<code>prerequisites</code>给出，其中<code>prerequisites[i] = [a&lt;sub&gt;i&lt;/sub&gt; , b&lt;sub&gt;i&lt;/sub&gt; ]</code>，表示如果要学习课程<code>a&lt;sub&gt;i&lt;/sub&gt;</code>则<strong>必须</strong>先学习课程<code>b&lt;sub&gt;i&lt;/sub&gt;</code><sub></sub> 。</p>
<ul>
<li>例如，先修课程对<code>[0, 1]</code>表示：想要学习课程<code>0</code>，你需要先完成课程<code>1</code>。</li>
</ul>
<p>请你判断是否可能完成所有课程的学习？如果可以，返回<code>true</code>；否则，返回<code>false</code>。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：numCourses = 2, prerequisites = [[1,0]]
输出：true
解释：总共有 2 门课程。学习课程 1 之前，你需要完成课程 0 。这是可能的。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：numCourses = 2, prerequisites = [[1,0],[0,1]]
输出：false
解释：总共有 2 门课程。学习课程 1 之前，你需要先完成​课程 0 ；并且学习课程 0 之前，你还应先完成课程 1 。这是不可能的。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= numCourses &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>0 &lt;= prerequisites.length &lt;= 5000</code></li>
<li><code>prerequisites[i].length == 2</code></li>
<li><code>0 &lt;= a&lt;sub&gt;i&lt;/sub&gt; , b&lt;sub&gt;i&lt;/sub&gt; &lt; numCourses</code></li>
<li><code>prerequisites[i]</code>中的所有课程对<strong>互不相同</strong></li>
</ul></section><section class="q-block solution"><p><strong>方法一：拓扑排序</strong></p>
<p>对于本题，我们可以将课程看作图中的节点，先修课程看作图中的边，那么我们可以将本题转化为判断有向图中是否存在环。</p>
<p>具体地，我们可以使用拓扑排序的思想，对于每个入度为 <span class="arithmatex">\(0\)</span> 的节点，我们将其出度的节点的入度减 <span class="arithmatex">\(1\)</span>，直到所有节点都被遍历到。</p>
<p>如果所有节点都被遍历到，说明图中不存在环，那么我们就可以完成所有课程的学习；否则，我们就无法完成所有课程的学习。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n + m)\)</span>，空间复杂度 <span class="arithmatex">\(O(n + m)\)</span>。其中 <span class="arithmatex">\(n\)</span> 和 <span class="arithmatex">\(m\)</span> 分别为课程数和先修课程数。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public boolean canFinish(int numCourses, int[][] prerequisites) {
        List&lt;Integer&gt;[] g = new List[numCourses];
        Arrays.setAll(g, k -&gt; new ArrayList&lt;&gt;());
        int[] indeg = new int[numCourses];
        for (var p : prerequisites) {
            int a = p[0], b = p[1];
            g[b].add(a);
            ++indeg[a];
        }
        Deque&lt;Integer&gt; q = new ArrayDeque&lt;&gt;();
        for (int i = 0; i &lt; numCourses; ++i) {
            if (indeg[i] == 0) {
                q.offer(i);
            }
        }
        while (!q.isEmpty()) {
            int i = q.poll();
            --numCourses;
            for (int j : g[i]) {
                if (--indeg[j] == 0) {
                    q.offer(j);
                }
            }
        }
        return numCourses == 0;
    }
}
</code></pre>

</section></template>
<template id="panel-q-100"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">100</span>    <h2 class="q-title">283. 移动零</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 67</span>    <span class="pill algo">数组、双指针</span>    <a class="pill link" href="https://leetcode.cn/problems/move-zeroes" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个数组<code>nums</code>，编写一个函数将所有<code>0</code>移动到数组的末尾，同时保持非零元素的相对顺序。</p>
<p><strong>示例:</strong></p>
<pre><code class="language-text">输入: [0,1,0,3,12]
输出: [1,3,12,0,0]
</code></pre>
<p><strong>说明</strong>:</p>
<ol>
<li>必须在原数组上操作，不能拷贝额外的数组。</li>
<li>尽量减少操作次数。</li>
</ol></section><section class="q-block solution"><p><strong>方法一：双指针</strong></p>
<p>我们用一个指针 <span class="arithmatex">\(k\)</span> 记录当前待插入的位置，初始时 <span class="arithmatex">\(k = 0\)</span>。</p>
<p>然后我们遍历数组 <span class="arithmatex">\(\textit{nums}\)</span>，每次遇到一个非零数，就将其与 <span class="arithmatex">\(\textit{nums}[k]\)</span> 交换，同时将 <span class="arithmatex">\(k\)</span> 的值加 <span class="arithmatex">\(1\)</span>。</p>
<p>这样我们就可以保证 <span class="arithmatex">\(\textit{nums}\)</span> 的前 <span class="arithmatex">\(k\)</span> 个元素都是非零的，且它们的相对顺序与原数组一致。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组 <span class="arithmatex">\(\textit{nums}\)</span> 的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public void moveZeroes(int[] nums) {
        int k = 0, n = nums.length;
        for (int i = 0; i &lt; n; ++i) {
            if (nums[i] != 0) {
                int t = nums[i];
                nums[i] = nums[k];
                nums[k++] = t;
            }
        }
    }
}
</code></pre>

</section></template>
<template id="panel-q-101"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">101</span>    <h2 class="q-title">739. 每日温度</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 63</span>    <span class="pill algo">栈、数组、单调栈</span>    <a class="pill link" href="https://leetcode.cn/problems/daily-temperatures" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>请根据每日<code>气温</code>列表<code>temperatures</code>， 请计算在每一天需要等几天才会有更高的温度 。如果气温在这之后都不会升高，请在该位置用<code>0</code>来代替。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">
输入: temperatures = [73,74,75,71,69,72,76,73]
输出: [1,1,4,2,1,1,0,0]
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
输入: temperatures = [30,40,50,60]
输出: [1,1,1,0]
</code></pre>
<p><strong>示例 3:</strong></p>
<pre><code class="language-text">
输入: temperatures = [30,60,90]
输出: [1,1,0]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= temperatures.length &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>30 &lt;= temperatures[i] &lt;= 100</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：单调栈</strong></p>
<p>本题需要我们找出每个元素右边第一个比它大的元素的位置，这是一个典型的单调栈应用场景。</p>
<p>我们从右往左遍历数组 <span class="arithmatex">\(\textit{temperatures}\)</span>，维护一个从栈顶到栈底温度单调递增的栈 <span class="arithmatex">\(\textit{stk}\)</span>，栈中存储的是数组元素的下标。对于每个元素 <span class="arithmatex">\(\textit{temperatures}[i]\)</span>，我们不断将其与栈顶元素进行比较，如果栈顶元素对应的温度小于等于 <span class="arithmatex">\(\textit{temperatures}[i]\)</span>，那么循环将栈顶元素弹出，直到栈为空或者栈顶元素对应的温度大于 <span class="arithmatex">\(\textit{temperatures}[i]\)</span>。此时，栈顶元素就是右边第一个比 <span class="arithmatex">\(\textit{temperatures}[i]\)</span> 大的元素，距离为 <span class="arithmatex">\(\textit{stk.top()} - i\)</span>，我们更新答案数组。然后将 <span class="arithmatex">\(\textit{temperatures}[i]\)</span> 入栈，继续遍历。</p>
<p>遍历结束后，返回答案数组即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为数组 <span class="arithmatex">\(\textit{temperatures}\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int[] dailyTemperatures(int[] temperatures) {
        int n = temperatures.length;
        Deque&lt;Integer&gt; stk = new ArrayDeque&lt;&gt;();
        int[] ans = new int[n];
        for (int i = n - 1; i &gt;= 0; --i) {
            while (!stk.isEmpty() &amp;&amp; temperatures[stk.peek()] &lt;= temperatures[i]) {
                stk.pop();
            }
            if (!stk.isEmpty()) {
                ans[i] = stk.peek() - i;
            }
            stk.push(i);
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-102"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">102</span>    <h2 class="q-title">补充题6. 手撕堆排序</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 63</span>    <span class="pill algo">数组、排序、堆（优先队列）、堆排序</span>    <a class="pill link" href="https://leetcode.cn/problems/sort-an-array" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个整数数组<code>nums</code>，请你将该数组升序排列。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入：nums = [5,2,3,1]输出：[1,2,3,5]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入：nums = [5,1,1,2,0,0]输出：[0,0,1,1,2,5]
</code></pre>
<p><strong>提示：</strong></p>
<ol>
<li><code>1 &lt;= nums.length &lt;= 50000</code></li>
<li><code>-50000 &lt;= nums[i] &lt;= 50000</code></li>
</ol></section><section class="q-block solution"><p><strong>堆排序</strong></p>
<p>先从最后一个非叶子节点向前下沉，在线性时间内建立大顶堆。随后反复把堆顶最大值交换到数组末尾，并在缩小后的堆中恢复堆序。</p>
<p>时间复杂度稳定为 <span class="arithmatex">\(O(n\log n)\)</span>，额外空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int[] sortArray(int[] nums) {
        int n = nums.length;
        for (int i = n / 2 - 1; i &gt;= 0; i--) siftDown(nums, i, n);
        for (int end = n - 1; end &gt; 0; end--) {
            swap(nums, 0, end);
            siftDown(nums, 0, end);
        }
        return nums;
    }

    private void siftDown(int[] nums, int root, int size) {
        while (root * 2 + 1 &lt; size) {
            int child = root * 2 + 1;
            if (child + 1 &lt; size &amp;&amp; nums[child + 1] &gt; nums[child]) child++;
            if (nums[root] &gt;= nums[child]) break;
            swap(nums, root, child);
            root = child;
        }
    }

    private void swap(int[] nums, int i, int j) {
        int t = nums[i]; nums[i] = nums[j]; nums[j] = t;
    }
}
</code></pre>

</section></template>
<template id="panel-q-103"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">103</span>    <h2 class="q-title">79. 单词搜索</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 61</span>    <span class="pill algo">深度优先搜索、数组、字符串、回溯、矩阵</span>    <a class="pill link" href="https://leetcode.cn/problems/word-search" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个<code>m x n</code>二维字符网格<code>board</code>和一个字符串单词<code>word</code>。如果<code>word</code>存在于网格中，返回<code>true</code>；否则，返回<code>false</code>。</p>
<p>单词必须按照字母顺序，通过相邻的单元格内的字母构成，其中“相邻”单元格是那些水平相邻或垂直相邻的单元格。同一个单元格内的字母不允许被重复使用。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/11/04/word2.jpg" /></p>
<pre><code class="language-text">
输入：board = [[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;,&quot;E&quot;],[&quot;S&quot;,&quot;F&quot;,&quot;C&quot;,&quot;S&quot;],[&quot;A&quot;,&quot;D&quot;,&quot;E&quot;,&quot;E&quot;]], word = &quot;ABCCED&quot;
输出：true
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/11/04/word-1.jpg" /></p>
<pre><code class="language-text">
输入：board = [[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;,&quot;E&quot;],[&quot;S&quot;,&quot;F&quot;,&quot;C&quot;,&quot;S&quot;],[&quot;A&quot;,&quot;D&quot;,&quot;E&quot;,&quot;E&quot;]], word = &quot;SEE&quot;
输出：true
</code></pre>
<p><strong>示例 3：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/10/15/word3.jpg" /></p>
<pre><code class="language-text">
输入：board = [[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;,&quot;E&quot;],[&quot;S&quot;,&quot;F&quot;,&quot;C&quot;,&quot;S&quot;],[&quot;A&quot;,&quot;D&quot;,&quot;E&quot;,&quot;E&quot;]], word = &quot;ABCB&quot;
输出：false
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>m == board.length</code></li>
<li><code>n = board[i].length</code></li>
<li><code>1 &lt;= m, n &lt;= 6</code></li>
<li><code>1 &lt;= word.length &lt;= 15</code></li>
<li><code>board</code>和<code>word</code>仅由大小写英文字母组成</li>
</ul>
<p><strong>进阶：</strong>你可以使用搜索剪枝的技术来优化解决方案，使其在<code>board</code>更大的情况下可以更快解决问题？</p></section><section class="q-block solution"><p><strong>方法一：DFS(回溯)</strong></p>
<p>我们可以枚举网格的每一个位置 <span class="arithmatex">\((i, j)\)</span> 作为搜索的起点，然后从起点开始进行深度优先搜索，如果可以搜索到单词的末尾，就说明单词存在，否则说明单词不存在。</p>
<p>因此，我们设计一个函数 <span class="arithmatex">\(dfs(i, j, k)\)</span>，表示从网格的 <span class="arithmatex">\((i, j)\)</span> 位置出发，且从单词的第 <span class="arithmatex">\(k\)</span> 个字符开始搜索，是否能够搜索成功。函数 <span class="arithmatex">\(dfs(i, j, k)\)</span> 的执行步骤如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(k = |word|-1\)</span>，说明已经搜索到单词的最后一个字符，此时只需要判断网格 <span class="arithmatex">\((i, j)\)</span> 位置的字符是否等于 <span class="arithmatex">\(word[k]\)</span>，如果相等则说明单词存在，否则说明单词不存在。无论单词是否存在，都无需继续往下搜索，因此直接返回结果。</li>
<li>否则，如果 <span class="arithmatex">\(word[k]\)</span> 字符不等于网格 <span class="arithmatex">\((i, j)\)</span> 位置的字符，说明本次搜索失败，直接返回 <code>false</code>。</li>
<li>否则，我们将网格 <span class="arithmatex">\((i, j)\)</span> 位置的字符暂存于 <span class="arithmatex">\(c\)</span> 中，然后将此位置的字符修改为一个特殊字符 <code>'0'</code>，代表此位置的字符已经被使用过，防止之后搜索时重复使用。然后我们从 <span class="arithmatex">\((i, j)\)</span> 位置的上、下、左、右四个方向分别出发，去搜索网格中第 <span class="arithmatex">\(k+1\)</span> 个字符，如果四个方向有任何一个方向搜索成功，就说明搜索成功，否则说明搜索失败，此时我们需要还原网格 <span class="arithmatex">\((i, j)\)</span> 位置的字符，即把 <span class="arithmatex">\(c\)</span> 放回网格 <span class="arithmatex">\((i, j)\)</span> 位置（回溯）。</li>
</ul>
<p>在主函数中，我们枚举网格中的每一个位置 <span class="arithmatex">\((i, j)\)</span> 作为起点，如果调用 <span class="arithmatex">\(dfs(i, j, 0)\)</span> 返回 <code>true</code>，就说明单词存在，否则说明单词不存在，返回 <code>false</code>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m \times n \times 3^k)\)</span>，空间复杂度 <span class="arithmatex">\(O(\min(m \times n, k))\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别是网格的行数和列数；而 <span class="arithmatex">\(k\)</span> 是字符串 <span class="arithmatex">\(word\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private int m;
    private int n;
    private String word;
    private char[][] board;

    public boolean exist(char[][] board, String word) {
        m = board.length;
        n = board[0].length;
        this.word = word;
        this.board = board;
        for (int i = 0; i &lt; m; ++i) {
            for (int j = 0; j &lt; n; ++j) {
                if (dfs(i, j, 0)) {
                    return true;
                }
            }
        }
        return false;
    }

    private boolean dfs(int i, int j, int k) {
        if (k == word.length() - 1) {
            return board[i][j] == word.charAt(k);
        }
        if (board[i][j] != word.charAt(k)) {
            return false;
        }
        char c = board[i][j];
        board[i][j] = '0';
        int[] dirs = {-1, 0, 1, 0, -1};
        for (int u = 0; u &lt; 4; ++u) {
            int x = i + dirs[u], y = j + dirs[u + 1];
            if (x &gt;= 0 &amp;&amp; x &lt; m &amp;&amp; y &gt;= 0 &amp;&amp; y &lt; n &amp;&amp; board[x][y] != '0' &amp;&amp; dfs(x, y, k + 1)) {
                return true;
            }
        }
        board[i][j] = c;
        return false;
    }
}
</code></pre>

</section></template>
<template id="panel-q-104"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">104</span>    <h2 class="q-title">468. 验证IP地址</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 61</span>    <span class="pill algo">字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/validate-ip-address" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>编写一个函数来验证输入的字符串是否是有效的 IPv4 或 IPv6 地址。</p>
<ul>
<li>如果是有效的 IPv4 地址，返回<code>"IPv4"</code>；</li>
<li>如果是有效的 IPv6 地址，返回<code>"IPv6"</code>；</li>
<li>如果不是上述类型的 IP 地址，返回<code>"Neither"</code>。</li>
</ul>
<p><strong>IPv4</strong>地址由十进制数和点来表示，每个地址包含 4 个十进制数，其范围为 0 - 255， 用(".")分割。比如，<code>172.16.254.1</code>；</p>
<p>同时，IPv4 地址内的数不会以 0 开头。比如，地址<code>172.16.254.01</code>是不合法的。</p>
<p><strong>IPv6</strong>地址由 8 组 16 进制的数字来表示，每组表示 16 比特。这些组数字通过 (":")分割。比如,<code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code>是一个有效的地址。而且，我们可以加入一些以 0 开头的数字，字母可以使用大写，也可以是小写。所以，<code>2001:db8:85a3:0:0:8A2E:0370:7334</code>也是一个有效的 IPv6 address地址 (即，忽略 0 开头，忽略大小写)。</p>
<p>然而，我们不能因为某个组的值为 0，而使用一个空的组，以至于出现 (::) 的情况。 比如，<code>2001:0db8:85a3::8A2E:0370:7334</code>是无效的 IPv6 地址。</p>
<p>同时，在 IPv6 地址中，多余的 0 也是不被允许的。比如，<code>02001:0db8:85a3:0000:0000:8a2e:0370:7334</code>是无效的。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入：IP = &quot;172.16.254.1&quot;
输出：&quot;IPv4&quot;
解释：有效的 IPv4 地址，返回 &quot;IPv4&quot;
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入：IP = &quot;2001:0db8:85a3:0:0:8A2E:0370:7334&quot;
输出：&quot;IPv6&quot;
解释：有效的 IPv6 地址，返回 &quot;IPv6&quot;
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">输入：IP = &quot;256.256.256.256&quot;
输出：&quot;Neither&quot;
解释：既不是 IPv4 地址，又不是 IPv6 地址
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">输入：IP = &quot;2001:0db8:85a3:0:0:8A2E:0370:7334:&quot;
输出：&quot;Neither&quot;
</code></pre>
<p><strong>示例 5：</strong></p>
<pre><code class="language-text">输入：IP = &quot;1e1.4.5.6&quot;
输出：&quot;Neither&quot;
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>IP</code>仅由英文字母，数字，字符<code>'.'</code>和<code>':'</code>组成。</li>
</ul></section><section class="q-block solution"><p><strong>方法一：模拟</strong></p>
<p>我们可以定义两个函数 <code>isIPv4</code> 和 <code>isIPv6</code> 来判断一个字符串是否是有效的 IPv4 地址和 IPv6 地址。</p>
<p>函数 <code>isIPv4</code> 的实现如下：</p>
<ol>
<li>我们首先判断字符串 <code>s</code> 是否以 <code>.</code> 结尾，如果是的话，说明 <code>s</code> 不是一个有效的 IPv4 地址，直接返回 <code>false</code>。</li>
<li>然后我们将字符串 <code>s</code> 以 <code>.</code> 分割成一个字符串数组 <code>ss</code>，如果 <code>ss</code> 的长度不等于 <code>4</code>，说明 <code>s</code> 不是一个有效的 IPv4 地址，直接返回 <code>false</code>。</li>
<li>对于数组 <code>ss</code> 中的每个字符串 <code>t</code>，我们判断：<ul>
<li>如果 <code>t</code> 的长度大于 <code>1</code> 且 <code>t</code> 的第一个字符是 <code>0</code>，说明 <code>t</code> 不是一个有效的 IPv4 地址，直接返回 <code>false</code>。</li>
<li>如果 <code>t</code> 不是一个数字或者 <code>t</code> 不在 <code>0</code> 到 <code>255</code> 的范围内，说明 <code>t</code> 不是一个有效的 IPv4 地址，直接返回 <code>false</code>。</li>
</ul>
</li>
<li>如果上述条件都不满足，说明 <code>s</code> 是一个有效的 IPv4 地址，返回 <code>true</code>。</li>
</ol>
<p>函数 <code>isIPv6</code> 的实现如下：</p>
<ol>
<li>我们首先判断字符串 <code>s</code> 是否以 <code>:</code> 结尾，如果是的话，说明 <code>s</code> 不是一个有效的 IPv6 地址，直接返回 <code>false</code>。</li>
<li>然后我们将字符串 <code>s</code> 以 <code>:</code> 分割成一个字符串数组 <code>ss</code>，如果 <code>ss</code> 的长度不等于 <code>8</code>，说明 <code>s</code> 不是一个有效的 IPv6 地址，直接返回 <code>false</code>。</li>
<li>对于数组 <code>ss</code> 中的每个字符串 <code>t</code>，我们判断：<ul>
<li>如果 <code>t</code> 的长度小于 <code>1</code> 或大于 <code>4</code>，说明 <code>t</code> 不是一个有效的 IPv6 地址，直接返回 <code>false</code>。</li>
<li>如果 <code>t</code> 中的字符不全是 <code>0</code> 到 <code>9</code> 和 <code>a</code> 到 <code>f</code>（不区分大小写），说明 <code>t</code> 不是一个有效的 IPv6 地址，直接返回 <code>false</code>。</li>
</ul>
</li>
<li>如果上述条件都不满足，说明 <code>s</code> 是一个有效的 IPv6 地址，返回 <code>true</code>。</li>
</ol>
<p>最后，我们调用 <code>isIPv4</code> 和 <code>isIPv6</code> 函数判断 <code>queryIP</code> 是不是一个有效的 IPv4 地址或 IPv6 地址，如果都不是，返回 <code>Neither</code>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为字符串 <code>queryIP</code> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public String validIPAddress(String queryIP) {
        if (isIPv4(queryIP)) {
            return &quot;IPv4&quot;;
        }
        if (isIPv6(queryIP)) {
            return &quot;IPv6&quot;;
        }
        return &quot;Neither&quot;;
    }

    private boolean isIPv4(String s) {
        if (s.endsWith(&quot;.&quot;)) {
            return false;
        }
        String[] ss = s.split(&quot;\\.&quot;);
        if (ss.length != 4) {
            return false;
        }
        for (String t : ss) {
            if (t.length() == 0 || t.length() &gt; 1 &amp;&amp; t.charAt(0) == '0') {
                return false;
            }
            int x = convert(t);
            if (x &lt; 0 || x &gt; 255) {
                return false;
            }
        }
        return true;
    }

    private boolean isIPv6(String s) {
        if (s.endsWith(&quot;:&quot;)) {
            return false;
        }
        String[] ss = s.split(&quot;:&quot;);
        if (ss.length != 8) {
            return false;
        }
        for (String t : ss) {
            if (t.length() &lt; 1 || t.length() &gt; 4) {
                return false;
            }
            for (char c : t.toCharArray()) {
                if (!Character.isDigit(c)
                    &amp;&amp; !&quot;0123456789abcdefABCDEF&quot;.contains(String.valueOf(c))) {
                    return false;
                }
            }
        }
        return true;
    }

    private int convert(String s) {
        int x = 0;
        for (char c : s.toCharArray()) {
            if (!Character.isDigit(c)) {
                return -1;
            }
            x = x * 10 + (c - '0');
            if (x &gt; 255) {
                return x;
            }
        }
        return x;
    }
}
</code></pre>
