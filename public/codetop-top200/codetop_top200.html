<p>我们设计一个函数 <span class="arithmatex">\(dfs(l, r, t)\)</span>，其中 <span class="arithmatex">\(l\)</span> 和 <span class="arithmatex">\(r\)</span> 分别表示左括号和右括号的数量，而 <span class="arithmatex">\(t\)</span> 表示当前的括号序列。那么我们可以得到如下的递归结构：</p>
<ul>
<li>如果 <span class="arithmatex">\(l \gt n\)</span> 或者 <span class="arithmatex">\(r \gt n\)</span> 或者 <span class="arithmatex">\(l \lt r\)</span>，那么当前括号组合 <span class="arithmatex">\(t\)</span> 不合法，直接返回；</li>
<li>如果 <span class="arithmatex">\(l = n\)</span> 且 <span class="arithmatex">\(r = n\)</span>，那么当前括号组合 <span class="arithmatex">\(t\)</span> 合法，将其加入答案数组 <code>ans</code> 中，直接返回；</li>
<li>我们可以选择添加一个左括号，递归执行 <code>dfs(l + 1, r, t + "(")</code>；</li>
<li>我们也可以选择添加一个右括号，递归执行 <code>dfs(l, r + 1, t + ")")</code>。</li>
</ul>
<p>时间复杂度 <span class="arithmatex">\(O(2^{n\times 2} \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private List&lt;String&gt; ans = new ArrayList&lt;&gt;();
    private int n;

    public List&lt;String&gt; generateParenthesis(int n) {
        this.n = n;
        dfs(0, 0, &quot;&quot;);
        return ans;
    }

    private void dfs(int l, int r, String t) {
        if (l &gt; n || r &gt; n || l &lt; r) {
            return;
        }
        if (l == n &amp;&amp; r == n) {
            ans.add(t);
            return;
        }
        dfs(l + 1, r, t + &quot;(&quot;);
        dfs(l, r + 1, t + &quot;)&quot;);
    }
}
</code></pre>

</section></template>
<template id="panel-q-44"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">44</span>    <h2 class="q-title">32. 最长有效括号</h2>  </div>  <div class="q-meta">    <span class="pill diff hard">困难</span>    <span class="pill freq">频度 148</span>    <span class="pill algo">栈、字符串、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/longest-valid-parentheses" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个只包含<code>'('</code>和<code>')'</code>的字符串，找出最长有效（格式正确且连续）括号子串的长度。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;(()&quot;
输出：2
解释：最长有效括号子串是 &quot;()&quot;
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：s = &quot;)()())&quot;
输出：4
解释：最长有效括号子串是 &quot;()()&quot;
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：s = &quot;&quot;
输出：0
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>0 &lt;= s.length &lt;= 3 * 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>s[i]</code>为<code>'('</code>或<code>')'</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：动态规划</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i]\)</span> 表示以 <span class="arithmatex">\(s[i-1]\)</span> 结尾的最长有效括号的长度，那么答案就是 <span class="arithmatex">\(\max\limits_{i=1}^n f[i]\)</span>。</p>
<ul>
<li>如果 <span class="arithmatex">\(s[i-1]\)</span> 是左括号，那么以 <span class="arithmatex">\(s[i-1]\)</span> 结尾的最长有效括号的长度一定为 <span class="arithmatex">\(0\)</span>，因此 <span class="arithmatex">\(f[i] = 0\)</span>。</li>
<li>如果 <span class="arithmatex">\(s[i-1]\)</span> 是右括号，有以下两种情况：<ul>
<li>如果 <span class="arithmatex">\(s[i-2]\)</span> 是左括号，那么以 <span class="arithmatex">\(s[i-1]\)</span> 结尾的最长有效括号的长度为 <span class="arithmatex">\(f[i-2] + 2\)</span>。</li>
<li>如果 <span class="arithmatex">\(s[i-2]\)</span> 是右括号，那么以 <span class="arithmatex">\(s[i-1]\)</span> 结尾的最长有效括号的长度为 <span class="arithmatex">\(f[i-1] + 2\)</span>，但是还需要考虑 <span class="arithmatex">\(s[i-f[i-1]-2]\)</span> 是否是左括号，如果是左括号，那么以 <span class="arithmatex">\(s[i-1]\)</span> 结尾的最长有效括号的长度为 <span class="arithmatex">\(f[i-1] + 2 + f[i-f[i-1]-2]\)</span>。</li>
</ul>
</li>
</ul>
<p>因此，我们可以得到状态转移方程：</p>
<div class="arithmatex">\[
\begin{cases}
f[i] = 0, &amp; \textit{if } s[i-1] = '(',\\
f[i] = f[i-2] + 2, &amp; \textit{if } s[i-1] = ')' \textit{ and } s[i-2] = '(',\\
f[i] = f[i-1] + 2 + f[i-f[i-1]-2], &amp; \textit{if } s[i-1] = ')' \textit{ and } s[i-2] = ')' \textit{ and } s[i-f[i-1]-2] = '(',\\
\end{cases}
\]</div>
<p>最后返回 <span class="arithmatex">\(\max\limits_{i=1}^n f[i]\)</span> 即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为字符串的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int longestValidParentheses(String s) {
        int n = s.length();
        int[] f = new int[n + 1];
        int ans = 0;
        for (int i = 2; i &lt;= n; ++i) {
            if (s.charAt(i - 1) == ')') {
                if (s.charAt(i - 2) == '(') {
                    f[i] = f[i - 2] + 2;
                } else {
                    int j = i - f[i - 1] - 1;
                    if (j &gt; 0 &amp;&amp; s.charAt(j - 1) == '(') {
                        f[i] = f[i - 1] + 2 + f[j - 1];
                    }
                }
                ans = Math.max(ans, f[i]);
            }
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-45"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">45</span>    <h2 class="q-title">69. x 的平方根</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 147</span>    <span class="pill algo">数学、二分查找</span>    <a class="pill link" href="https://leetcode.cn/problems/sqrtx" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个非负整数<code>x</code>，计算并返回<code>x</code>的<strong>平方根</strong>。</p>
<p>由于返回类型是整数，结果只保留<strong>整数部分</strong>，小数部分将被<strong>舍去 。</strong></p>
<p><strong>注意：</strong>不允许使用任何内置指数函数和算符，例如<code>pow(x, 0.5)</code>或者<code>x**0.5</code>。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：x = 4
输出：2
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：x = 8
输出：2
解释：8 的平方根是 2.82842..., 由于返回类型是整数，小数部分将被舍去。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>0 &lt;= x &lt;= 2&lt;sup&gt;31&lt;/sup&gt; - 1</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：二分查找</strong></p>
<p>我们定义二分查找的左边界 <span class="arithmatex">\(l = 0\)</span>，右边界 <span class="arithmatex">\(r = x\)</span>，然后在 <span class="arithmatex">\([l, r]\)</span> 范围内查找平方根。</p>
<p>在每一步查找中，我们找出中间值 <span class="arithmatex">\(mid = (l + r + 1) / 2\)</span>，如果 <span class="arithmatex">\(mid &gt; x / mid\)</span>，说明平方根在 <span class="arithmatex">\([l, mid - 1]\)</span> 范围内，我们令 <span class="arithmatex">\(r = mid - 1\)</span>；否则说明平方根在 <span class="arithmatex">\([mid, r]\)</span> 范围内，我们令 <span class="arithmatex">\(l = mid\)</span>。</p>
<p>查找结束后，返回 <span class="arithmatex">\(l\)</span> 即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\log x)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int mySqrt(int x) {
        int l = 0, r = x;
        while (l &lt; r) {
            int mid = (l + r + 1) &gt;&gt;&gt; 1;
            if (mid &gt; x / mid) {
                r = mid - 1;
            } else {
                l = mid;
            }
        }
        return l;
    }
}
</code></pre>

</section></template>
<template id="panel-q-46"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">46</span>    <h2 class="q-title">148. 排序链表</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 147</span>    <span class="pill algo">链表、双指针、分治、排序、归并排序</span>    <a class="pill link" href="https://leetcode.cn/problems/sort-list" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你链表的头结点<code>head</code>，请将其按<strong>升序</strong>排列并返回<strong>排序后的链表</strong>。</p>
<p><strong>进阶：</strong></p>
<ul>
<li>你可以在<code>O(n log n)</code>时间复杂度和常数级空间复杂度下，对链表进行排序吗？</li>
</ul>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/14/sort_list_1.jpg" /></p>
<pre><code class="language-text">
输入：head = [4,2,1,3]
输出：[1,2,3,4]
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/14/sort_list_2.jpg" /></p>
<pre><code class="language-text">
输入：head = [-1,5,3,4,0]
输出：[-1,0,3,4,5]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：head = []
输出：[]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>链表中节点的数目在范围<code>[0, 5 * 10&lt;sup&gt;4&lt;/sup&gt; ]</code>内</li>
<li><code>-10&lt;sup&gt;5&lt;/sup&gt; &lt;= Node.val &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：归并排序</strong></p>
<p>我们可以用归并排序的思想来解决。</p>
<p>首先，我们利用快慢指针找到链表的中点，将链表从中点处断开，形成两个独立的子链表 <span class="arithmatex">\(\textit{l1}\)</span> 和 <span class="arithmatex">\(\textit{l2}\)</span>。</p>
<p>然后，我们递归地对 <span class="arithmatex">\(\textit{l1}\)</span> 和 <span class="arithmatex">\(\textit{l2}\)</span> 进行排序，最后将 <span class="arithmatex">\(\textit{l1}\)</span> 和 <span class="arithmatex">\(\textit{l2}\)</span> 合并为一个有序链表。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n \times \log n)\)</span>，空间复杂度 <span class="arithmatex">\(O(\log n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是链表的长度。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for singly-linked list.
 * public class ListNode {
 *     int val;
 *     ListNode next;
 *     ListNode() {}
 *     ListNode(int val) { this.val = val; }
 *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }
 * }
 */
class Solution {
    public ListNode sortList(ListNode head) {
        if (head == null || head.next == null) {
            return head;
        }
        ListNode slow = head, fast = head.next;
        while (fast != null &amp;&amp; fast.next != null) {
            slow = slow.next;
            fast = fast.next.next;
        }
        ListNode l1 = head, l2 = slow.next;
        slow.next = null;
        l1 = sortList(l1);
        l2 = sortList(l2);
        ListNode dummy = new ListNode();
        ListNode tail = dummy;
        while (l1 != null &amp;&amp; l2 != null) {
            if (l1.val &lt;= l2.val) {
                tail.next = l1;
                l1 = l1.next;
            } else {
                tail.next = l2;
                l2 = l2.next;
            }
            tail = tail.next;
        }
        tail.next = l1 != null ? l1 : l2;
        return dummy.next;
    }
}
</code></pre>

</section></template>
<template id="panel-q-47"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">47</span>    <h2 class="q-title">94. 二叉树的中序遍历</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 144</span>    <span class="pill algo">栈、树、深度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/binary-tree-inorder-traversal" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个二叉树的根节点<code>root</code>，返回它的<strong>中序</strong>遍历。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/15/inorder_1.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,null,2,3]
输出：[1,3,2]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：root = []
输出：[]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：root = [1]
输出：[1]
</code></pre>
<p><strong>示例 4：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/15/inorder_5.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,2]
输出：[2,1]
</code></pre>
<p><strong>示例 5：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/09/15/inorder_4.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,null,2]
输出：[1,2]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>树中节点数目在范围<code>[0, 100]</code>内</li>
<li><code>-100 &lt;= Node.val &lt;= 100</code></li>
</ul>
<p><strong>进阶:</strong>递归算法很简单，你可以通过迭代算法完成吗？</p></section><section class="q-block solution"><p><strong>方法一：递归遍历</strong></p>
<p>我们先递归左子树，再访问根节点，接着递归右子树。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数，空间复杂度主要取决于递归调用的栈空间。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    private List&lt;Integer&gt; ans = new ArrayList&lt;&gt;();

    public List&lt;Integer&gt; inorderTraversal(TreeNode root) {
        dfs(root);
        return ans;
    }

    private void dfs(TreeNode root) {
        if (root == null) {
            return;
        }
        dfs(root.left);
        ans.add(root.val);
        dfs(root.right);
    }
}
</code></pre>

</section></template>
<template id="panel-q-48"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">48</span>    <h2 class="q-title">232. 用栈实现队列</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 143</span>    <span class="pill algo">栈、设计、队列</span>    <a class="pill link" href="https://leetcode.cn/problems/implement-queue-using-stacks" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>请你仅使用两个栈实现先入先出队列。队列应当支持一般队列支持的所有操作（<code>push</code>、<code>pop</code>、<code>peek</code>、<code>empty</code>）：</p>
<p>实现<code>MyQueue</code>类：</p>
<ul>
<li><code>void push(int x)</code>将元素 x 推到队列的末尾</li>
<li><code>int pop()</code>从队列的开头移除并返回元素</li>
<li><code>int peek()</code>返回队列开头的元素</li>
<li><code>boolean empty()</code>如果队列为空，返回<code>true</code>；否则，返回<code>false</code></li>
</ul>
<p><strong>说明：</strong></p>
<ul>
<li>你只能使用标准的栈操作 —— 也就是只有<code>push to top</code>,<code>peek/pop from top</code>,<code>size</code>, 和<code>is empty</code>操作是合法的。</li>
<li>你所使用的语言也许不支持栈。你可以使用 list 或者 deque（双端队列）来模拟一个栈，只要是标准的栈操作即可。</li>
</ul>
<p><strong>进阶：</strong></p>
<ul>
<li>你能否实现每个操作均摊时间复杂度为<code>O(1)</code>的队列？换句话说，执行<code>n</code>个操作的总时间复杂度为<code>O(n)</code>，即使其中一个操作可能花费较长时间。</li>
</ul>
<p><strong>示例：</strong></p>
<pre><code class="language-text">
输入：
[&quot;MyQueue&quot;, &quot;push&quot;, &quot;push&quot;, &quot;peek&quot;, &quot;pop&quot;, &quot;empty&quot;]
[[], [1], [2], [], [], []]
输出：
[null, null, null, 1, 1, false]

解释：
MyQueue myQueue = new MyQueue();
myQueue.push(1); // queue is: [1]
myQueue.push(2); // queue is: [1, 2] (leftmost is front of the queue)
myQueue.peek(); // return 1
myQueue.pop(); // return 1, queue is [2]
myQueue.empty(); // return false
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= x &lt;= 9</code></li>
<li>最多调用<code>100</code>次<code>push</code>、<code>pop</code>、<code>peek</code>和<code>empty</code></li>
<li>假设所有操作都是有效的 （例如，一个空的队列不会调用<code>pop</code>或者<code>peek</code>操作）</li>
</ul></section><section class="q-block solution"><p><strong>方法一：双栈</strong></p>
<p>我们使用两个栈，其中栈 <code>stk1</code>用于入队，另一个栈 <code>stk2</code> 用于出队。</p>
<p>入队时，直接将元素入栈 <code>stk1</code>。时间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p>
<p>出队时，先判断栈 <code>stk2</code> 是否为空，如果为空，则将栈 <code>stk1</code> 中的元素全部出栈并入栈 <code>stk2</code>，然后再从栈 <code>stk2</code> 中出栈一个元素。如果栈 <code>stk2</code> 不为空，则直接从栈 <code>stk2</code> 中出栈一个元素。均摊时间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p>
<p>获取队首元素时，先判断栈 <code>stk2</code> 是否为空，如果为空，则将栈 <code>stk1</code> 中的元素全部出栈并入栈 <code>stk2</code>，然后再从栈 <code>stk2</code> 中获取栈顶元素。如果栈 <code>stk2</code> 不为空，则直接从栈 <code>stk2</code> 中获取栈顶元素。均摊时间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p>
<p>判断队列是否为空时，只要判断两个栈是否都为空即可。时间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class MyQueue {
    private Deque&lt;Integer&gt; stk1 = new ArrayDeque&lt;&gt;();
    private Deque&lt;Integer&gt; stk2 = new ArrayDeque&lt;&gt;();

    public MyQueue() {
    }

    public void push(int x) {
        stk1.push(x);
    }

    public int pop() {
        move();
        return stk2.pop();
    }

    public int peek() {
        move();
        return stk2.peek();
    }

    public boolean empty() {
        return stk1.isEmpty() &amp;&amp; stk2.isEmpty();
    }

    private void move() {
        while (stk2.isEmpty()) {
            while (!stk1.isEmpty()) {
                stk2.push(stk1.pop());
            }
        }
    }
}

/**
 * Your MyQueue object will be instantiated and called as such:
 * MyQueue obj = new MyQueue();
 * obj.push(x);
 * int param_2 = obj.pop();
 * int param_3 = obj.peek();
 * boolean param_4 = obj.empty();
 */
</code></pre>

</section></template>
<template id="panel-q-49"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">49</span>    <h2 class="q-title">31. 下一个排列</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 137</span>    <span class="pill algo">数组、双指针</span>    <a class="pill link" href="https://leetcode.cn/problems/next-permutation" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>实现获取<strong>下一个排列</strong>的函数，算法需要将给定数字序列重新排列成字典序中下一个更大的排列（即，组合出下一个更大的整数）。</p>
<p>如果不存在下一个更大的排列，则将数字重新排列成最小的排列（即升序排列）。</p>
<p>必须<strong><a href="https://baike.baidu.com/item/%E5%8E%9F%E5%9C%B0%E7%AE%97%E6%B3%95">原地</a></strong>修改，只允许使用额外常数空间。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,3]
输出：[1,3,2]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [3,2,1]
输出：[1,2,3]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：nums = [1,1,5]
输出：[1,5,1]
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：nums = [1]
输出：[1]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 100</code></li>
<li><code>0 &lt;= nums[i] &lt;= 100</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：两次遍历</strong></p>
<p>我们先从后往前遍历数组 <span class="arithmatex">\(nums\)</span>，找到第一个满足 <span class="arithmatex">\(nums[i] \lt nums[i + 1]\)</span> 的位置 <span class="arithmatex">\(i\)</span>，那么 <span class="arithmatex">\(nums[i]\)</span> 就是我们需要交换的元素，而 <span class="arithmatex">\(nums[i + 1]\)</span> 到 <span class="arithmatex">\(nums[n - 1]\)</span> 的元素是一个降序序列。</p>
<p>接下来，我们再从后往前遍历数组 <span class="arithmatex">\(nums\)</span>，找到第一个满足 <span class="arithmatex">\(nums[j] \gt nums[i]\)</span> 的位置 <span class="arithmatex">\(j\)</span>，然后我们交换 <span class="arithmatex">\(nums[i]\)</span> 和 <span class="arithmatex">\(nums[j]\)</span>。最后，我们将 <span class="arithmatex">\(nums[i + 1]\)</span> 到 <span class="arithmatex">\(nums[n - 1]\)</span> 的元素反转，即可得到下一个排列。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为数组的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public void nextPermutation(int[] nums) {
        int n = nums.length;
        int i = n - 2;
        for (; i &gt;= 0; --i) {
            if (nums[i] &lt; nums[i + 1]) {
                break;
            }
        }
        if (i &gt;= 0) {
            for (int j = n - 1; j &gt; i; --j) {
                if (nums[j] &gt; nums[i]) {
                    swap(nums, i, j);
                    break;
                }
            }
        }

        for (int j = i + 1, k = n - 1; j &lt; k; ++j, --k) {
            swap(nums, j, k);
        }
    }

    private void swap(int[] nums, int i, int j) {
        int t = nums[j];
        nums[j] = nums[i];
        nums[i] = t;
    }
}
</code></pre>

</section></template>
<template id="panel-q-50"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">50</span>    <h2 class="q-title">76. 最小覆盖子串</h2>  </div>  <div class="q-meta">    <span class="pill diff hard">困难</span>    <span class="pill freq">频度 134</span>    <span class="pill algo">哈希表、字符串、滑动窗口</span>    <a class="pill link" href="https://leetcode.cn/problems/minimum-window-substring" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个字符串<code>s</code>、一个字符串<code>t</code>。返回<code>s</code>中涵盖<code>t</code>所有字符的最小子串。如果<code>s</code>中不存在涵盖<code>t</code>所有字符的子串，则返回空字符串<code>""</code>。</p>
<p><strong>注意：</strong></p>
<ul>
<li>对于<code>t</code>中重复字符，我们寻找的子字符串中该字符数量必须不少于<code>t</code>中该字符数量。</li>
<li>如果<code>s</code>中存在这样的子串，我们保证它是唯一的答案。</li>
</ul>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;ADOBECODEBANC&quot;, t = &quot;ABC&quot;
输出：&quot;BANC&quot;
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：s = &quot;a&quot;, t = &quot;a&quot;
输出：&quot;a&quot;
</code></pre>
<p><strong>示例 3:</strong></p>
<pre><code class="language-text">
输入: s = &quot;a&quot;, t = &quot;aa&quot;
输出: &quot;&quot;
解释: t 中两个字符 'a' 均应包含在 s 的子串中，
因此没有符合条件的子字符串，返回空字符串。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= s.length, t.length &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>s</code>和<code>t</code>由英文字母组成</li>
</ul>
<p><strong>进阶：</strong>你能设计一个在<code>o(n)</code>时间内解决此问题的算法吗？</p></section><section class="q-block solution"><p><strong>方法一：计数 + 双指针</strong></p>
<p>我们用一个哈希表或数组 <span class="arithmatex">\(\textit{need}\)</span> 统计字符串 <span class="arithmatex">\(t\)</span> 中每个字符出现的次数，用另一个哈希表或数组 <span class="arithmatex">\(\textit{window}\)</span> 统计滑动窗口中每个字符出现的次数。另外，定义两个指针 <span class="arithmatex">\(l\)</span> 和 <span class="arithmatex">\(r\)</span> 分别指向窗口的左右边界，变量 <span class="arithmatex">\(\textit{cnt}\)</span> 表示窗口中已经包含了 <span class="arithmatex">\(t\)</span> 中的多少个字符，变量 <span class="arithmatex">\(k\)</span> 和 <span class="arithmatex">\(\textit{mi}\)</span> 分别表示最小覆盖子串的起始位置和长度。</p>
<p>我们从左到右遍历字符串 <span class="arithmatex">\(s\)</span>，对于当前遍历到的字符 <span class="arithmatex">\(s[r]\)</span>：</p>
<ul>
<li>我们将其加入窗口中，即 <span class="arithmatex">\(\textit{window}[s[r]] = \textit{window}[s[r]] + 1\)</span>，如果此时 <span class="arithmatex">\(\textit{need}[s[r]] \geq \textit{window}[s[r]]\)</span>，则说明 <span class="arithmatex">\(s[r]\)</span> 是一个「必要的字符」，我们将 <span class="arithmatex">\(\textit{cnt}\)</span> 加一。</li>
<li>如果 <span class="arithmatex">\(\textit{cnt}\)</span> 等于 <span class="arithmatex">\(t\)</span> 的长度，说明此时窗口中已经包含了 <span class="arithmatex">\(t\)</span> 中的所有字符，我们就可以尝试更新最小覆盖子串的起始位置和长度了。如果 <span class="arithmatex">\(r - l + 1 &lt; \textit{mi}\)</span>，说明当前窗口表示的子串更短，我们就更新 <span class="arithmatex">\(\textit{mi} = r - l + 1\)</span> 和 <span class="arithmatex">\(k = l\)</span>。</li>
<li>然后，我们尝试移动左边界 <span class="arithmatex">\(l\)</span>，如果此时 <span class="arithmatex">\(\textit{need}[s[l]] \geq \textit{window}[s[l]]\)</span>，则说明 <span class="arithmatex">\(s[l]\)</span> 是一个「必要的字符」，移动左边界时会把 <span class="arithmatex">\(s[l]\)</span> 这个字符从窗口中移除，因此我们需要将 <span class="arithmatex">\(\textit{cnt}\)</span> 减一，然后更新 <span class="arithmatex">\(\textit{window}[s[l]] = \textit{window}[s[l]] - 1\)</span>，并将 <span class="arithmatex">\(l\)</span> 右移一位。</li>
<li>如果 <span class="arithmatex">\(\textit{cnt}\)</span> 与 <span class="arithmatex">\(t\)</span> 的长度不相等，说明此时窗口中还没有包含 <span class="arithmatex">\(t\)</span> 中的所有字符，我们就不需要移动左边界了，直接将 <span class="arithmatex">\(r\)</span> 右移一位，继续遍历即可。</li>
</ul>
<p>遍历结束，如果没有找到最小覆盖子串，返回空字符串，否则返回 <span class="arithmatex">\(s[k:k+\textit{mi}]\)</span> 即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m + n)\)</span>，空间复杂度 <span class="arithmatex">\(O(|\Sigma|)\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别是字符串 <span class="arithmatex">\(s\)</span> 和 <span class="arithmatex">\(t\)</span> 的长度；而 <span class="arithmatex">\(|\Sigma|\)</span> 是字符集的大小，本题中 <span class="arithmatex">\(|\Sigma| = 128\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public String minWindow(String s, String t) {
        int[] need = new int[128];
        int[] window = new int[128];
        for (char c : t.toCharArray()) {
            ++need[c];
        }
        int m = s.length(), n = t.length();
        int k = -1, mi = m + 1, cnt = 0;
        for (int l = 0, r = 0; r &lt; m; ++r) {
            char c = s.charAt(r);
            if (++window[c] &lt;= need[c]) {
                ++cnt;
            }
            while (cnt == n) {
                if (r - l + 1 &lt; mi) {
                    mi = r - l + 1;
                    k = l;
                }
                c = s.charAt(l);
                if (window[c] &lt;= need[c]) {
                    --cnt;
                }
                --window[c];
                ++l;
            }
        }
        return k &lt; 0 ? &quot;&quot; : s.substring(k, k + mi);
    }
}
</code></pre>

</section></template>
<template id="panel-q-51"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">51</span>    <h2 class="q-title">2. 两数相加</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 133</span>    <span class="pill algo">递归、链表、数学</span>    <a class="pill link" href="https://leetcode.cn/problems/add-two-numbers" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你两个<strong>非空</strong>的链表，表示两个非负的整数。它们每位数字都是按照<strong>逆序</strong>的方式存储的，并且每个节点只能存储<strong>一位</strong>数字。</p>
<p>请你将两个数相加，并以相同形式返回一个表示和的链表。</p>
<p>你可以假设除了数字 0 之外，这两个数都不会以 0 开头。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode-cn.com/aliyun-lc-upload/uploads/2021/01/02/addtwonumber1.jpg" /></p>
<pre><code class="language-text">
输入：l1 = [2,4,3], l2 = [5,6,4]
输出：[7,0,8]
解释：342 + 465 = 807.
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：l1 = [0], l2 = [0]
输出：[0]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：l1 = [9,9,9,9,9,9,9], l2 = [9,9,9,9]
输出：[8,9,9,9,0,0,0,1]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>每个链表中的节点数在范围<code>[1, 100]</code>内</li>
<li><code>0 &lt;= Node.val &lt;= 9</code></li>
<li>题目数据保证列表表示的数字不含前导零</li>
</ul></section><section class="q-block solution"><p><strong>方法一：模拟</strong></p>
<p>我们同时遍历两个链表 <span class="arithmatex">\(l_1\)</span> 和 <span class="arithmatex">\(l_2\)</span>，并使用变量 <span class="arithmatex">\(carry\)</span> 表示当前是否有进位。</p>
<p>每次遍历时，我们取出对应链表的当前位，计算它们与进位 <span class="arithmatex">\(carry\)</span> 的和，然后更新进位的值，最后将当前位的值加入答案链表。如果两个链表都遍历完了，并且进位为 <span class="arithmatex">\(0\)</span> 时，遍历结束。</p>
<p>最后我们返回答案链表的头节点即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\max(m, n))\)</span>，其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别为两个链表的长度。我们需要遍历两个链表的全部位置，而处理每个位置只需要 <span class="arithmatex">\(O(1)\)</span> 的时间。忽略答案的空间消耗，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for singly-linked list.
 * public class ListNode {
 *     int val;
 *     ListNode next;
 *     ListNode() {}
 *     ListNode(int val) { this.val = val; }
 *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }
 * }
 */
class Solution {
    public ListNode addTwoNumbers(ListNode l1, ListNode l2) {
        ListNode dummy = new ListNode(0);
        int carry = 0;
        ListNode cur = dummy;
        while (l1 != null || l2 != null || carry != 0) {
            int s = (l1 == null ? 0 : l1.val) + (l2 == null ? 0 : l2.val) + carry;
            carry = s / 10;
            cur.next = new ListNode(s % 10);
            cur = cur.next;
            l1 = l1 == null ? null : l1.next;
            l2 = l2 == null ? null : l2.next;
        }
        return dummy.next;
    }
}
</code></pre>

</section></template>
<template id="panel-q-52"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">52</span>    <h2 class="q-title">8. 字符串转换整数 (atoi)</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 132</span>    <span class="pill algo">字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/string-to-integer-atoi" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>请你来实现一个<code>myAtoi(string s)</code>函数，使其能将字符串转换成一个 32 位有符号整数（类似 C/C++ 中的<code>atoi</code>函数）。</p>
<p>函数<code>myAtoi(string s)</code>的算法如下：</p>
<ul>
<li>读入字符串并丢弃无用的前导空格</li>
<li>检查下一个字符（假设还未到字符末尾）为正还是负号，读取该字符（如果有）。 确定最终结果是负数还是正数。 如果两者都不存在，则假定结果为正。</li>
<li>读入下一个字符，直到到达下一个非数字字符或到达输入的结尾。字符串的其余部分将被忽略。</li>
<li>将前面步骤读入的这些数字转换为整数（即，"123" -&gt; 123， "0032" -&gt; 32）。如果没有读入数字，则整数为<code>0</code>。必要时更改符号（从步骤 2 开始）。</li>
<li>如果整数数超过 32 位有符号整数范围<code>[−2&lt;sup&gt;31&lt;/sup&gt; , 2&lt;sup&gt;31&lt;/sup&gt; − 1]</code>，需要截断这个整数，使其保持在这个范围内。具体来说，小于<code>−2&lt;sup&gt;31&lt;/sup&gt;</code>的整数应该被固定为<code>−2&lt;sup&gt;31&lt;/sup&gt;</code>，大于<code>2&lt;sup&gt;31&lt;/sup&gt; − 1</code>的整数应该被固定为<code>2&lt;sup&gt;31&lt;/sup&gt; − 1</code>。</li>
<li>返回整数作为最终结果。</li>
</ul>
<p><strong>注意：</strong></p>
<ul>
<li>本题中的空白字符只包括空格字符<code>' '</code>。</li>
<li>除前导空格或数字后的其余字符串外，<strong>请勿忽略</strong>任何其他字符。</li>
</ul>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;42&quot;
输出：42
解释：加粗的字符串为已经读入的字符，插入符号是当前读取的字符。
第 1 步：&quot;42&quot;（当前没有读入字符，因为没有前导空格）
         ^
第 2 步：&quot;42&quot;（当前没有读入字符，因为这里不存在 '-' 或者 '+'）
         ^
第 3 步：&quot;42&quot;（读入 &quot;42&quot;）
           ^
解析得到整数 42 。
由于 &quot;42&quot; 在范围 [-231, 231 - 1] 内，最终结果为 42 。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：s = &quot;   -42&quot;
输出：-42
解释：
第 1 步：&quot;   -42&quot;（读入前导空格，但忽视掉）
            ^
第 2 步：&quot;   -42&quot;（读入 '-' 字符，所以结果应该是负数）
             ^
第 3 步：&quot;   -42&quot;（读入 &quot;42&quot;）
               ^
解析得到整数 -42 。
由于 &quot;-42&quot; 在范围 [-231, 231 - 1] 内，最终结果为 -42 。
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：s = &quot;4193 with words&quot;
输出：4193
解释：
第 1 步：&quot;4193 with words&quot;（当前没有读入字符，因为没有前导空格）
         ^
第 2 步：&quot;4193 with words&quot;（当前没有读入字符，因为这里不存在 '-' 或者 '+'）
         ^
第 3 步：&quot;4193 with words&quot;（读入 &quot;4193&quot;；由于下一个字符不是一个数字，所以读入停止）
             ^
解析得到整数 4193 。
由于 &quot;4193&quot; 在范围 [-231, 231 - 1] 内，最终结果为 4193 。
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：s = &quot;words and 987&quot;
输出：0
解释：
第 1 步：&quot;words and 987&quot;（当前没有读入字符，因为没有前导空格）
         ^
第 2 步：&quot;words and 987&quot;（当前没有读入字符，因为这里不存在 '-' 或者 '+'）
         ^
第 3 步：&quot;words and 987&quot;（由于当前字符 'w' 不是一个数字，所以读入停止）
         ^
解析得到整数 0 ，因为没有读入任何数字。
由于 0 在范围 [-231, 231 - 1] 内，最终结果为 0 。
</code></pre>
<p><strong>示例 5：</strong></p>
<pre><code class="language-text">
输入：s = &quot;-91283472332&quot;
输出：-2147483648
解释：
第 1 步：&quot;-91283472332&quot;（当前没有读入字符，因为没有前导空格）
         ^
第 2 步：&quot;-91283472332&quot;（读入 '-' 字符，所以结果应该是负数）
          ^
第 3 步：&quot;-91283472332&quot;（读入 &quot;91283472332&quot;）
                     ^
解析得到整数 -91283472332 。
由于 -91283472332 小于范围 [-231, 231 - 1] 的下界，最终结果被截断为 -231 = -2147483648 。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>0 &lt;= s.length &lt;= 200</code></li>
<li><code>s</code>由英文字母（大写和小写）、数字（<code>0-9</code>）、<code>' '</code>、<code>'+'</code>、<code>'-'</code>和<code>'.'</code>组成</li>
</ul></section><section class="q-block solution"><p><strong>方法一：遍历字符串</strong></p>
<p>我们首先判断字符串是否为空，如果是，直接返回 <span class="arithmatex">\(0\)</span>。</p>
<p>否则，我们需要遍历字符串，跳过前导空格，判断第一个非空格字符是否为正负号。</p>
<p>接着遍历后面的字符，如果是数字，我们判断添加该数字是否会导致整数溢出，如果会，我们根据正负号返回结果。否则我们将数字添加到结果中。继续遍历后面的字符，直到遇到非数字字符或者遍历结束。</p>
<p>遍历结束后，我们根据正负号返回结果。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 为字符串的长度。我们只需要依次处理所有字符。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p>
<p>同<a href="https://github.com/doocs/leetcode/blob/main/lcof/面试题67.%20把字符串转换成整数/README.md">面试题 67. 把字符串转换成整数</a>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int myAtoi(String s) {
        if (s == null) return 0;
        int n = s.length();
        if (n == 0) return 0;
        int i = 0;
        while (s.charAt(i) == ' ') {
            // 仅包含空格
            if (++i == n) return 0;
        }
        int sign = 1;
        if (s.charAt(i) == '-') sign = -1;
        if (s.charAt(i) == '-' || s.charAt(i) == '+') ++i;
        int res = 0, flag = Integer.MAX_VALUE / 10;
        for (; i &lt; n; ++i) {
            // 非数字，跳出循环体
            if (s.charAt(i) &lt; '0' || s.charAt(i) &gt; '9') break;
            // 溢出判断
            if (res &gt; flag || (res == flag &amp;&amp; s.charAt(i) &gt; '7'))
                return sign &gt; 0 ? Integer.MAX_VALUE : Integer.MIN_VALUE;
            res = res * 10 + (s.charAt(i) - '0');
        }
        return sign * res;
    }
}
</code></pre>

</section></template>
<template id="panel-q-53"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">53</span>    <h2 class="q-title">322. 零钱兑换</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 132</span>    <span class="pill algo">广度优先搜索、数组、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/coin-change" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个整数数组<code>coins</code>，表示不同面额的硬币；以及一个整数<code>amount</code>，表示总金额。</p>
<p>计算并返回可以凑成总金额所需的<strong>最少的硬币个数</strong>。如果没有任何一种硬币组合能组成总金额，返回<code>-1</code>。</p>
<p>你可以认为每种硬币的数量是无限的。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：coins = [1, 2, 5], amount = 11
输出：3
解释：11 = 5 + 5 + 1
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：coins = [2], amount = 3
输出：-1
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：coins = [1], amount = 0
输出：0
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：coins = [1], amount = 1
输出：1
</code></pre>
<p><strong>示例 5：</strong></p>
<pre><code class="language-text">
输入：coins = [1], amount = 2
输出：2
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= coins.length &lt;= 12</code></li>
<li><code>1 &lt;= coins[i] &lt;= 2&lt;sup&gt;31&lt;/sup&gt; - 1</code></li>
<li><code>0 &lt;= amount &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：动态规划(完全背包)</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i][j]\)</span> 表示使用前 <span class="arithmatex">\(i\)</span> 种硬币，凑出金额 <span class="arithmatex">\(j\)</span> 的最少硬币数。初始时 <span class="arithmatex">\(f[0][0] = 0\)</span>，其余位置的值均为正无穷。</p>
<p>我们可以枚举使用的最后一枚硬币的数量 <span class="arithmatex">\(k\)</span>，那么有：</p>
<div class="arithmatex">\[
f[i][j] = \min(f[i - 1][j], f[i - 1][j - x] + 1, \cdots, f[i - 1][j - k \times x] + k)
\]</div>
<p>其中 <span class="arithmatex">\(x\)</span> 表示第 <span class="arithmatex">\(i\)</span> 种硬币的面值。</p>
<p>不妨令 <span class="arithmatex">\(j = j - x\)</span>，那么有：</p>
<div class="arithmatex">\[
f[i][j - x] = \min(f[i - 1][j - x], f[i - 1][j - 2 \times x] + 1, \cdots, f[i - 1][j - k \times x] + k - 1)
\]</div>
<p>将二式代入一式，我们可以得到以下状态转移方程：</p>
<div class="arithmatex">\[
f[i][j] = \min(f[i - 1][j], f[i][j - x] + 1)
\]</div>
<p>最后答案即为 <span class="arithmatex">\(f[m][n]\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别为硬币的种类数和总金额。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int coinChange(int[] coins, int amount) {
        final int inf = 1 &lt;&lt; 30;
        int m = coins.length;
        int n = amount;
        int[][] f = new int[m + 1][n + 1];
        for (var g : f) {
            Arrays.fill(g, inf);
        }
        f[0][0] = 0;
        for (int i = 1; i &lt;= m; ++i) {
            for (int j = 0; j &lt;= n; ++j) {
                f[i][j] = f[i - 1][j];
                if (j &gt;= coins[i - 1]) {
                    f[i][j] = Math.min(f[i][j], f[i][j - coins[i - 1]] + 1);
                }
            }
        }
        return f[m][n] &gt;= inf ? -1 : f[m][n];
    }
}
</code></pre>

</section></template>
<template id="panel-q-54"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">54</span>    <h2 class="q-title">43. 字符串相乘</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 131</span>    <span class="pill algo">数学、字符串、模拟</span>    <a class="pill link" href="https://leetcode.cn/problems/multiply-strings" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定两个以字符串形式表示的非负整数<code>num1</code>和<code>num2</code>，返回<code>num1</code>和<code>num2</code>的乘积，它们的乘积也表示为字符串形式。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">输入: num1 = &quot;2&quot;, num2 = &quot;3&quot;
输出: &quot;6&quot;
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">输入: num1 = &quot;123&quot;, num2 = &quot;456&quot;
输出: &quot;56088&quot;
</code></pre>
<p><strong>说明：</strong></p>
<ol>
<li><code>num1</code>和<code>num2</code>的长度小于110。</li>
<li><code>num1</code>和<code>num2</code>只包含数字<code>0-9</code>。</li>
<li><code>num1</code>和<code>num2</code>均不以零开头，除非是数字 0 本身。
4.<strong>不能使用任何标准库的大数类型（比如 BigInteger）</strong>或<strong>直接将输入转换为整数来处理</strong>。</li>
</ol></section><section class="q-block solution"><p><strong>方法一：数学乘法模拟</strong></p>
<p>假设 <span class="arithmatex">\(num1\)</span> 和 <span class="arithmatex">\(num2\)</span> 的长度分别为 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span>，则它们的乘积的长度最多为 <span class="arithmatex">\(m + n\)</span>。</p>
<p>证明如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(num1\)</span> 和 <span class="arithmatex">\(num2\)</span> 都取最小值，那么它们的乘积为 <span class="arithmatex">\({10}^{m - 1} \times {10}^{n - 1} = {10}^{m + n - 2}\)</span>，长度为 <span class="arithmatex">\(m + n - 1\)</span>。</li>
<li>如果 <span class="arithmatex">\(num1\)</span> 和 <span class="arithmatex">\(num2\)</span> 都取最大值，那么它们的乘积为 <span class="arithmatex">\(({10}^m - 1) \times ({10}^n - 1) = {10}^{m + n} - {10}^m - {10}^n + 1\)</span>，长度为 <span class="arithmatex">\(m + n\)</span>。</li>
</ul>
<p>因此，我们可以申请一个长度为 <span class="arithmatex">\(m + n\)</span> 的数组，用于存储乘积的每一位。</p>
<p>从低位到高位，依次计算乘积的每一位，最后将数组转换为字符串即可。</p>
<p>注意判断最高位是否为 <span class="arithmatex">\(0\)</span>，如果是，则去掉。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(m + n)\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别为 <span class="arithmatex">\(num1\)</span> 和 <span class="arithmatex">\(num2\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public String multiply(String num1, String num2) {
        if (&quot;0&quot;.equals(num1) || &quot;0&quot;.equals(num2)) {
            return &quot;0&quot;;
        }
        int m = num1.length(), n = num2.length();
        int[] arr = new int[m + n];
        for (int i = m - 1; i &gt;= 0; --i) {
            int a = num1.charAt(i) - '0';
            for (int j = n - 1; j &gt;= 0; --j) {
                int b = num2.charAt(j) - '0';
                arr[i + j + 1] += a * b;
            }
        }
        for (int i = arr.length - 1; i &gt; 0; --i) {
            arr[i - 1] += arr[i] / 10;
            arr[i] %= 10;
        }
        int i = arr[0] == 0 ? 1 : 0;
        StringBuilder ans = new StringBuilder();
        for (; i &lt; arr.length; ++i) {
            ans.append(arr[i]);
        }
        return ans.toString();
    }
}
</code></pre>

</section></template>
<template id="panel-q-55"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">55</span>    <h2 class="q-title">70. 爬楼梯</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 130</span>    <span class="pill algo">记忆化、数学、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/climbing-stairs" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>假设你正在爬楼梯。需要<em>n</em>阶你才能到达楼顶。</p>
<p>每次你可以爬 1 或 2 个台阶。你有多少种不同的方法可以爬到楼顶呢？</p>
<p><strong>注意：</strong>给定<em>n</em>是一个正整数。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入： 2
输出： 2
解释： 有两种方法可以爬到楼顶。
1.  1 阶 + 1 阶
2.  2 阶
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入： 3
输出： 3
解释： 有三种方法可以爬到楼顶。
1.  1 阶 + 1 阶 + 1 阶
2.  1 阶 + 2 阶
3.  2 阶 + 1 阶
</code></pre></section><section class="q-block solution"><p><strong>方法一：递推</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i]\)</span> 表示爬到第 <span class="arithmatex">\(i\)</span> 阶楼梯的方法数，那么 <span class="arithmatex">\(f[i]\)</span> 可以由 <span class="arithmatex">\(f[i - 1]\)</span> 和 <span class="arithmatex">\(f[i - 2]\)</span> 转移而来，即：</p>
<div class="arithmatex">\[
f[i] = f[i - 1] + f[i - 2]
\]</div>
<p>初始条件为 <span class="arithmatex">\(f[0] = 1\)</span>，<span class="arithmatex">\(f[1] = 1\)</span>，即爬到第 0 阶楼梯的方法数为 1，爬到第 1 阶楼梯的方法数也为 1。</p>
<p>答案即为 <span class="arithmatex">\(f[n]\)</span>。</p>
<p>由于 <span class="arithmatex">\(f[i]\)</span> 只与 <span class="arithmatex">\(f[i - 1]\)</span> 和 <span class="arithmatex">\(f[i - 2]\)</span> 有关，因此我们可以只用两个变量 <span class="arithmatex">\(a\)</span> 和 <span class="arithmatex">\(b\)</span> 来维护当前的方法数，空间复杂度降低为 <span class="arithmatex">\(O(1)\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int climbStairs(int n) {
        int a = 0, b = 1;
        for (int i = 0; i &lt; n; ++i) {
            int c = a + b;
            a = b;
            b = c;
        }
        return b;
    }
}
</code></pre>

</section></template>
<template id="panel-q-56"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">56</span>    <h2 class="q-title">105. 从前序与中序遍历序列构造二叉树</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 117</span>    <span class="pill algo">树、数组、哈希表、分治、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一棵树的前序遍历<code>preorder</code>与中序遍历<code>inorder</code>。请构造二叉树并返回其根节点。</p>
<p><strong>示例 1:</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/02/19/tree.jpg" /></p>
<pre><code class="language-text">
Input: preorder = [3,9,20,15,7], inorder = [9,3,15,20,7]
Output: [3,9,20,null,null,15,7]
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
Input: preorder = [-1], inorder = [-1]
Output: [-1]
</code></pre>
<p><strong>提示:</strong></p>
<ul>
<li><code>1 &lt;= preorder.length &lt;= 3000</code></li>
<li><code>inorder.length == preorder.length</code></li>
<li><code>-3000 &lt;= preorder[i], inorder[i] &lt;= 3000</code></li>
<li><code>preorder</code>和<code>inorder</code>均无重复元素</li>
<li><code>inorder</code>均出现在<code>preorder</code></li>
<li><code>preorder</code>保证为二叉树的前序遍历序列</li>
<li><code>inorder</code>保证为二叉树的中序遍历序列</li>
</ul></section><section class="q-block solution"><p><strong>方法一：哈希表 + 递归</strong></p>
<p>前序序列的第一个节点 <span class="arithmatex">\(preorder[0]\)</span> 为根节点，我们在中序序列中找到根节点的位置 <span class="arithmatex">\(k\)</span>，可以将中序序列划分为左子树 <span class="arithmatex">\(inorder[0..k]\)</span> 、右子树 <span class="arithmatex">\(inorder[k+1..]\)</span>。</p>
<p>通过左右子树的区间，可以计算出左、右子树节点的个数，假设为 <span class="arithmatex">\(a\)</span> 和 <span class="arithmatex">\(b\)</span>。然后在前序节点中，从根节点往后的 <span class="arithmatex">\(a\)</span> 个节点为左子树，再往后的 <span class="arithmatex">\(b\)</span> 个节点为右子树。</p>
<p>因此，我们设计一个函数 <span class="arithmatex">\(dfs(i, j, n)\)</span>，其中 <span class="arithmatex">\(i\)</span> 和 <span class="arithmatex">\(j\)</span> 分别表示前序序列和中序序列的起始位置，而 <span class="arithmatex">\(n\)</span> 表示节点个数。函数的返回值是以 <span class="arithmatex">\(preorder[i..i+n-1]\)</span> 为前序序列，以 <span class="arithmatex">\(inorder[j..j+n-1]\)</span> 为中序序列构造出的二叉树。</p>
<p>函数 <span class="arithmatex">\(dfs(i, j, n)\)</span> 的执行过程如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(n \leq 0\)</span>，说明没有节点，返回空节点。</li>
<li>取出前序序列的第一个节点 <span class="arithmatex">\(v = preorder[i]\)</span> 作为根节点，然后利用哈希表 <span class="arithmatex">\(d\)</span> 找到根节点在中序序列中的位置 <span class="arithmatex">\(k\)</span>，那么左子树的节点个数为 <span class="arithmatex">\(k - j\)</span>，右子树的节点个数为 <span class="arithmatex">\(n - k + j - 1\)</span>。</li>
<li>递归构造左子树 <span class="arithmatex">\(l = dfs(i + 1, j, k - j)\)</span> 和右子树 <span class="arithmatex">\(r = dfs(i + 1 + k - j, k + 1, n - k + j - 1)\)</span>。</li>
<li>最后返回以 <span class="arithmatex">\(v\)</span> 为根节点且左右子树分别为 <span class="arithmatex">\(l\)</span> 和 <span class="arithmatex">\(r\)</span> 的二叉树。</li>
</ul>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为二叉树节点个数。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    private int[] preorder;
    private Map&lt;Integer, Integer&gt; d = new HashMap&lt;&gt;();

    public TreeNode buildTree(int[] preorder, int[] inorder) {
        int n = preorder.length;
        this.preorder = preorder;
        for (int i = 0; i &lt; n; ++i) {
            d.put(inorder[i], i);
        }
        return dfs(0, 0, n);
    }

    private TreeNode dfs(int i, int j, int n) {
        if (n &lt;= 0) {
            return null;
        }
        int v = preorder[i];
        int k = d.get(v);
        TreeNode l = dfs(i + 1, j, k - j);
        TreeNode r = dfs(i + 1 + k - j, k + 1, n - 1 - (k - j));
        return new TreeNode(v, l, r);
    }
}
</code></pre>

</section></template>
<template id="panel-q-57"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">57</span>    <h2 class="q-title">41. 缺失的第一个正数</h2>  </div>  <div class="q-meta">    <span class="pill diff hard">困难</span>    <span class="pill freq">频度 114</span>    <span class="pill algo">数组、哈希表</span>    <a class="pill link" href="https://leetcode.cn/problems/first-missing-positive" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个未排序的整数数组<code>nums</code>，请你找出其中没有出现的最小的正整数。</p>
<p>请你实现时间复杂度为<code>O(n)</code>并且只使用常数级别额外空间的解决方案。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,0]
输出：3
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [3,4,-1,1]
输出：2
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：nums = [7,8,9,11,12]
输出：1
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 5 * 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>-2&lt;sup&gt;31&lt;/sup&gt; &lt;= nums[i] &lt;= 2&lt;sup&gt;31&lt;/sup&gt; - 1</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：原地交换</strong></p>
<p>我们假设数组 <span class="arithmatex">\(nums\)</span> 长度为 <span class="arithmatex">\(n\)</span>，那么最小的正整数一定在 <span class="arithmatex">\([1, .., n + 1]\)</span> 之间。我们可以遍历数组，将数组中的每个数 <span class="arithmatex">\(x\)</span> 交换到它应该在的位置上，即 <span class="arithmatex">\(x\)</span> 应该在的位置为 <span class="arithmatex">\(x - 1\)</span>。如果 <span class="arithmatex">\(x\)</span> 不在 <span class="arithmatex">\([1, n + 1]\)</span> 之间，那么我们就不用管它。</p>
<p>遍历结束后，我们再遍历数组，如果 <span class="arithmatex">\(i+1\)</span> 不等于 <span class="arithmatex">\(nums[i]\)</span>，那么 <span class="arithmatex">\(i+1\)</span> 就是我们要找的最小的正整数。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int firstMissingPositive(int[] nums) {
        int n = nums.length;
        for (int i = 0; i &lt; n; ++i) {
            while (nums[i] &gt; 0 &amp;&amp; nums[i] &lt;= n &amp;&amp; nums[i] != nums[nums[i] - 1]) {
                swap(nums, i, nums[i] - 1);
            }
        }
        for (int i = 0; i &lt; n; ++i) {
            if (nums[i] != i + 1) {
                return i + 1;
            }
        }
        return n + 1;
    }

    private void swap(int[] nums, int i, int j) {
        int t = nums[i];
        nums[i] = nums[j];
        nums[j] = t;
    }
}
</code></pre>

</section></template>
<template id="panel-q-58"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">58</span>    <h2 class="q-title">151. 翻转字符串里的单词</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 106</span>    <span class="pill algo">双指针、字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/reverse-words-in-a-string" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个字符串<code>s</code>，逐个翻转字符串中的所有<strong>单词</strong>。</p>
<p><strong>单词</strong>是由非空格字符组成的字符串。<code>s</code>中使用至少一个空格将字符串中的<strong>单词</strong>分隔开。</p>
<p>请你返回一个翻转<code>s</code>中单词顺序并用单个空格相连的字符串。</p>
<p><strong>说明：</strong></p>
<ul>
<li>输入字符串<code>s</code>可以在前面、后面或者单词间包含多余的空格。</li>
<li>翻转后单词间应当仅用一个空格分隔。</li>
<li>翻转后的字符串中不应包含额外的空格。</li>
</ul>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;the sky is blue&quot;
输出：&quot;blue is sky the&quot;
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：s = &quot;  hello world  &quot;
输出：&quot;world hello&quot;
解释：输入字符串可以在前面或者后面包含多余的空格，但是翻转后的字符不能包括。
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：s = &quot;a good   example&quot;
输出：&quot;example good a&quot;
解释：如果两个单词间有多余的空格，将翻转后单词间的空格减少到只含一个。
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：s = &quot;  Bob    Loves  Alice   &quot;
输出：&quot;Alice Loves Bob&quot;
</code></pre>
<p><strong>示例 5：</strong></p>
<pre><code class="language-text">
输入：s = &quot;Alice does not even like bob&quot;
输出：&quot;bob like even not does Alice&quot;
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= s.length &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>s</code>包含英文大小写字母、数字和空格<code>' '</code></li>
<li><code>s</code>中<strong>至少存在一个</strong>单词</li>
</ul>
<p><strong>进阶：</strong></p>
<ul>
<li>请尝试使用<code>*O*(1)</code>额外空间复杂度的原地解法。</li>
</ul></section><section class="q-block solution"><p><strong>方法一：双指针</strong></p>
<p>我们可以使用双指针 <span class="arithmatex">\(i\)</span> 和 <span class="arithmatex">\(j\)</span>，每次找到一个单词，将其添加到结果列表中，最后将结果列表反转，再拼接成字符串即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为字符串的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public String reverseWords(String s) {
        List&lt;String&gt; words = new ArrayList&lt;&gt;();
        int n = s.length();
        for (int i = 0; i &lt; n;) {
            while (i &lt; n &amp;&amp; s.charAt(i) == ' ') {
                ++i;
            }
            if (i &lt; n) {
                StringBuilder t = new StringBuilder();
                int j = i;
                while (j &lt; n &amp;&amp; s.charAt(j) != ' ') {
                    t.append(s.charAt(j++));
                }
                words.add(t.toString());
                i = j;
            }
        }
        Collections.reverse(words);
        return String.join(&quot; &quot;, words);
    }
}
</code></pre>

</section></template>
<template id="panel-q-59"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">59</span>    <h2 class="q-title">78. 子集</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 105</span>    <span class="pill algo">位运算、数组、回溯</span>    <a class="pill link" href="https://leetcode.cn/problems/subsets" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个整数数组<code>nums</code>，数组中的元素<strong>互不相同</strong>。返回该数组所有可能的子集（幂集）。</p>
<p>解集<strong>不能</strong>包含重复的子集。你可以按<strong>任意顺序</strong>返回解集。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,3]
输出：[[],[1],[2],[1,2],[3],[1,3],[2,3],[1,2,3]]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [0]
输出：[[],[0]]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 10</code></li>
<li><code>-10 &lt;= nums[i] &lt;= 10</code></li>
<li><code>nums</code>中的所有元素<strong>互不相同</strong></li>
</ul></section><section class="q-block solution"><p><strong>方法一：DFS(回溯)</strong></p>
<p>我们设计一个函数 <span class="arithmatex">\(dfs(i)\)</span>，表示从数组的第 <span class="arithmatex">\(i\)</span> 个元素开始搜索所有子集。函数 <span class="arithmatex">\(dfs(i)\)</span> 的执行逻辑如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(i=n\)</span>，表示当前已经搜索结束，将当前得到的子集 <span class="arithmatex">\(t\)</span> 加入答案数组 <span class="arithmatex">\(ans\)</span> 中，然后返回；</li>
<li>否则，我们可以选择不选择当前元素，直接执行 <span class="arithmatex">\(dfs(i+1)\)</span>；也可以选择当前元素，即把当前元素 <span class="arithmatex">\(nums[i]\)</span> 加入子集 <span class="arithmatex">\(t\)</span>，然后执行 <span class="arithmatex">\(dfs(i+1)\)</span>，注意要在执行 <span class="arithmatex">\(dfs(i+1)\)</span> 以后再将 <span class="arithmatex">\(nums[i]\)</span> 从子集 <span class="arithmatex">\(t\)</span> 中移除（回溯）。</li>
</ul>
<p>在主函数中，我们调用 <span class="arithmatex">\(dfs(0)\)</span>，即从数组的第一个元素开始搜索所有子集。最后返回答案数组 <span class="arithmatex">\(ans\)</span> 即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n\times 2^n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为数组的长度。一共有 <span class="arithmatex">\(2^n\)</span> 个子集，每个子集需要 <span class="arithmatex">\(O(n)\)</span> 的时间来构造。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private List&lt;List&lt;Integer&gt;&gt; ans = new ArrayList&lt;&gt;();
    private List&lt;Integer&gt; t = new ArrayList&lt;&gt;();
    private int[] nums;

    public List&lt;List&lt;Integer&gt;&gt; subsets(int[] nums) {
        this.nums = nums;
        dfs(0);
        return ans;
    }

    private void dfs(int i) {
        if (i == nums.length) {
            ans.add(new ArrayList&lt;&gt;(t));
            return;
        }
        dfs(i + 1);
        t.add(nums[i]);
        dfs(i + 1);
        t.remove(t.size() - 1);
    }
}
</code></pre>

</section></template>
<template id="panel-q-60"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">60</span>    <h2 class="q-title">剑指 Offer 22. 链表中倒数第k个节点</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 103</span>    <span class="pill algo">链表、双指针</span>    <a class="pill link" href="https://leetcode.cn/problems/lian-biao-zhong-dao-shu-di-kge-jie-dian-lcof" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>输入一个链表，输出该链表中倒数第k个节点。为了符合大多数人的习惯，本题从1开始计数，即链表的尾节点是倒数第1个节点。</p>
<p>例如，一个链表有<code>6</code>个节点，从头节点开始，它们的值依次是<code>1、2、3、4、5、6</code>。这个链表的倒数第<code>3</code>个节点是值为<code>4</code>的节点。</p>
<p><strong>示例：</strong></p>
<pre><code class="language-text">
给定一个链表: 1-&gt;2-&gt;3-&gt;4-&gt;5, 和 k = 2.

返回链表 4-&gt;5.
</code></pre></section><section class="q-block solution"><p><strong>快慢指针</strong></p>
<p>快指针先走 <code>k</code> 步，再让快慢指针同步前进。快指针到达链表末尾时，慢指针正好指向倒数第 <code>k</code> 个节点。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public ListNode getKthFromEnd(ListNode head, int k) {
        ListNode fast = head, slow = head;
        for (int i = 0; i &lt; k; i++) fast = fast.next;
        while (fast != null) {
            fast = fast.next;
            slow = slow.next;
        }
        return slow;
    }
}
</code></pre>

</section></template>
<template id="panel-q-61"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">61</span>    <h2 class="q-title">34. 在排序数组中查找元素的第一个和最后一个位置</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 103</span>    <span class="pill algo">数组、二分查找</span>    <a class="pill link" href="https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个按照升序排列的整数数组<code>nums</code>，和一个目标值<code>target</code>。找出给定目标值在数组中的开始位置和结束位置。</p>
<p>如果数组中不存在目标值<code>target</code>，返回<code>[-1, -1]</code>。</p>
<p><strong>进阶：</strong></p>
<ul>
<li>你可以设计并实现时间复杂度为<code>O(log n)</code>的算法解决此问题吗？</li>
</ul>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [5,7,7,8,8,10], target = 8
输出：[3,4]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [5,7,7,8,8,10], target = 6
输出：[-1,-1]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：nums = [], target = 0
输出：[-1,-1]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>0 &lt;= nums.length &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>-10&lt;sup&gt;9&lt;/sup&gt; &lt;= nums[i] &lt;= 10&lt;sup&gt;9&lt;/sup&gt;</code></li>
<li><code>nums</code>是一个非递减数组</li>
<li><code>-10&lt;sup&gt;9&lt;/sup&gt; &lt;= target &lt;= 10&lt;sup&gt;9&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：二分查找</strong></p>
<p>我们可以进行两次二分查找，分别查找出左边界和右边界。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\log n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组 <span class="arithmatex">\(\textit{nums}\)</span> 的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int[] searchRange(int[] nums, int target) {
        int l = search(nums, target);
        int r = search(nums, target + 1);
        return l == r ? new int[] {-1, -1} : new int[] {l, r - 1};
    }

    private int search(int[] nums, int x) {
        int left = 0, right = nums.length;
        while (left &lt; right) {
            int mid = (left + right) &gt;&gt;&gt; 1;
            if (nums[mid] &gt;= x) {
                right = mid;
            } else {
                left = mid + 1;
            }
        }
        return left;
    }
}
</code></pre>

</section></template>
<template id="panel-q-62"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">62</span>    <h2 class="q-title">394. 字符串解码</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 100</span>    <span class="pill algo">栈、递归、字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/decode-string" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个经过编码的字符串，返回它解码后的字符串。</p>
<p>编码规则为:<code>k[encoded_string]</code>，表示其中方括号内部的<em>encoded_string</em>正好重复<em>k</em>次。注意<em>k</em>保证为正整数。</p>
<p>你可以认为输入字符串总是有效的；输入字符串中没有额外的空格，且输入的方括号总是符合格式要求的。</p>
<p>此外，你可以认为原始数据不包含数字，所有的数字只表示重复的次数<em>k</em>，例如不会出现像<code>3a</code>或<code>2[4]</code>的输入。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入：s = &quot;3[a]2[bc]&quot;
输出：&quot;aaabcbc&quot;
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入：s = &quot;3[a2[c]]&quot;
输出：&quot;accaccacc&quot;
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">输入：s = &quot;2[abc]3[cd]ef&quot;
输出：&quot;abcabccdcdcdef&quot;
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">输入：s = &quot;abc3[cd]xyz&quot;
输出：&quot;abccdcdcdxyz&quot;
</code></pre></section><section class="q-block solution"><p><strong>方法一</strong></p>
<p>采用题目对应的标准算法实现。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public String decodeString(String s) {
        Deque&lt;Integer&gt; s1 = new ArrayDeque&lt;&gt;();
        Deque&lt;String&gt; s2 = new ArrayDeque&lt;&gt;();
        int num = 0;
        String res = &quot;&quot;;
        for (char c : s.toCharArray()) {
            if ('0' &lt;= c &amp;&amp; c &lt;= '9') {
                num = num * 10 + c - '0';
            } else if (c == '[') {
                s1.push(num);
                s2.push(res);
                num = 0;
                res = &quot;&quot;;
            } else if (c == ']') {
                StringBuilder t = new StringBuilder();
                for (int i = 0, n = s1.pop(); i &lt; n; ++i) {
                    t.append(res);
                }
                res = s2.pop() + t.toString();
            } else {
                res += String.valueOf(c);
            }
        }
        return res;
    }
}
</code></pre>

</section></template>
<template id="panel-q-63"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">63</span>    <h2 class="q-title">129. 求根到叶子节点数字之和</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 100</span>    <span class="pill algo">树、深度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/sum-root-to-leaf-numbers" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个二叉树的根节点<code>root</code>，树中每个节点都存放有一个<code>0</code>到<code>9</code>之间的数字。</p>
<p>每条从根节点到叶节点的路径都代表一个数字：</p>
<ul>
<li>例如，从根节点到叶节点的路径<code>1 -&gt; 2 -&gt; 3</code>表示数字<code>123</code>。</li>
</ul>
<p>计算从根节点到叶节点生成的<strong>所有数字之和</strong>。</p>
<p><strong>叶节点</strong>是指没有子节点的节点。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/02/19/num1tree.jpg" /></p>
<pre><code class="language-text">
输入：root = [1,2,3]
输出：25
解释：
从根到叶子节点路径 1-&gt;2 代表数字 12
从根到叶子节点路径 1-&gt;3 代表数字 13
因此，数字总和 = 12 + 13 = 25
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/02/19/num2tree.jpg" /></p>
<pre><code class="language-text">
输入：root = [4,9,0,5,1]
输出：1026
解释：
从根到叶子节点路径 4-&gt;9-&gt;5 代表数字 495
从根到叶子节点路径 4-&gt;9-&gt;1 代表数字 491
从根到叶子节点路径 4-&gt;0 代表数字 40
因此，数字总和 = 495 + 491 + 40 = 1026
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>树中节点的数目在范围<code>[1, 1000]</code>内</li>
<li><code>0 &lt;= Node.val &lt;= 9</code></li>
<li>树的深度不超过<code>10</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：DFS</strong></p>
<p>我们可以设计一个函数 <span class="arithmatex">\(dfs(root, s)\)</span>，表示从当前节点 <span class="arithmatex">\(root\)</span> 出发，且当前路径数字为 <span class="arithmatex">\(s\)</span>，返回从当前节点到叶子节点的所有路径数字之和。那么答案就是 <span class="arithmatex">\(dfs(root, 0)\)</span>。</p>
<p>函数 <span class="arithmatex">\(dfs(root, s)\)</span> 的计算如下：</p>
<ul>
<li>如果当前节点 <span class="arithmatex">\(root\)</span> 为空，则返回 <span class="arithmatex">\(0\)</span>。</li>
<li>否则，将当前节点的值加到 <span class="arithmatex">\(s\)</span> 中，即 <span class="arithmatex">\(s = s \times 10 + root.val\)</span>。</li>
<li>如果当前节点是叶子节点，则返回 <span class="arithmatex">\(s\)</span>。</li>
<li>否则，返回 <span class="arithmatex">\(dfs(root.left, s) + dfs(root.right, s)\)</span>。</li>
</ul>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(\log n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public int sumNumbers(TreeNode root) {
        return dfs(root, 0);
    }

    private int dfs(TreeNode root, int s) {
        if (root == null) {
            return 0;
        }
        s = s * 10 + root.val;
        if (root.left == null &amp;&amp; root.right == null) {
            return s;
        }
        return dfs(root.left, s) + dfs(root.right, s);
    }
}
</code></pre>

</section></template>
<template id="panel-q-64"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">64</span>    <h2 class="q-title">155. 最小栈</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 99</span>    <span class="pill algo">栈、设计</span>    <a class="pill link" href="https://leetcode.cn/problems/min-stack" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>设计一个支持<code>push</code>，<code>pop</code>，<code>top</code>操作，并能在常数时间内检索到最小元素的栈。</p>
<ul>
<li><code>push(x)</code>—— 将元素 x 推入栈中。</li>
<li><code>pop()</code>—— 删除栈顶的元素。</li>
<li><code>top()</code>—— 获取栈顶元素。</li>
<li><code>getMin()</code>—— 检索栈中的最小元素。</li>
</ul>
<p><strong>示例:</strong></p>
<pre><code class="language-text">输入：
[&quot;MinStack&quot;,&quot;push&quot;,&quot;push&quot;,&quot;push&quot;,&quot;getMin&quot;,&quot;pop&quot;,&quot;top&quot;,&quot;getMin&quot;]
[[],[-2],[0],[-3],[],[],[],[]]

输出：
[null,null,null,null,-3,null,0,-2]

解释：
MinStack minStack = new MinStack();
minStack.push(-2);
minStack.push(0);
minStack.push(-3);
minStack.getMin();   --&gt; 返回 -3.
minStack.pop();
minStack.top();      --&gt; 返回 0.
minStack.getMin();   --&gt; 返回 -2.
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>pop</code>、<code>top</code>和<code>getMin</code>操作总是在<strong>非空栈</strong>上调用。</li>
</ul></section><section class="q-block solution"><p><strong>方法一：双栈</strong></p>
<p>我们用两个栈来实现，其中 <code>stk1</code> 用来存储数据，<code>stk2</code> 用来存储当前栈中的最小值。初始时，<code>stk2</code> 中存储一个极大值。</p>
<ul>
<li>当我们向栈中压入一个元素 <span class="arithmatex">\(x\)</span> 时，我们将 <span class="arithmatex">\(x\)</span> 压入 <code>stk1</code>，并将 <code>min(x, stk2[-1])</code> 压入 <code>stk2</code>。</li>
<li>当我们从栈中弹出一个元素时，我们将 <code>stk1</code> 和 <code>stk2</code> 的栈顶元素都弹出。</li>
<li>当我们要获取当前栈中的栈顶元素时，我们只需要返回 <code>stk1</code> 的栈顶元素即可。</li>
<li>当我们要获取当前栈中的最小值时，我们只需要返回 <code>stk2</code> 的栈顶元素即可。</li>
</ul>
<p>每个操作的时间复杂度为 <span class="arithmatex">\(O(1)\)</span>。整体的空间复杂度为 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 为栈中元素的个数。</p></section><section class="q-block code"><pre><code class="language-java">class MinStack {
    private Deque&lt;Integer&gt; stk1 = new ArrayDeque&lt;&gt;();
    private Deque&lt;Integer&gt; stk2 = new ArrayDeque&lt;&gt;();

    public MinStack() {
        stk2.push(Integer.MAX_VALUE);
    }

    public void push(int val) {
        stk1.push(val);
        stk2.push(Math.min(val, stk2.peek()));
    }

    public void pop() {
        stk1.pop();
        stk2.pop();
    }

    public int top() {
        return stk1.peek();
    }

    public int getMin() {
        return stk2.peek();
    }
}

/**
 * Your MinStack object will be instantiated and called as such:
 * MinStack obj = new MinStack();
 * obj.push(val);
 * obj.pop();
 * int param_3 = obj.top();
 * int param_4 = obj.getMin();
 */
</code></pre>

</section></template>
<template id="panel-q-65"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">65</span>    <h2 class="q-title">101. 对称二叉树</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 97</span>    <span class="pill algo">树、深度优先搜索、广度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/symmetric-tree" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个二叉树，检查它是否是镜像对称的。</p>
<p>例如，二叉树<code>[1,2,2,3,4,4,3]</code>是对称的。</p>
<pre><code class="language-text">    1
   / \
  2   2
 / \ / \
3  4 4  3
</code></pre>
<p>但是下面这个<code>[1,2,2,null,3,null,3]</code>则不是镜像对称的:</p>
<pre><code class="language-text">    1
   / \
  2   2
   \   \
   3    3
</code></pre>
<p><strong>进阶：</strong></p>
<p>你可以运用递归和迭代两种方法解决这个问题吗？</p></section><section class="q-block solution"><p><strong>方法一：递归</strong></p>
<p>我们设计一个函数 <span class="arithmatex">\(\textit{dfs}(\textit{root1}, \textit{root2})\)</span>，用于判断两个二叉树是否对称。答案即为 <span class="arithmatex">\(\textit{dfs}(\textit{root.left}, \textit{root.right})\)</span>。</p>
<p>函数 <span class="arithmatex">\(\textit{dfs}(\textit{root1}, \textit{root2})\)</span> 的逻辑如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(\textit{root1}\)</span> 和 <span class="arithmatex">\(\textit{root2}\)</span> 都为空，则两个二叉树对称，返回 <code>true</code>；</li>
<li>如果 <span class="arithmatex">\(\textit{root1}\)</span> 和 <span class="arithmatex">\(\textit{root2}\)</span> 中只有一个为空，或者 <span class="arithmatex">\(\textit{root1.val} \neq \textit{root2.val}\)</span></li>
<li>否则，判断 <span class="arithmatex">\(\textit{root1}\)</span> 的左子树和 <span class="arithmatex">\(\textit{root2}\)</span> 的右子树是否对称，以及 <span class="arithmatex">\(\textit{root1}\)</span> 的右子树和 <span class="arithmatex">\(\textit{root2}\)</span> 的左子树是否对称，这里使用了递归。</li>
</ul>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public boolean isSymmetric(TreeNode root) {
        return dfs(root.left, root.right);
    }

    private boolean dfs(TreeNode root1, TreeNode root2) {
        if (root1 == root2) {
            return true;
        }
        if (root1 == null || root2 == null || root1.val != root2.val) {
            return false;
        }
        return dfs(root1.left, root2.right) &amp;&amp; dfs(root1.right, root2.left);
    }
}
</code></pre>

</section></template>
<template id="panel-q-66"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">66</span>    <h2 class="q-title">470. 用 Rand7() 实现 Rand10()</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 96</span>    <span class="pill algo">数学、拒绝采样、概率与统计、随机化</span>    <a class="pill link" href="https://leetcode.cn/problems/implement-rand10-using-rand7" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>已有方法<code>rand7</code>可生成 1 到 7 范围内的均匀随机整数，试写一个方法<code>rand10</code>生成 1 到 10 范围内的均匀随机整数。</p>
<p>不要使用系统的<code>Math.random()</code>方法。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">
输入: 1
输出: [7]
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
输入: 2
输出: [8,4]
</code></pre>
<p><strong>示例 3:</strong></p>
<pre><code class="language-text">
输入: 3
输出: [8,1,10]
</code></pre>
<p><strong>提示:</strong></p>
<ol>
<li><code>rand7</code>已定义。</li>
<li>传入参数:<code>n</code>表示<code>rand10</code>的调用次数。</li>
</ol>
<p><strong>进阶:</strong></p>
<ol>
<li><code>rand7()</code>调用次数的<a href="https://en.wikipedia.org/wiki/Expected_value">期望值</a> 是多少 ?</li>
<li>你能否尽量少调用<code>rand7()</code>?</li>
</ol></section><section class="q-block solution"><p><strong>方法一：拒绝采样</strong></p>
<p>我们可以使用拒绝采样的方法实现等概率生成任意区间的随机数。拒绝采样的思路是如果生成的随机数落在我们希望的区间内，那么就返回该随机数，否则会不断生成直到生成一个落在区间内的随机数为止。</p>
<p>对于本题，我们可以通过调用 <span class="arithmatex">\(rand7()\)</span> 两次来实现生成 <span class="arithmatex">\([1,10]\)</span> 以内的随机数，具体如下：</p>
<p>我们生成一个大于等于 <span class="arithmatex">\(1\)</span> 且小于等于 <span class="arithmatex">\(40\)</span> 的整数 <span class="arithmatex">\(x\)</span>，其中等概率生成的方式为 <span class="arithmatex">\(x = (rand7() - 1) \times 7 + rand7()\)</span>，然后，我们返回 <span class="arithmatex">\(x \bmod 10 + 1\)</span> 即可。</p>
<p>期望时间复杂度为 <span class="arithmatex">\(O(1)\)</span>，但是最坏情况下会达到无穷大的时间复杂度。空间复杂度为 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * The rand7() API is already defined in the parent class SolBase.
 * public int rand7();
 * @return a random integer in the range 1 to 7
 */
class Solution extends SolBase {
    public int rand10() {
        while (true) {
            int i = rand7() - 1;
            int j = rand7();
            int x = i * 7 + j;
            if (x &lt;= 40) {
                return x % 10 + 1;
            }
        }
    }
}
</code></pre>

</section></template>
<template id="panel-q-67"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">67</span>    <h2 class="q-title">39. 组合总和</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 96</span>    <span class="pill algo">数组、回溯</span>    <a class="pill link" href="https://leetcode.cn/problems/combination-sum" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个<strong>无重复元素</strong>的正整数数组<code>candidates</code>和一个正整数<code>target</code>，找出<code>candidates</code>中所有可以使数字和为目标数<code>target</code>的唯一组合。</p>
<p><code>candidates</code>中的数字可以无限制重复被选取。如果至少一个所选数字数量不同，则两种组合是唯一的。</p>
<p>对于给定的输入，保证和为<code>target</code>的唯一组合数少于<code>150</code>个。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入: candidates = [2,3,6,7], target = 7
输出: [[7],[2,2,3]]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入: candidates = [2,3,5], target = 8
输出: [[2,2,2,2],[2,3,3],[3,5]]
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入: candidates = [2], target = 1
输出: []
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入: candidates = [1], target = 1
输出: [[1]]
</code></pre>
<p><strong>示例 5：</strong></p>
<pre><code class="language-text">
输入: candidates = [1], target = 2
