<p>请注意，输入数组是以<strong>「引用」</strong>方式传递的，这意味着在函数里修改输入数组对于调用者是可见的。</p>
<p>你可以想象内部操作如下:</p>
<pre><code class="language-text">
// nums 是以“引用”方式传递的。也就是说，不对实参做任何拷贝
int len = removeDuplicates(nums);

// 在函数里修改输入数组对于调用者是可见的。
// 根据你的函数返回的长度, 它会打印出数组中 该长度范围内 的所有元素。
for (int i = 0; i &lt; len; i++) {
    print(nums[i]);
}
</code></pre>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,1,2]
输出：2, nums = [1,2]
解释：函数应该返回新的长度 2 ，并且原数组 nums 的前两个元素被修改为 1, 2 。不需要考虑数组中超出新长度后面的元素。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [0,0,1,1,1,2,2,3,3,4]
输出：5, nums = [0,1,2,3,4]
解释：函数应该返回新的长度 5 ， 并且原数组 nums 的前五个元素被修改为 0, 1, 2, 3, 4 。不需要考虑数组中超出新长度后面的元素。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>0 &lt;= nums.length &lt;= 3 * 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>-10&lt;sup&gt;4&lt;/sup&gt; &lt;= nums[i] &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>nums</code>已按升序排列</li>
</ul></section><section class="q-block solution"><p><strong>方法一：一次遍历</strong></p>
<p>我们用一个变量 <span class="arithmatex">\(k\)</span> 记录当前已经处理好的数组的长度，初始时 <span class="arithmatex">\(k=0\)</span>，表示空数组。</p>
<p>然后我们从左到右遍历数组，对于遍历到的每个元素 <span class="arithmatex">\(x\)</span>，如果 <span class="arithmatex">\(k=0\)</span> 或者 <span class="arithmatex">\(x \neq nums[k-1]\)</span>，我们就将 <span class="arithmatex">\(x\)</span> 放到 <span class="arithmatex">\(nums[k]\)</span> 的位置，然后 <span class="arithmatex">\(k\)</span> 自增 <span class="arithmatex">\(1\)</span>。否则，<span class="arithmatex">\(x\)</span> 与 <span class="arithmatex">\(nums[k-1]\)</span> 相同，我们直接跳过这个元素。继续遍历，直到遍历完整个数组。</p>
<p>这样，当遍历结束时，<span class="arithmatex">\(nums\)</span> 中前 <span class="arithmatex">\(k\)</span> 个元素就是我们要求的答案，且 <span class="arithmatex">\(k\)</span> 就是答案的长度。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为数组的长度。</p>
<p>补充：</p>
<p>原问题要求最多相同的数字最多出现 <span class="arithmatex">\(1\)</span> 次，我们可以扩展至相同的数字最多保留 <span class="arithmatex">\(k\)</span> 个。</p>
<ul>
<li>由于相同的数字最多保留 <span class="arithmatex">\(k\)</span> 个，那么原数组的前 <span class="arithmatex">\(k\)</span> 个元素我们可以直接保留；</li>
<li>对于后面的数字，能够保留的前提是：当前数字 <span class="arithmatex">\(x\)</span> 与前面已保留的数字的倒数第 <span class="arithmatex">\(k\)</span> 个元素比较，不同则保留，相同则跳过。</li>
</ul>
<p>相似题目：</p>
<ul>
<li><a href="https://github.com/doocs/leetcode/blob/main/solution/0000-0099/0080.Remove%20Duplicates%20from%20Sorted%20Array%20II/README.md">80. 删除有序数组中的重复项 II</a></li>
</ul></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int removeDuplicates(int[] nums) {
        int k = 0;
        for (int x : nums) {
            if (k == 0 || x != nums[k - 1]) {
                nums[k++] = x;
            }
        }
        return k;
    }
}
</code></pre>

</section></template>
<template id="panel-q-129"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">129</span>    <h2 class="q-title">剑指 Offer 36. 二叉搜索树与双向链表</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 47</span>    <span class="pill algo">树、二叉搜索树、链表、深度优先搜索</span>    <a class="pill link" href="https://leetcode.cn/problems/er-cha-sou-suo-shu-yu-shuang-xiang-lian-biao-lcof" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>输入一棵二叉搜索树，将该二叉搜索树转换成一个排序的循环双向链表。要求不能创建任何新的节点，只能调整树中节点指针的指向。</p>
<p>为了让您更好地理解问题，以下面的二叉搜索树为例：</p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2018/10/12/bstdlloriginalbst.png" /></p>
<p>我们希望将这个二叉搜索树转化为双向循环链表。链表中的每个节点都有一个前驱和后继指针。对于双向循环链表，第一个节点的前驱是最后一个节点，最后一个节点的后继是第一个节点。</p>
<p>下图展示了上面的二叉搜索树转化成的链表。“head” 表示指向链表中有最小元素的节点。</p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2018/10/12/bstdllreturndll.png" /></p>
<p>特别地，我们希望可以就地完成转换操作。当转化完成以后，树中节点的左指针需要指向前驱，树中节点的右指针需要指向后继。还需要返回链表中的第一个节点的指针。</p>
<p><strong>注意：</strong>本题与主站 426 题相同：<a href="https://leetcode-cn.com/problems/convert-binary-search-tree-to-sorted-doubly-linked-list/">https://leetcode-cn.com/problems/convert-binary-search-tree-to-sorted-doubly-linked-list/</a></p>
<p><strong>注意：</strong>此题对比原题有改动。</p></section><section class="q-block solution"><p><strong>中序遍历原地串联</strong></p>
<p>二叉搜索树的中序遍历天然递增。遍历过程中用 <code>prev</code> 记录前一个节点，把 <code>prev.right</code> 与 <code>current.left</code> 双向连接。遍历完再把最小节点与最大节点首尾相连形成环。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，递归栈空间复杂度 <span class="arithmatex">\(O(h)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private Node head;
    private Node prev;

    public Node treeToDoublyList(Node root) {
        if (root == null) return null;
        inorder(root);
        head.left = prev;
        prev.right = head;
        return head;
    }

    private void inorder(Node node) {
        if (node == null) return;
        inorder(node.left);
        if (prev == null) head = node;
        else { prev.right = node; node.left = prev; }
        prev = node;
        inorder(node.right);
    }
}
</code></pre>

</section></template>
<template id="panel-q-130"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">130</span>    <h2 class="q-title">958. 二叉树的完全性检验</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 47</span>    <span class="pill algo">树、广度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/check-completeness-of-a-binary-tree" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个二叉树，确定它是否是一个<em>完全二叉树</em>。</p>
<p><strong><a href="https://baike.baidu.com/item/完全二叉树/7773232?fr=aladdin">百度百科</a> 中对完全二叉树的定义如下：</strong></p>
<p>若设二叉树的深度为 h，除第 h 层外，其它各层 (1～h-1) 的结点数都达到最大个数，第 h 层所有的结点都连续集中在最左边，这就是完全二叉树。（注：第 h 层可能包含 1~ 2<sup>h</sup> 个节点。）</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode-cn.com/aliyun-lc-upload/uploads/2018/12/15/complete-binary-tree-1.png" /></p>
<pre><code class="language-text">输入：[1,2,3,4,5,6]
输出：true
解释：最后一层前的每一层都是满的（即，结点值为 {1} 和 {2,3} 的两层），且最后一层中的所有结点（{4,5,6}）都尽可能地向左。
</code></pre>
<p><strong>示例 2：</strong></p>
<p>**</p>
<p><img alt="题目示意图" src="https://assets.leetcode-cn.com/aliyun-lc-upload/uploads/2018/12/15/complete-binary-tree-2.png" /></p>
<p>**</p>
<pre><code class="language-text">输入：[1,2,3,4,5,null,7]
输出：false
解释：值为 7 的结点没有尽可能靠向左侧。
</code></pre>
<p><strong>提示：</strong></p>
<ol>
<li>树中将会有 1 到 100 个结点。</li>
</ol></section><section class="q-block solution"><p><strong>方法一</strong></p>
<p>采用题目对应的标准算法实现。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public boolean isCompleteTree(TreeNode root) {
        Deque&lt;TreeNode&gt; q = new LinkedList&lt;&gt;();
        q.offer(root);
        while (q.peek() != null) {
            TreeNode node = q.poll();
            q.offer(node.left);
            q.offer(node.right);
        }
        while (!q.isEmpty() &amp;&amp; q.peek() == null) {
            q.poll();
        }
        return q.isEmpty();
    }
}
</code></pre>

</section></template>
<template id="panel-q-131"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">131</span>    <h2 class="q-title">剑指 Offer 09. 用两个栈实现队列</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 47</span>    <span class="pill algo">栈、队列、设计</span>    <a class="pill link" href="https://leetcode.cn/problems/yong-liang-ge-zhan-shi-xian-dui-lie-lcof" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>用两个栈实现一个队列。队列的声明如下，请实现它的两个函数<code>appendTail</code>和<code>deleteHead</code>，分别完成在队列尾部插入整数和在队列头部删除整数的功能。(若队列中没有元素，<code>deleteHead</code>操作返回 -1 )</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入：
[&quot;CQueue&quot;,&quot;appendTail&quot;,&quot;deleteHead&quot;,&quot;deleteHead&quot;]
[[],[3],[],[]]
输出：[null,null,3,-1]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入：
[&quot;CQueue&quot;,&quot;deleteHead&quot;,&quot;appendTail&quot;,&quot;appendTail&quot;,&quot;deleteHead&quot;,&quot;deleteHead&quot;]
[[],[],[5],[2],[],[]]
输出：[null,-1,null,null,5,2]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= values &lt;= 10000</code></li>
<li><code>最多会对 appendTail、deleteHead 进行 10000 次调用</code></li>
</ul></section><section class="q-block solution"><p><strong>双栈队列</strong></p>
<p><code>in</code> 栈负责入队，<code>out</code> 栈负责出队。只有 <code>out</code> 为空时才把 <code>in</code> 中所有元素倒入 <code>out</code>，这样每个元素最多进出两个栈各一次。</p>
<p>入队为 <span class="arithmatex">\(O(1)\)</span>；出队均摊为 <span class="arithmatex">\(O(1)\)</span>；空间复杂度 <span class="arithmatex">\(O(n)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">import java.util.*;

class CQueue {
    private final Deque&lt;Integer&gt; in = new ArrayDeque&lt;&gt;();
    private final Deque&lt;Integer&gt; out = new ArrayDeque&lt;&gt;();

    public CQueue() {}

    public void appendTail(int value) {
        in.push(value);
    }

    public int deleteHead() {
        if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop());
        return out.isEmpty() ? -1 : out.pop();
    }
}
</code></pre>

</section></template>
<template id="panel-q-132"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">132</span>    <h2 class="q-title">补充题23. 检测循环依赖</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 46</span>    <span class="pill algo">图、拓扑排序、广度优先搜索</span>    <a class="pill link" href="https://mp.weixin.qq.com/s/pCRscwKqQdYYN7M1Sia7xA" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定 <code>taskCount</code> 个任务（编号 <code>0</code> 到 <code>taskCount - 1</code>）和依赖数组 <code>dependencies</code>。每个二元组 <code>[a, b]</code> 表示任务 <code>a</code> 必须在任务 <code>b</code> 之后执行。判断这些依赖中是否不存在循环，从而所有任务都能完成。</p>
<p><strong>示例：</strong> <code>taskCount = 2, dependencies = [[1,0]]</code>，输出 <code>true</code>；<code>dependencies = [[1,0],[0,1]]</code>，输出 <code>false</code>。</p></section><section class="q-block solution"><p><strong>拓扑排序检测有向环</strong></p>
<p>把依赖关系看作有向边：若任务 <code>a</code> 依赖任务 <code>b</code>，建立 <code>b -&gt; a</code>。先把所有入度为 0 的任务入队，每弹出一个任务就删除它的出边。最终处理数量等于任务总数则无环，否则剩余节点属于循环依赖。</p>
<p>时间复杂度 <span class="arithmatex">\(O(V+E)\)</span>，空间复杂度 <span class="arithmatex">\(O(V+E)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">import java.util.*;

class Solution {
    // dependencies[i] = [task, prerequisite]
    public boolean canFinish(int taskCount, int[][] dependencies) {
        List&lt;Integer&gt;[] graph = new List[taskCount];
        for (int i = 0; i &lt; taskCount; i++) graph[i] = new ArrayList&lt;&gt;();
        int[] indegree = new int[taskCount];
        for (int[] edge : dependencies) {
            graph[edge[1]].add(edge[0]);
            indegree[edge[0]]++;
        }
        Deque&lt;Integer&gt; queue = new ArrayDeque&lt;&gt;();
        for (int i = 0; i &lt; taskCount; i++) if (indegree[i] == 0) queue.offer(i);
        int visited = 0;
        while (!queue.isEmpty()) {
            int node = queue.poll();
            visited++;
            for (int next : graph[node]) {
                if (--indegree[next] == 0) queue.offer(next);
            }
        }
        return visited == taskCount;
    }
}
</code></pre>

</section></template>
<template id="panel-q-133"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">133</span>    <h2 class="q-title">74. 搜索二维矩阵</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 46</span>    <span class="pill algo">数组、二分查找、矩阵</span>    <a class="pill link" href="https://leetcode.cn/problems/search-a-2d-matrix" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>编写一个高效的算法来判断<code>m x n</code>矩阵中，是否存在一个目标值。该矩阵具有如下特性：</p>
<ul>
<li>每行中的整数从左到右按升序排列。</li>
<li>每行的第一个整数大于前一行的最后一个整数。</li>
</ul>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/10/05/mat.jpg" /></p>
<pre><code class="language-text">
输入：matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3
输出：true
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode-cn.com/aliyun-lc-upload/uploads/2020/11/25/mat2.jpg" /></p>
<pre><code class="language-text">
输入：matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 13
输出：false
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>m == matrix.length</code></li>
<li><code>n == matrix[i].length</code></li>
<li><code>1 &lt;= m, n &lt;= 100</code></li>
<li><code>-10&lt;sup&gt;4&lt;/sup&gt; &lt;= matrix[i][j], target &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：二分查找</strong></p>
<p>我们将二维矩阵逻辑展开，然后二分查找即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\log (m \times n))\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别是矩阵的行数和列数。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public boolean searchMatrix(int[][] matrix, int target) {
        int m = matrix.length, n = matrix[0].length;
        int left = 0, right = m * n - 1;
        while (left &lt; right) {
            int mid = (left + right) &gt;&gt; 1;
            int x = mid / n, y = mid % n;
            if (matrix[x][y] &gt;= target) {
                right = mid;
            } else {
                left = mid + 1;
            }
        }
        return matrix[left / n][left % n] == target;
    }
}
</code></pre>

</section></template>
<template id="panel-q-134"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">134</span>    <h2 class="q-title">补充题1. 排序奇升偶降链表</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 46</span>    <span class="pill algo">链表、双指针、归并排序</span>    <a class="pill link" href="https://mp.weixin.qq.com/s/0WVa2wIAeG0nYnVndZiEXQ" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一条链表，奇数位置上的节点值按升序排列，偶数位置上的节点值按降序排列。请在不创建新数据节点的前提下，将整条链表重新排成升序。</p>
<p>例如 <code>1 -&gt; 8 -&gt; 3 -&gt; 6 -&gt; 5 -&gt; 4 -&gt; 7 -&gt; 2</code>，输出 <code>1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; 5 -&gt; 6 -&gt; 7 -&gt; 8</code>。</p></section><section class="q-block solution"><p><strong>拆分、反转与归并链表</strong></p>
<p>奇数位置节点本来递增，偶数位置节点本来递减。先按位置拆成两条链表，把偶数链表反转为递增，再像合并两个有序链表一样合并。整个过程只修改指针。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，额外空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public ListNode sortLinkedList(ListNode head) {
        if (head == null || head.next == null) return head;
        ListNode odd = head, evenHead = head.next, even = evenHead;
        while (even != null &amp;&amp; even.next != null) {
            odd.next = even.next;
            odd = odd.next;
            even.next = odd.next;
            even = even.next;
        }
        odd.next = null;
        return merge(head, reverse(evenHead));
    }

    private ListNode reverse(ListNode head) {
        ListNode prev = null;
        while (head != null) {
            ListNode next = head.next;
            head.next = prev;
            prev = head;
            head = next;
        }
        return prev;
    }

    private ListNode merge(ListNode a, ListNode b) {
        ListNode dummy = new ListNode(0), tail = dummy;
        while (a != null &amp;&amp; b != null) {
            if (a.val &lt;= b.val) { tail.next = a; a = a.next; }
            else { tail.next = b; b = b.next; }
            tail = tail.next;
        }
        tail.next = a != null ? a : b;
        return dummy.next;
    }
}
</code></pre>

</section></template>
<template id="panel-q-135"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">135</span>    <h2 class="q-title">7. 整数反转</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 45</span>    <span class="pill algo">数学</span>    <a class="pill link" href="https://leetcode.cn/problems/reverse-integer" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个 32 位的有符号整数<code>x</code>，返回将<code>x</code>中的数字部分反转后的结果。</p>
<p>如果反转后整数超过 32 位的有符号整数的范围<code>[−2&lt;sup&gt;31&lt;/sup&gt; , 2&lt;sup&gt;31&lt;/sup&gt; − 1]</code>，就返回 0。</p>
<p><strong>假设环境不允许存储 64 位整数（有符号或无符号）。</strong></p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：x = 123
输出：321
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：x = -123
输出：-321
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：x = 120
输出：21
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：x = 0
输出：0
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>-2&lt;sup&gt;31&lt;/sup&gt; &lt;= x &lt;= 2&lt;sup&gt;31&lt;/sup&gt; - 1</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：数学</strong></p>
<p>我们不妨记 <span class="arithmatex">\(mi\)</span> 和 <span class="arithmatex">\(mx\)</span> 分别为 <span class="arithmatex">\(-2^{31}\)</span> 和 <span class="arithmatex">\(2^{31} - 1\)</span>，则 <span class="arithmatex">\(x\)</span> 的反转结果 <span class="arithmatex">\(ans\)</span> 需要满足 <span class="arithmatex">\(mi \le ans \le mx\)</span>。</p>
<p>我们可以通过不断地对 <span class="arithmatex">\(x\)</span> 取余来获取 <span class="arithmatex">\(x\)</span> 的最后一位数字 <span class="arithmatex">\(y\)</span>，并将 <span class="arithmatex">\(y\)</span> 添加到 <span class="arithmatex">\(ans\)</span> 的末尾。在添加 <span class="arithmatex">\(y\)</span> 之前，我们需要判断 <span class="arithmatex">\(ans\)</span> 是否溢出。即判断 <span class="arithmatex">\(ans \times 10 + y\)</span> 是否在 <span class="arithmatex">\([mi, mx]\)</span> 的范围内。</p>
<p>若 <span class="arithmatex">\(x \gt 0\)</span>，那么需要满足 <span class="arithmatex">\(ans \times 10 + y \leq mx\)</span>，即 <span class="arithmatex">\(ans \times 10 + y \leq \left \lfloor \frac{mx}{10} \right \rfloor \times 10 + 7\)</span>。整理得 <span class="arithmatex">\((ans - \left \lfloor \frac{mx}{10} \right \rfloor) \times 10 \leq 7 - y\)</span>。</p>
<p>下面我们讨论上述不等式成立的条件：</p>
<ul>
<li>当 <span class="arithmatex">\(ans \lt \left \lfloor \frac{mx}{10} \right \rfloor\)</span> 时，不等式显然成立；</li>
<li>当 <span class="arithmatex">\(ans = \left \lfloor \frac{mx}{10} \right \rfloor\)</span> 时，不等式成立的充要条件是 <span class="arithmatex">\(y \leq 7\)</span>。如果 <span class="arithmatex">\(ans = \left \lfloor \frac{mx}{10} \right \rfloor\)</span> 并且还能继续添加数字，说明此时数字是最高位，即此时 <span class="arithmatex">\(y\)</span> 一定不超过 <span class="arithmatex">\(2\)</span>，因此，不等式一定成立；</li>
<li>当 <span class="arithmatex">\(ans \gt \left \lfloor \frac{mx}{10} \right \rfloor\)</span> 时，不等式显然不成立。</li>
</ul>
<p>综上，当 <span class="arithmatex">\(x \gt 0\)</span> 时，不等式成立的充要条件是 <span class="arithmatex">\(ans \leq \left \lfloor \frac{mx}{10} \right \rfloor\)</span>。</p>
<p>同理，当 <span class="arithmatex">\(x \lt 0\)</span> 时，不等式成立的充要条件是 <span class="arithmatex">\(ans \geq \left \lfloor \frac{mi}{10} \right \rfloor\)</span>。</p>
<p>因此，我们可以通过判断 <span class="arithmatex">\(ans\)</span> 是否在 <span class="arithmatex">\([\left \lfloor \frac{mi}{10} \right \rfloor, \left \lfloor \frac{mx}{10} \right \rfloor]\)</span> 的范围内来判断 <span class="arithmatex">\(ans\)</span> 是否溢出。若溢出，则返回 <span class="arithmatex">\(0\)</span>。否则，将 <span class="arithmatex">\(y\)</span> 添加到 <span class="arithmatex">\(ans\)</span> 的末尾，然后将 <span class="arithmatex">\(x\)</span> 的最后一位数字去除，即 <span class="arithmatex">\(x \gets \left \lfloor \frac{x}{10} \right \rfloor\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\log |x|)\)</span>，其中 <span class="arithmatex">\(|x|\)</span> 为 <span class="arithmatex">\(x\)</span> 的绝对值。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int reverse(int x) {
        int ans = 0;
        for (; x != 0; x /= 10) {
            if (ans &lt; Integer.MIN_VALUE / 10 || ans &gt; Integer.MAX_VALUE / 10) {
                return 0;
            }
            ans = ans * 10 + x % 10;
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-136"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">136</span>    <h2 class="q-title">347. 前 K 个高频元素</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 44</span>    <span class="pill algo">数组、哈希表、分治、桶排序、计数、快速选择、排序、堆（优先队列）</span>    <a class="pill link" href="https://leetcode.cn/problems/top-k-frequent-elements" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个整数数组<code>nums</code>和一个整数<code>k</code>，请你返回其中出现频率前<code>k</code>高的元素。你可以按<strong>任意顺序</strong>返回答案。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">
输入: nums = [1,1,1,2,2,3], k = 2
输出: [1,2]
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
输入: nums = [1], k = 1
输出: [1]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>k</code>的取值范围是<code>[1, 数组中不相同的元素的个数]</code></li>
<li>题目数据保证答案唯一，换句话说，数组中前<code>k</code>个高频元素的集合是唯一的</li>
</ul>
<p><strong>进阶：</strong>你所设计算法的时间复杂度<strong>必须</strong>优于<code>O(n log n)</code>，其中<code>n</code>**是数组大小。</p></section><section class="q-block solution"><p><strong>方法一：哈希表 + 优先队列（小根堆）</strong></p>
<p>我们可以使用一个哈希表 <span class="arithmatex">\(\textit{cnt}\)</span> 统计每个元素出现的次数，然后使用一个小根堆（优先队列）来保存前 <span class="arithmatex">\(k\)</span> 个高频元素。</p>
<p>我们首先遍历一遍数组，统计每个元素出现的次数，然后遍历哈希表，将元素和出现次数存入小根堆中。如果小根堆的大小超过了 <span class="arithmatex">\(k\)</span>，我们就将堆顶元素弹出，保证堆的大小始终为 <span class="arithmatex">\(k\)</span>。</p>
<p>最后，我们将小根堆中的元素依次弹出，放入结果数组中即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n \times \log k)\)</span>，空间复杂度 <span class="arithmatex">\(O(k)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是数组的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int[] topKFrequent(int[] nums, int k) {
        Map&lt;Integer, Integer&gt; cnt = new HashMap&lt;&gt;();
        for (int x : nums) {
            cnt.merge(x, 1, Integer::sum);
        }
        PriorityQueue&lt;Map.Entry&lt;Integer, Integer&gt;&gt; pq
            = new PriorityQueue&lt;&gt;(Comparator.comparingInt(Map.Entry::getValue));
        for (var e : cnt.entrySet()) {
            pq.offer(e);
            if (pq.size() &gt; k) {
                pq.poll();
            }
        }
        return pq.stream().mapToInt(Map.Entry::getKey).toArray();
    }
}
</code></pre>

</section></template>
<template id="panel-q-137"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">137</span>    <h2 class="q-title">135. 分发糖果</h2>  </div>  <div class="q-meta">    <span class="pill diff hard">困难</span>    <span class="pill freq">频度 44</span>    <span class="pill algo">贪心、数组</span>    <a class="pill link" href="https://leetcode.cn/problems/candy" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>老师想给孩子们分发糖果，有<em>N</em>个孩子站成了一条直线，老师会根据每个孩子的表现，预先给他们评分。</p>
<p>你需要按照以下要求，帮助老师给这些孩子分发糖果：</p>
<ul>
<li>每个孩子至少分配到 1 个糖果。</li>
<li>评分更高的孩子必须比他两侧的邻位孩子获得更多的糖果。</li>
</ul>
<p>那么这样下来，老师至少需要准备多少颗糖果呢？</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：[1,0,2]
输出：5
解释：你可以分别给这三个孩子分发 2、1、2 颗糖果。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：[1,2,2]
输出：4
解释：你可以分别给这三个孩子分发 1、2、1 颗糖果。
     第三个孩子只得到 1 颗糖果，这已满足上述两个条件。
</code></pre></section><section class="q-block solution"><p><strong>方法一：两次遍历</strong></p>
<p>我们初始化两个数组 <span class="arithmatex">\(left\)</span> 和 <span class="arithmatex">\(right\)</span>，其中 <span class="arithmatex">\(left[i]\)</span> 表示当前孩子比左边孩子评分高时，当前孩子至少应该获得的糖果数，而 <span class="arithmatex">\(right[i]\)</span> 表示当前孩子比右边孩子评分高时，当前孩子至少应该获得的糖果数。初始时 <span class="arithmatex">\(left[i]=1\)</span>, <span class="arithmatex">\(right[i]=1\)</span>。</p>
<p>我们从左到右遍历一遍，如果当前孩子比左边孩子评分高，则 <span class="arithmatex">\(left[i]=left[i-1]+1\)</span>；同理，我们从右到左遍历一遍，如果当前孩子比右边孩子评分高，则 <span class="arithmatex">\(right[i]=right[i+1]+1\)</span>。</p>
<p>最后，我们遍历一遍评分数组，每个孩子至少应该获得的糖果数为 <span class="arithmatex">\(left[i]\)</span> 和 <span class="arithmatex">\(right[i]\)</span> 中的最大值，将它们累加起来即为答案。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是评分数组的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int candy(int[] ratings) {
        int n = ratings.length;
        int[] left = new int[n];
        int[] right = new int[n];
        Arrays.fill(left, 1);
        Arrays.fill(right, 1);
        for (int i = 1; i &lt; n; ++i) {
            if (ratings[i] &gt; ratings[i - 1]) {
                left[i] = left[i - 1] + 1;
            }
        }
        for (int i = n - 2; i &gt;= 0; --i) {
            if (ratings[i] &gt; ratings[i + 1]) {
                right[i] = right[i + 1] + 1;
            }
        }
        int ans = 0;
        for (int i = 0; i &lt; n; ++i) {
            ans += Math.max(left[i], right[i]);
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-138"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">138</span>    <h2 class="q-title">125. 验证回文串</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 43</span>    <span class="pill algo">双指针、字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/valid-palindrome" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个字符串，验证它是否是回文串，只考虑字母和数字字符，可以忽略字母的大小写。</p>
<p><strong>说明：</strong>本题中，我们将空字符串定义为有效的回文串。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">
输入: &quot;A man, a plan, a canal: Panama&quot;
输出: true
解释：&quot;amanaplanacanalpanama&quot; 是回文串
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
输入: &quot;race a car&quot;
输出: false
解释：&quot;raceacar&quot; 不是回文串
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= s.length &lt;= 2 * 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li>字符串<code>s</code>由 ASCII 字符组成</li>
</ul></section><section class="q-block solution"><p><strong>方法一：双指针</strong></p>
<p>我们用双指针 <span class="arithmatex">\(i\)</span> 和 <span class="arithmatex">\(j\)</span> 分别指向字符串 <span class="arithmatex">\(s\)</span> 的两端，接下来循环以下过程，直至 <span class="arithmatex">\(i \geq j\)</span>：</p>
<ol>
<li>如果 <span class="arithmatex">\(s[i]\)</span> 不是字母或数字，指针 <span class="arithmatex">\(i\)</span> 右移一位，继续下一次循环；</li>
<li>如果 <span class="arithmatex">\(s[j]\)</span> 不是字母或数字，指针 <span class="arithmatex">\(j\)</span> 左移一位，继续下一次循环；</li>
<li>如果 <span class="arithmatex">\(s[i]\)</span> 和 <span class="arithmatex">\(s[j]\)</span> 的小写形式不相等，返回 <code>false</code>；</li>
<li>否则，指针 <span class="arithmatex">\(i\)</span> 右移一位，指针 <span class="arithmatex">\(j\)</span> 左移一位，继续下一次循环。</li>
</ol>
<p>循环结束，返回 <code>true</code>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是字符串 <span class="arithmatex">\(s\)</span> 的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public boolean isPalindrome(String s) {
        int i = 0, j = s.length() - 1;
        while (i &lt; j) {
            if (!Character.isLetterOrDigit(s.charAt(i))) {
                ++i;
            } else if (!Character.isLetterOrDigit(s.charAt(j))) {
                --j;
            } else if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j))) {
                return false;
            } else {
                ++i;
                --j;
            }
        }
        return true;
    }
}
</code></pre>

</section></template>
<template id="panel-q-139"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">139</span>    <h2 class="q-title">50. Pow(x, n)</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 43</span>    <span class="pill algo">递归、数学</span>    <a class="pill link" href="https://leetcode.cn/problems/powx-n" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>实现<a href="https://www.cplusplus.com/reference/valarray/pow/">pow(<em>x</em>,<em>n</em>)</a> ，即计算 x 的 n 次幂函数（即，x<sup>n</sup> ）。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：x = 2.00000, n = 10
输出：1024.00000
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：x = 2.10000, n = 3
输出：9.26100
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：x = 2.00000, n = -2
输出：0.25000
解释：2-2 = 1/22 = 1/4 = 0.25
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>-100.0 &lt; x &lt; 100.0</code></li>
<li><code>-2&lt;sup&gt;31&lt;/sup&gt; &lt;= n &lt;= 2&lt;sup&gt;31&lt;/sup&gt; -1</code></li>
<li><code>-10&lt;sup&gt;4&lt;/sup&gt; &lt;= x&lt;sup&gt;n&lt;/sup&gt; &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：数学（快速幂）</strong></p>
<p>快速幂算法的核心思想是将幂指数 <span class="arithmatex">\(n\)</span> 拆分为若干个二进制位上的 <span class="arithmatex">\(1\)</span> 的和，然后将 <span class="arithmatex">\(x\)</span> 的 <span class="arithmatex">\(n\)</span> 次幂转化为 <span class="arithmatex">\(x\)</span> 的若干个幂的乘积。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\log n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。其中 <span class="arithmatex">\(n\)</span> 为幂指数。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public double myPow(double x, int n) {
        return n &gt;= 0 ? qpow(x, n) : 1 / qpow(x, -(long) n);
    }

    private double qpow(double a, long n) {
        double ans = 1;
        for (; n &gt; 0; n &gt;&gt;= 1) {
            if ((n &amp; 1) == 1) {
                ans = ans * a;
            }
            a = a * a;
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-140"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">140</span>    <h2 class="q-title">208. 实现 Trie (前缀树)</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 42</span>    <span class="pill algo">设计、字典树、哈希表、字符串</span>    <a class="pill link" href="https://leetcode.cn/problems/implement-trie-prefix-tree" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p><strong><a href="https://baike.baidu.com/item/字典树/9825209?fr=aladdin">Trie</a></strong>（发音类似 "try"）或者说<strong>前缀树</strong>是一种树形数据结构，用于高效地存储和检索字符串数据集中的键。这一数据结构有相当多的应用情景，例如自动补完和拼写检查。</p>
<p>请你实现 Trie 类：</p>
<ul>
<li><code>Trie()</code>初始化前缀树对象。</li>
<li><code>void insert(String word)</code>向前缀树中插入字符串<code>word</code>。</li>
<li><code>boolean search(String word)</code>如果字符串<code>word</code>在前缀树中，返回<code>true</code>（即，在检索之前已经插入）；否则，返回<code>false</code>。</li>
<li><code>boolean startsWith(String prefix)</code>如果之前已经插入的字符串<code>word</code>的前缀之一为<code>prefix</code>，返回<code>true</code>；否则，返回<code>false</code>。</li>
</ul>
<p><strong>示例：</strong></p>
<pre><code class="language-text">
输入
[&quot;Trie&quot;, &quot;insert&quot;, &quot;search&quot;, &quot;search&quot;, &quot;startsWith&quot;, &quot;insert&quot;, &quot;search&quot;]
[[], [&quot;apple&quot;], [&quot;apple&quot;], [&quot;app&quot;], [&quot;app&quot;], [&quot;app&quot;], [&quot;app&quot;]]
输出
[null, null, true, false, true, null, true]

解释
Trie trie = new Trie();
trie.insert(&quot;apple&quot;);
trie.search(&quot;apple&quot;);   // 返回 True
trie.search(&quot;app&quot;);     // 返回 False
trie.startsWith(&quot;app&quot;); // 返回 True
trie.insert(&quot;app&quot;);
trie.search(&quot;app&quot;);     // 返回 True
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= word.length, prefix.length &lt;= 2000</code></li>
<li><code>word</code>和<code>prefix</code>仅由小写英文字母组成</li>
<li><code>insert</code>、<code>search</code>和<code>startsWith</code>调用次数<strong>总计</strong>不超过<code>3 * 10&lt;sup&gt;4&lt;/sup&gt;</code>次</li>
</ul></section><section class="q-block solution"><p><strong>方法一：前缀树</strong></p>
<p>前缀树每个节点包括两部分：</p>
<ol>
<li>指向子节点的指针数组 <span class="arithmatex">\(children\)</span>，对于本题而言，数组长度为 <span class="arithmatex">\(26\)</span>，即小写英文字母的数量。<span class="arithmatex">\(children[0]\)</span> 对应小写字母 <span class="arithmatex">\(a\)</span>，...，<span class="arithmatex">\(children[25]\)</span> 对应小写字母 <span class="arithmatex">\(z\)</span>。</li>
<li>布尔字段 <span class="arithmatex">\(isEnd\)</span>，表示该节点是否为字符串的结尾。</li>
</ol></section><section class="q-block code"><pre><code class="language-java">class Trie {
    private Trie[] children;
    private boolean isEnd;

    public Trie() {
        children = new Trie[26];
    }

    public void insert(String word) {
        Trie node = this;
        for (char c : word.toCharArray()) {
            int idx = c - 'a';
            if (node.children[idx] == null) {
                node.children[idx] = new Trie();
            }
            node = node.children[idx];
        }
        node.isEnd = true;
    }

    public boolean search(String word) {
        Trie node = searchPrefix(word);
        return node != null &amp;&amp; node.isEnd;
    }

    public boolean startsWith(String prefix) {
        Trie node = searchPrefix(prefix);
        return node != null;
    }

    private Trie searchPrefix(String s) {
        Trie node = this;
        for (char c : s.toCharArray()) {
            int idx = c - 'a';
            if (node.children[idx] == null) {
                return null;
            }
            node = node.children[idx];
        }
        return node;
    }
}

/**
 * Your Trie object will be instantiated and called as such:
 * Trie obj = new Trie();
 * obj.insert(word);
 * boolean param_2 = obj.search(word);
 * boolean param_3 = obj.startsWith(prefix);
 */
</code></pre>

</section></template>
<template id="panel-q-141"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">141</span>    <h2 class="q-title">572. 另一个树的子树</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 42</span>    <span class="pill algo">树、深度优先搜索、二叉树、字符串匹配、哈希函数</span>    <a class="pill link" href="https://leetcode.cn/problems/subtree-of-another-tree" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你两棵二叉树<code>root</code>和<code>subRoot</code>。检验<code>root</code>中是否包含和<code>subRoot</code>具有相同结构和节点值的子树。如果存在，返回<code>true</code>；否则，返回<code>false</code>。</p>
<p>二叉树<code>tree</code>的一棵子树包括<code>tree</code>的某个节点和这个节点的所有后代节点。<code>tree</code>也可以看做它自身的一棵子树。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/04/28/subtree1-tree.jpg" /></p>
<pre><code class="language-text">
输入：root = [3,4,5,1,2], subRoot = [4,1,2]
输出：true
</code></pre>
<p><strong>示例 2：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2021/04/28/subtree2-tree.jpg" /></p>
<pre><code class="language-text">
输入：root = [3,4,5,1,2,null,null,null,null,0], subRoot = [4,1,2]
输出：false
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>root</code>树上的节点数量范围是<code>[1, 2000]</code></li>
<li><code>subRoot</code>树上的节点数量范围是<code>[1, 1000]</code></li>
<li><code>-10&lt;sup&gt;4&lt;/sup&gt; &lt;= root.val &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>-10&lt;sup&gt;4&lt;/sup&gt; &lt;= subRoot.val &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：DFS</strong></p>
<p>我们定义一个辅助函数 <span class="arithmatex">\(\textit{same}(p, q)\)</span>，用于判断以 <span class="arithmatex">\(p\)</span> 为根节点的树和以 <span class="arithmatex">\(q\)</span> 为根节点的树是否相等。如果两棵树的根节点的值相等，并且它们的左子树和右子树也分别相等，那么这两棵树是相等的。</p>
<p>在 <span class="arithmatex">\(\textit{isSubtree}(\textit{root}, \textit{subRoot})\)</span> 函数中，我们首先判断 <span class="arithmatex">\(\textit{root}\)</span> 是否为空，如果为空，则返回 <span class="arithmatex">\(\text{false}\)</span>。否则，我们判断 <span class="arithmatex">\(\textit{root}\)</span> 和 <span class="arithmatex">\(\textit{subRoot}\)</span> 是否相等，如果相等，则返回 <span class="arithmatex">\(\text{true}\)</span>。否则，我们递归地判断 <span class="arithmatex">\(\textit{root}\)</span> 的左子树和右子树是否包含 <span class="arithmatex">\(\textit{subRoot}\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n \times m)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 和 <span class="arithmatex">\(m\)</span> 分别是树 <span class="arithmatex">\(root\)</span> 和树 <span class="arithmatex">\(subRoot\)</span> 的节点个数。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public boolean isSubtree(TreeNode root, TreeNode subRoot) {
        if (root == null) {
            return false;
        }
        return same(root, subRoot) || isSubtree(root.left, subRoot)
            || isSubtree(root.right, subRoot);
    }

    private boolean same(TreeNode p, TreeNode q) {
        if (p == null || q == null) {
            return p == q;
        }
        return p.val == q.val &amp;&amp; same(p.left, q.left) &amp;&amp; same(p.right, q.right);
    }
}
</code></pre>

</section></template>
<template id="panel-q-142"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">142</span>    <h2 class="q-title">145. 二叉树的后序遍历</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 42</span>    <span class="pill algo">栈、树、深度优先搜索、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/binary-tree-postorder-traversal" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个二叉树，返回它的<em>后序</em>遍历。</p>
<p><strong>示例:</strong></p>
<pre><code class="language-text">输入: [1,null,2,3]
   1
    \
     2
    /
   3

输出: [3,2,1]
</code></pre>
<p><strong>进阶:</strong>递归算法很简单，你可以通过迭代算法完成吗？</p></section><section class="q-block solution"><p><strong>方法一：递归</strong></p>
<p>我们先递归左右子树，然后再访问根节点。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是二叉树的节点数，空间复杂度主要取决于递归调用的栈空间。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    private List&lt;Integer&gt; ans = new ArrayList&lt;&gt;();

    public List&lt;Integer&gt; postorderTraversal(TreeNode root) {
        dfs(root);
        return ans;
    }

    private void dfs(TreeNode root) {
        if (root == null) {
            return;
        }
        dfs(root.left);
        dfs(root.right);
        ans.add(root.val);
    }
}
</code></pre>

</section></template>
<template id="panel-q-143"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">143</span>    <h2 class="q-title">91. 解码方法</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 42</span>    <span class="pill algo">字符串、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/decode-ways" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>一条包含字母<code>A-Z</code>的消息通过以下映射进行了<strong>编码</strong>：</p>
<pre><code class="language-text">
'A' -&gt; 1
'B' -&gt; 2
...
'Z' -&gt; 26
</code></pre>
<p>要<strong>解码</strong>已编码的消息，所有数字必须基于上述映射的方法，反向映射回字母（可能有多种方法）。例如，<code>"11106"</code>可以映射为：</p>
<ul>
<li><code>"AAJF"</code>，将消息分组为<code>(1 1 10 6)</code></li>
<li><code>"KJF"</code>，将消息分组为<code>(11 10 6)</code></li>
</ul>
<p>注意，消息不能分组为<code>(1 11 06)</code>，因为<code>"06"</code>不能映射为<code>"F"</code>，这是由于<code>"6"</code>和<code>"06"</code>在映射中并不等价。</p>
<p>给你一个只含数字的<strong>非空</strong>字符串<code>s</code>，请计算并返回<strong>解码</strong>方法的<strong>总数</strong>。</p>
<p>题目数据保证答案肯定是一个<strong>32 位</strong>的整数。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;12&quot;
输出：2
解释：它可以解码为 &quot;AB&quot;（1 2）或者 &quot;L&quot;（12）。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：s = &quot;226&quot;
输出：3
解释：它可以解码为 &quot;BZ&quot; (2 26), &quot;VF&quot; (22 6), 或者 &quot;BBF&quot; (2 2 6) 。
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：s = &quot;0&quot;
输出：0
解释：没有字符映射到以 0 开头的数字。
含有 0 的有效映射是 'J' -&gt; &quot;10&quot; 和 'T'-&gt; &quot;20&quot; 。
由于没有字符，因此没有有效的方法对此进行解码，因为所有数字都需要映射。
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：s = &quot;06&quot;
输出：0
解释：&quot;06&quot; 不能映射到 &quot;F&quot; ，因为字符串含有前导 0（&quot;6&quot; 和 &quot;06&quot; 在映射中并不等价）。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= s.length &lt;= 100</code></li>
<li><code>s</code>只包含数字，并且可能包含前导零。</li>
</ul></section><section class="q-block solution"><p><strong>方法一：动态规划</strong></p>
<p>我们定义 <span class="arithmatex">\(f[i]\)</span> 表示字符串的前 <span class="arithmatex">\(i\)</span> 个字符的解码方法数，初始时 <span class="arithmatex">\(f[0]=1\)</span>，其余 <span class="arithmatex">\(f[i]=0\)</span>。</p>
<p>考虑 <span class="arithmatex">\(f[i]\)</span> 如何进行状态转移。</p>
<ul>
<li>如果第 <span class="arithmatex">\(i\)</span> 个字符（即 <span class="arithmatex">\(s[i-1]\)</span>）单独形成编码，那么它对应一种解码方式，即 <span class="arithmatex">\(f[i]=f[i-1]\)</span>。前提是 <span class="arithmatex">\(s[i-1] \neq 0\)</span>。</li>
<li>如果第 <span class="arithmatex">\(i-1\)</span> 个字符和第 <span class="arithmatex">\(i\)</span> 个字符组成的字符串在 <span class="arithmatex">\([1,26]\)</span> 范围内，那么它们可以作为一个整体，对应一种解码方式，即 <span class="arithmatex">\(f[i] = f[i] + f[i-2]\)</span>。前提是 <span class="arithmatex">\(s[i-2] \neq 0\)</span>，且 <span class="arithmatex">\(s[i-2]s[i-1]\)</span> 在 <span class="arithmatex">\([1,26]\)</span> 范围内。</li>
</ul>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(n)\)</span>。其中 <span class="arithmatex">\(n\)</span> 是字符串的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int numDecodings(String s) {
        int n = s.length();
        int[] f = new int[n + 1];
        f[0] = 1;
        for (int i = 1; i &lt;= n; ++i) {
            if (s.charAt(i - 1) != '0') {
                f[i] = f[i - 1];
            }
            if (i &gt; 1 &amp;&amp; s.charAt(i - 2) != '0' &amp;&amp; Integer.valueOf(s.substring(i - 2, i)) &lt;= 26) {
                f[i] += f[i - 2];
            }
        }
        return f[n];
    }
}
</code></pre>

</section></template>
<template id="panel-q-144"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">144</span>    <h2 class="q-title">213. 打家劫舍 II</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 41</span>    <span class="pill algo">数组、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/house-robber-ii" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>你是一个专业的小偷，计划偷窃沿街的房屋，每间房内都藏有一定的现金。这个地方所有的房屋都<strong>围成一圈</strong>，这意味着第一个房屋和最后一个房屋是紧挨着的。同时，相邻的房屋装有相互连通的防盗系统，<strong>如果两间相邻的房屋在同一晚上被小偷闯入，系统会自动报警</strong>。</p>
<p>给定一个代表每个房屋存放金额的非负整数数组，计算你<strong>在不触动警报装置的情况下</strong>，今晚能够偷窃到的最高金额。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [2,3,2]
输出：3
解释：你不能先偷窃 1 号房屋（金额 = 2），然后偷窃 3 号房屋（金额 = 2）, 因为他们是相邻的。
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [1,2,3,1]
输出：4
解释：你可以先偷窃 1 号房屋（金额 = 1），然后偷窃 3 号房屋（金额 = 3）。
     偷窃到的最高金额 = 1 + 3 = 4 。
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：nums = [0]
输出：0
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 100</code></li>
<li><code>0 &lt;= nums[i] &lt;= 1000</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：动态规划</strong></p>
<p>环状排列意味着第一个房屋和最后一个房屋中最多只能选择一个偷窃，因此可以把此环状排列房间问题约化为两个单排排列房屋子问题。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int rob(int[] nums) {
        int n = nums.length;
        if (n == 1) {
            return nums[0];
        }
        return Math.max(rob(nums, 0, n - 2), rob(nums, 1, n - 1));
    }

    private int rob(int[] nums, int l, int r) {
        int f = 0, g = 0;
        for (; l &lt;= r; ++l) {
            int ff = Math.max(f, g);
            g = f + nums[l];
            f = ff;
        }
        return Math.max(f, g);
    }
}
</code></pre>

</section></template>
<template id="panel-q-145"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">145</span>    <h2 class="q-title">59. 螺旋矩阵 II</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 41</span>    <span class="pill algo">数组、矩阵、模拟</span>    <a class="pill link" href="https://leetcode.cn/problems/spiral-matrix-ii" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个正整数<code>n</code>，生成一个包含<code>1</code>到<code>n&lt;sup&gt;2&lt;/sup&gt;</code>所有元素，且元素按顺时针顺序螺旋排列的<code>n x n</code>正方形矩阵<code>matrix</code>。</p>
<p><strong>示例 1：</strong></p>
<p><img alt="题目示意图" src="https://assets.leetcode.com/uploads/2020/11/13/spiraln.jpg" /></p>
<pre><code class="language-text">
输入：n = 3
输出：[[1,2,3],[8,9,4],[7,6,5]]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：n = 1
输出：[[1]]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= n &lt;= 20</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：模拟</strong></p>
<p>我们可以直接模拟螺旋矩阵的生成过程。</p>
<p>定义一个二维数组 <span class="arithmatex">\(\textit{ans}\)</span>，用于存储螺旋矩阵。用 <span class="arithmatex">\(i\)</span> 和 <span class="arithmatex">\(j\)</span> 分别表示当前位置的行号和列号，用 <span class="arithmatex">\(k\)</span> 表示当前的方向编号，<span class="arithmatex">\(\textit{dirs}\)</span> 表示方向编号与方向的对应关系。</p>
<p>从 <span class="arithmatex">\(1\)</span> 开始，依次填入矩阵中的每个位置。每次填入一个位置后，计算下一个位置的行号和列号，如果下一个位置不在矩阵中或者已经被填过，则改变方向，再计算下一个位置的行号和列号。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n^2)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是矩阵的边长。忽略答案数组的空间消耗，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int[][] generateMatrix(int n) {
        int[][] ans = new int[n][n];
        final int[] dirs = {0, 1, 0, -1, 0};
        int i = 0, j = 0, k = 0;
        for (int v = 1; v &lt;= n * n; ++v) {
            ans[i][j] = v;
            int x = i + dirs[k], y = j + dirs[k + 1];
            if (x &lt; 0 || x &gt;= n || y &lt; 0 || y &gt;= n || ans[x][y] != 0) {
                k = (k + 1) % 4;
            }
            i += dirs[k];
            j += dirs[k + 1];
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-146"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">146</span>    <h2 class="q-title">10. 正则表达式匹配</h2>  </div>  <div class="q-meta">    <span class="pill diff hard">困难</span>    <span class="pill freq">频度 40</span>    <span class="pill algo">递归、字符串、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/regular-expression-matching" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个字符串<code>s</code>和一个字符规律<code>p</code>，请你来实现一个支持<code>'.'</code>和<code>'*'</code>的正则表达式匹配。</p>
<ul>
<li><code>'.'</code>匹配任意单个字符</li>
<li><code>'*'</code>匹配零个或多个前面的那一个元素</li>
</ul>
<p>所谓匹配，是要涵盖<strong>整个</strong>字符串<code>s</code>的，而不是部分字符串。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：s = &quot;aa&quot; p = &quot;a&quot;
输出：false
解释：&quot;a&quot; 无法匹配 &quot;aa&quot; 整个字符串。
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
输入：s = &quot;aa&quot; p = &quot;a*&quot;
输出：true
解释：因为 '*' 代表可以匹配零个或多个前面的那一个元素, 在这里前面的元素就是 'a'。因此，字符串 &quot;aa&quot; 可被视为 'a' 重复了一次。
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：s = &quot;ab&quot; p = &quot;.*&quot;
输出：true
解释：&quot;.*&quot; 表示可匹配零个或多个（'*'）任意字符（'.'）。
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：s = &quot;aab&quot; p = &quot;c*a*b&quot;
输出：true
解释：因为 '*' 表示零个或多个，这里 'c' 为 0 个, 'a' 被重复一次。因此可以匹配字符串 &quot;aab&quot;。
</code></pre>
<p><strong>示例 5：</strong></p>
<pre><code class="language-text">
输入：s = &quot;mississippi&quot; p = &quot;mis*is*p*.&quot;
输出：false
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>0 &lt;= s.length &lt;= 20</code></li>
<li><code>0 &lt;= p.length &lt;= 30</code></li>
<li><code>s</code>可能为空，且只包含从<code>a-z</code>的小写字母。</li>
<li><code>p</code>可能为空，且只包含从<code>a-z</code>的小写字母，以及字符<code>.</code>和<code>*</code>。</li>
<li>保证每次出现字符<code>*</code>时，前面都匹配到有效的字符</li>
</ul></section><section class="q-block solution"><p><strong>方法一：记忆化搜索</strong></p>
<p>我们设计一个函数 <span class="arithmatex">\(dfs(i, j)\)</span>，表示从 <span class="arithmatex">\(s\)</span> 的第 <span class="arithmatex">\(i\)</span> 个字符开始，和 <span class="arithmatex">\(p\)</span> 的第 <span class="arithmatex">\(j\)</span> 个字符开始是否匹配。那么答案就是 <span class="arithmatex">\(dfs(0, 0)\)</span>。</p>
<p>函数 <span class="arithmatex">\(dfs(i, j)\)</span> 的计算过程如下：</p>
<ul>
<li>如果 <span class="arithmatex">\(j\)</span> 已经到达 <span class="arithmatex">\(p\)</span> 的末尾，那么如果 <span class="arithmatex">\(i\)</span> 也到达了 <span class="arithmatex">\(s\)</span> 的末尾，那么匹配成功，否则匹配失败。</li>
<li>如果 <span class="arithmatex">\(j\)</span> 的下一个字符是 <code>'*'</code>，我们可以选择匹配 <span class="arithmatex">\(0\)</span> 个 <span class="arithmatex">\(s[i]\)</span> 字符，那么就是 <span class="arithmatex">\(dfs(i, j + 2)\)</span>。如果此时 <span class="arithmatex">\(i \lt m\)</span> 并且 <span class="arithmatex">\(s[i]\)</span> 和 <span class="arithmatex">\(p[j]\)</span> 匹配，那么我们可以选择匹配 <span class="arithmatex">\(1\)</span> 个 <span class="arithmatex">\(s[i]\)</span> 字符，那么就是 <span class="arithmatex">\(dfs(i + 1, j)\)</span>。</li>
<li>如果 <span class="arithmatex">\(j\)</span> 的下一个字符不是 <code>'*'</code>，那么如果 <span class="arithmatex">\(i \lt m\)</span> 并且 <span class="arithmatex">\(s[i]\)</span> 和 <span class="arithmatex">\(p[j]\)</span> 匹配，那么就是 <span class="arithmatex">\(dfs(i + 1, j + 1)\)</span>。否则匹配失败。</li>
</ul>
<p>过程中，我们可以使用记忆化搜索，避免重复计算。</p>
<p>时间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>，空间复杂度 <span class="arithmatex">\(O(m \times n)\)</span>。其中 <span class="arithmatex">\(m\)</span> 和 <span class="arithmatex">\(n\)</span> 分别是 <span class="arithmatex">\(s\)</span> 和 <span class="arithmatex">\(p\)</span> 的长度。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private Boolean[][] f;
    private String s;
    private String p;
    private int m;
    private int n;

    public boolean isMatch(String s, String p) {
        m = s.length();
        n = p.length();
        f = new Boolean[m + 1][n + 1];
        this.s = s;
        this.p = p;
        return dfs(0, 0);
    }

    private boolean dfs(int i, int j) {
        if (j &gt;= n) {
            return i == m;
        }
        if (f[i][j] != null) {
            return f[i][j];
        }
        boolean res = false;
        if (j + 1 &lt; n &amp;&amp; p.charAt(j + 1) == '*') {
            res = dfs(i, j + 2)
                || (i &lt; m &amp;&amp; (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') &amp;&amp; dfs(i + 1, j));
        } else {
            res = i &lt; m &amp;&amp; (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.') &amp;&amp; dfs(i + 1, j + 1);
        }
        return f[i][j] = res;
    }
}
</code></pre>

</section></template>
<template id="panel-q-147"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">147</span>    <h2 class="q-title">剑指 Offer 40. 最小的k个数</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 40</span>    <span class="pill algo">数组、堆（优先队列）、快速选择</span>    <a class="pill link" href="https://leetcode.cn/problems/zui-xiao-de-kge-shu-lcof" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>输入整数数组<code>arr</code>，找出其中最小的<code>k</code>个数。例如，输入4、5、1、6、2、7、3、8这8个数字，则最小的4个数字是1、2、3、4。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">输入：arr = [3,2,1], k = 2
输出：[1,2] 或者 [2,1]
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">输入：arr = [0,1,2,1], k = 1
输出：[0]
</code></pre>
<p><strong>限制：</strong></p>
<ul>
<li><code>0 &lt;= k &lt;= arr.length &lt;= 10000</code></li>
<li><code>0 &lt;= arr[i] &lt;= 10000</code></li>
</ul></section><section class="q-block solution"><p><strong>大小为 k 的最大堆</strong></p>
<p>维护一个容量为 <code>k</code> 的最大堆。遍历数组时先放入元素，超过容量就弹出当前最大值；最终堆中保留的正是最小的 <code>k</code> 个元素。若 <code>k=0</code>，直接返回空数组。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n\log k)\)</span>，空间复杂度 <span class="arithmatex">\(O(k)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">import java.util.*;

class Solution {
    public int[] getLeastNumbers(int[] arr, int k) {
        if (k == 0) return new int[0];
        PriorityQueue&lt;Integer&gt; heap = new PriorityQueue&lt;&gt;(Collections.reverseOrder());
        for (int value : arr) {
            heap.offer(value);
            if (heap.size() &gt; k) heap.poll();
        }
        int[] answer = new int[k];
        for (int i = 0; i &lt; k; i++) answer[i] = heap.poll();
        return answer;
    }
}
</code></pre>

</section></template>
<template id="panel-q-148"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">148</span>    <h2 class="q-title">440. 字典序的第K小数字</h2>  </div>  <div class="q-meta">    <span class="pill diff hard">困难</span>    <span class="pill freq">频度 40</span>    <span class="pill algo">字典树</span>    <a class="pill link" href="https://leetcode.cn/problems/k-th-smallest-in-lexicographical-order" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定整数<code>n</code>和<code>k</code>，找到<code>1</code>到<code>n</code>中字典序第<code>k</code>小的数字。</p>
<p>注意：1 ≤ k ≤ n ≤ 10<sup>9</sup> 。</p>
<p><strong>示例 :</strong></p>
<pre><code class="language-text">
输入:
n: 13   k: 2

输出:
10

解释:
字典序的排列是 [1, 10, 11, 12, 13, 2, 3, 4, 5, 6, 7, 8, 9]，所以第二小的数字是 10。
</code></pre></section><section class="q-block solution"><p><strong>方法一：字典树计数 + 贪心构造</strong></p>
<p>本题要求在区间 <span class="arithmatex">\([1, n]\)</span> 中，按<strong>字典序</strong>排序后，找到第 <span class="arithmatex">\(k\)</span> 小的数字。由于 <span class="arithmatex">\(n\)</span> 的范围非常大（最多可达 <span class="arithmatex">\(10^9\)</span>），我们无法直接枚举所有数字后排序。因此我们采用<strong>贪心 + 字典树模拟</strong>的策略。</p>
<p>我们将 <span class="arithmatex">\([1, n]\)</span> 看作一棵 <strong>十叉字典树（Trie）</strong>：</p>
<ul>
<li>每个节点是一个前缀，根节点为空串；</li>
<li>节点的子节点是当前前缀拼接上 <span class="arithmatex">\(0 \sim 9\)</span>；</li>
<li>例如前缀 <span class="arithmatex">\(1\)</span> 会有子节点 <span class="arithmatex">\(10, 11, \ldots, 19\)</span>，而 <span class="arithmatex">\(10\)</span> 会有 <span class="arithmatex">\(100, 101, \ldots, 109\)</span>；</li>
<li>这种结构天然符合字典序遍历。</li>
</ul>
<pre><code>根
├── 1
│   ├── 10
│   ├── 11
│   ├── ...
├── 2
├── ...
</code></pre>
<p>我们使用变量 <span class="arithmatex">\(\textit{curr}\)</span> 表示当前前缀，初始为 <span class="arithmatex">\(1\)</span>。每次我们尝试向下扩展前缀，直到找到第 <span class="arithmatex">\(k\)</span> 小的数字。</p>
<p>每次我们计算当前前缀下有多少个合法数字（即以 <span class="arithmatex">\(\textit{curr}\)</span> 为前缀、且不超过 <span class="arithmatex">\(n\)</span> 的整数个数），记作 <span class="arithmatex">\(\textit{count}(\text{curr})\)</span>：</p>
<ul>
<li>如果 <span class="arithmatex">\(k \ge \text{count}(\text{curr})\)</span>：说明目标不在这棵子树中，跳过整棵子树，前缀右移：<span class="arithmatex">\(\textit{curr} \leftarrow \text{curr} + 1\)</span>，并更新 <span class="arithmatex">\(k \leftarrow k - \text{count}(\text{curr})\)</span>；</li>
<li>否则：说明目标在当前前缀的子树中，进入下一层：<span class="arithmatex">\(\textit{curr} \leftarrow \text{curr} \times 10\)</span>，并消耗一个前缀：<span class="arithmatex">\(k \leftarrow k - 1\)</span>。</li>
</ul>
<p>每一层我们将当前区间扩大 <span class="arithmatex">\(10\)</span> 倍，向下延伸到更长的前缀，直到超出 <span class="arithmatex">\(n\)</span>。</p>
<p>时间复杂度 <span class="arithmatex">\(O(\log^2 n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private int n;

    public int findKthNumber(int n, int k) {
        this.n = n;
        long curr = 1;
        --k;
        while (k &gt; 0) {
            int cnt = count(curr);
            if (k &gt;= cnt) {
                k -= cnt;
                ++curr;
            } else {
                --k;
                curr *= 10;
            }
        }
        return (int) curr;
    }

    public int count(long curr) {
        long next = curr + 1;
        long cnt = 0;
        while (curr &lt;= n) {
            cnt += Math.min(n - curr + 1, next - curr);
            next *= 10;
            curr *= 10;
        }
        return (int) cnt;
    }
}
</code></pre>

</section></template>
<template id="panel-q-149"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">149</span>    <h2 class="q-title">445. 两数相加 II</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 39</span>    <span class="pill algo">栈、链表、数学</span>    <a class="pill link" href="https://leetcode.cn/problems/add-two-numbers-ii" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你两个<strong>非空</strong>链表来代表两个非负整数。数字最高位位于链表开始位置。它们的每个节点只存储一位数字。将这两数相加会返回一个新的链表。</p>
<p>你可以假设除了数字 0 之外，这两个数字都不会以零开头。</p>
<p><strong>示例1：</strong></p>
<p><img alt="题目示意图" src="https://pic.leetcode-cn.com/1626420025-fZfzMX-image.png" /></p>
<pre><code class="language-text">
输入：l1 = [7,2,4,3], l2 = [5,6,4]
输出：[7,8,0,7]
</code></pre>
<p><strong>示例2：</strong></p>
<pre><code class="language-text">
输入：l1 = [2,4,3], l2 = [5,6,4]
输出：[8,0,7]
</code></pre>
<p><strong>示例3：</strong></p>
<pre><code class="language-text">
输入：l1 = [0], l2 = [0]
输出：[0]
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li>链表的长度范围为<code>[1, 100]</code></li>
<li><code>0 &lt;= node.val &lt;= 9</code></li>
<li>输入数据保证链表代表的数字无前导 0</li>
</ul>
<p><strong>进阶：</strong>如果输入链表不能修改该如何处理？换句话说，不能对列表中的节点进行翻转。</p></section><section class="q-block solution"><p><strong>方法一：翻转</strong></p>
<p>手动翻转链表 <code>l1</code> 与 <code>l2</code>，将此题转换为 <a href="https://leetcode.cn/problems/add-two-numbers/">2. 两数相加</a>，相加过程一致。对于最后返回的结果链表也需要进行翻转，共计三次。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for singly-linked list.
 * public class ListNode {
 *     int val;
 *     ListNode next;
 *     ListNode() {}
 *     ListNode(int val) { this.val = val; }
 *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }
 * }
 */
class Solution {
    public ListNode addTwoNumbers(ListNode l1, ListNode l2) {
        Deque&lt;Integer&gt; s1 = new ArrayDeque&lt;&gt;();
        Deque&lt;Integer&gt; s2 = new ArrayDeque&lt;&gt;();
        for (; l1 != null; l1 = l1.next) {
            s1.push(l1.val);
        }
        for (; l2 != null; l2 = l2.next) {
            s2.push(l2.val);
        }
        ListNode dummy = new ListNode();
        int carry = 0;
        while (!s1.isEmpty() || !s2.isEmpty() || carry != 0) {
            int s = (s1.isEmpty() ? 0 : s1.pop()) + (s2.isEmpty() ? 0 : s2.pop()) + carry;
            // ListNode node = new ListNode(s % 10, dummy.next);
            // dummy.next = node;
            dummy.next = new ListNode(s % 10, dummy.next);
            carry = s / 10;
        }
        return dummy.next;
    }
}
</code></pre>

</section></template>
<template id="panel-q-150"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">150</span>    <h2 class="q-title">450. 删除二叉搜索树中的节点</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 39</span>    <span class="pill algo">树、二叉搜索树、二叉树</span>    <a class="pill link" href="https://leetcode.cn/problems/delete-node-in-a-bst" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个二叉搜索树的根节点<strong>root</strong>和一个值<strong>key</strong>，删除二叉搜索树中的<strong>key</strong>对应的节点，并保证二叉搜索树的性质不变。返回二叉搜索树（有可能被更新）的根节点的引用。</p>
<p>一般来说，删除节点可分为两个步骤：</p>
<ol>
<li>首先找到需要删除的节点；</li>
<li>如果找到了，删除它。</li>
</ol>
<p><strong>说明：</strong>要求算法时间复杂度为 O(h)，h 为树的高度。</p>
<p><strong>示例:</strong></p>
<pre><code class="language-text">
root = [5,3,6,2,4,null,7]
key = 3

    5
   / \
  3   6
 / \   \
2   4   7

给定需要删除的节点值是 3，所以我们首先找到 3 这个节点，然后删除它。

一个正确的答案是 [5,4,6,2,null,null,7], 如下图所示。

    5
   / \
  4   6
 /     \
2       7

另一个正确答案是 [5,2,6,null,4,null,7]。

    5
   / \
  2   6
   \   \
    4   7
</code></pre></section><section class="q-block solution"><p><strong>方法一：递归</strong></p>
<p>二叉搜索树有以下性质：</p>
<ol>
<li>若任意节点的左子树不空，则左子树上所有节点的值均小于它的根节点的值；</li>
<li>若任意节点的右子树不空，则右子树上所有节点的值均大于它的根节点的值；</li>
<li>任意节点的左、右子树也分别为二叉搜索树。</li>
</ol>
<p>我们可以递归判断当前节点 <span class="arithmatex">\(root\)</span> 与 <span class="arithmatex">\(key\)</span> 的大小关系：</p>
<ol>
<li>若 <span class="arithmatex">\(root.val&gt;key\)</span>，则递归左子树；</li>
<li>若 <span class="arithmatex">\(root.val&lt;key\)</span>，则递归右子树；</li>
<li>若 <span class="arithmatex">\(root.val=key\)</span>，则进一步判断：<ol>
<li>若 <span class="arithmatex">\(root\)</span> 没有左子树，则 <span class="arithmatex">\(root.right\)</span> 顶替 <span class="arithmatex">\(root\)</span> 的位置；</li>
<li>若 <span class="arithmatex">\(root\)</span> 没有右子树，则 <span class="arithmatex">\(root.left\)</span> 顶替 <span class="arithmatex">\(root\)</span> 的位置；</li>
<li>若 <span class="arithmatex">\(root\)</span> 同时存在左右子树，则将左子树转移至右子树的最左节点的左子树上，然后 <span class="arithmatex">\(root.right\)</span> 顶替 <span class="arithmatex">\(root\)</span> 的位置。</li>
</ol>
</li>
</ol>
<p>时间复杂度 <span class="arithmatex">\(O(H)\)</span>，其中 <span class="arithmatex">\(H\)</span> 是树的高度。</p></section><section class="q-block code"><pre><code class="language-java">/**
 * Definition for a binary tree node.
 * public class TreeNode {
 *     int val;
 *     TreeNode left;
 *     TreeNode right;
 *     TreeNode() {}
 *     TreeNode(int val) { this.val = val; }
 *     TreeNode(int val, TreeNode left, TreeNode right) {
 *         this.val = val;
 *         this.left = left;
 *         this.right = right;
 *     }
 * }
 */
class Solution {
    public TreeNode deleteNode(TreeNode root, int key) {
        if (root == null) {
            return null;
        }
        if (root.val &gt; key) {
            root.left = deleteNode(root.left, key);
            return root;
        }
        if (root.val &lt; key) {
            root.right = deleteNode(root.right, key);
            return root;
        }
        if (root.left == null) {
            return root.right;
        }
        if (root.right == null) {
            return root.left;
        }
        TreeNode node = root.right;
        while (node.left != null) {
            node = node.left;
        }
        node.left = root.left;
        root = root.right;
        return root;
    }
}
</code></pre>

</section></template>
<template id="panel-q-151"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">151</span>    <h2 class="q-title">剑指 Offer 54. 二叉搜索树的第k大节点</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 39</span>    <span class="pill algo">树、二叉搜索树、深度优先搜索、递归</span>    <a class="pill link" href="https://leetcode.cn/problems/er-cha-sou-suo-shu-de-di-kda-jie-dian-lcof" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一棵二叉搜索树，请找出其中第k大的节点。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">输入: root = [3,1,4,null,2], k = 1
   3
  / \
 1   4
  \
   2
输出: 4
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">输入: root = [5,3,6,2,4,null,null,1], k = 3
       5
      / \
     3   6
    / \
   2   4
  /
 1
输出: 4
</code></pre>
<p><strong>限制：</strong></p>
<p>1 ≤ k ≤ 二叉搜索树元素个数</p></section><section class="q-block solution"><p><strong>反向中序遍历</strong></p>
<p>二叉搜索树的右根左遍历顺序是从大到小。用计数器记录已经访问的节点数，访问到第 <code>k</code> 个节点时即为第 <code>k</code> 大元素，并停止继续递归。</p>
<p>时间复杂度最坏 <span class="arithmatex">\(O(n)\)</span>，递归栈空间复杂度 <span class="arithmatex">\(O(h)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    private int count;
    private int answer;

    public int kthLargest(TreeNode root, int k) {
        count = k;
        visit(root);
        return answer;
    }

    private void visit(TreeNode node) {
        if (node == null || count == 0) return;
        visit(node.right);
        if (count &gt; 0 &amp;&amp; --count == 0) answer = node.val;
        visit(node.left);
    }
}
</code></pre>

</section></template>
<template id="panel-q-152"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">152</span>    <h2 class="q-title">剑指 Offer 42. 连续子数组的最大和</h2>  </div>  <div class="q-meta">    <span class="pill diff easy">简单</span>    <span class="pill freq">频度 38</span>    <span class="pill algo">数组、动态规划、贪心</span>    <a class="pill link" href="https://leetcode.cn/problems/lian-xu-zi-shu-zu-de-zui-da-he-lcof" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>输入一个整型数组，数组中的一个或连续多个整数组成一个子数组。求所有子数组的和的最大值。</p>
<p>要求时间复杂度为O(n)。</p>
<p><strong>示例1:</strong></p>
<pre><code class="language-text">输入: nums = [-2,1,-3,4,-1,2,1,-5,4]
输出: 6
解释: 连续子数组 [4,-1,2,1] 的和最大，为 6。
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= arr.length &lt;= 10^5</code></li>
<li><code>-100 &lt;= arr[i] &lt;= 100</code></li>
</ul>
<p>注意：本题与主站 53 题相同：<a href="https://leetcode-cn.com/problems/maximum-subarray/">https://leetcode-cn.com/problems/maximum-subarray/</a></p></section><section class="q-block solution"><p><strong>Kadane 动态规划</strong></p>
<p><code>bestEnding</code> 表示以当前位置结尾的最大子数组和。若此前和为负，继续累加只会变差，因此在当前位置重新开始；每一步用它更新全局最大值。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int maxSubArray(int[] nums) {
        int bestEnding = nums[0], answer = nums[0];
        for (int i = 1; i &lt; nums.length; i++) {
            bestEnding = Math.max(nums[i], bestEnding + nums[i]);
            answer = Math.max(answer, bestEnding);
        }
        return answer;
    }
}
</code></pre>

</section></template>
<template id="panel-q-153"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">153</span>    <h2 class="q-title">45. 跳跃游戏 II</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 38</span>    <span class="pill algo">贪心、数组、动态规划</span>    <a class="pill link" href="https://leetcode.cn/problems/jump-game-ii" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给你一个非负整数数组<code>nums</code>，你最初位于数组的第一个位置。</p>
<p>数组中的每个元素代表你在该位置可以跳跃的最大长度。</p>
<p>你的目标是使用最少的跳跃次数到达数组的最后一个位置。</p>
<p>假设你总是可以到达数组的最后一个位置。</p>
<p><strong>示例 1:</strong></p>
<pre><code class="language-text">
输入: nums = [2,3,1,1,4]
输出: 2
解释: 跳到最后一个位置的最小跳跃数是 2。
     从下标为 0 跳到下标为 1 的位置，跳 1 步，然后跳 3 步到达数组的最后一个位置。
</code></pre>
<p><strong>示例 2:</strong></p>
<pre><code class="language-text">
输入: nums = [2,3,0,1,4]
输出: 2
</code></pre>
<p><strong>提示:</strong></p>
<ul>
<li><code>1 &lt;= nums.length &lt;= 10&lt;sup&gt;4&lt;/sup&gt;</code></li>
<li><code>0 &lt;= nums[i] &lt;= 1000</code></li>
</ul></section><section class="q-block solution"><p><strong>方法一：贪心</strong></p>
<p>我们可以用变量 <span class="arithmatex">\(mx\)</span> 记录当前位置能够到达的最远位置，用变量 <span class="arithmatex">\(last\)</span> 记录上一次跳跃到的位置，用变量 <span class="arithmatex">\(ans\)</span> 记录跳跃的次数。</p>
<p>接下来，我们遍历 <span class="arithmatex">\([0,..n - 2]\)</span> 的每一个位置 <span class="arithmatex">\(i\)</span>，对于每一个位置 <span class="arithmatex">\(i\)</span>，我们可以通过 <span class="arithmatex">\(i + nums[i]\)</span> 计算出当前位置能够到达的最远位置，我们用 <span class="arithmatex">\(mx\)</span> 来记录这个最远位置，即 <span class="arithmatex">\(mx = max(mx, i + nums[i])\)</span>。接下来，判断当前位置是否到达了上一次跳跃的边界，即 <span class="arithmatex">\(i = last\)</span>，如果到达了，那么我们就需要进行一次跳跃，将 <span class="arithmatex">\(last\)</span> 更新为 <span class="arithmatex">\(mx\)</span>，并且将跳跃次数 <span class="arithmatex">\(ans\)</span> 增加 <span class="arithmatex">\(1\)</span>。</p>
<p>最后，我们返回跳跃的次数 <span class="arithmatex">\(ans\)</span> 即可。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p>
<p>相似题目：</p>
<ul>
<li><a href="https://github.com/doocs/leetcode/blob/main/solution/0000-0099/0055.Jump%20Game/README.md">55. 跳跃游戏</a></li>
<li><a href="https://github.com/doocs/leetcode/blob/main/solution/1000-1099/1024.Video%20Stitching/README.md">1024. 视频拼接</a></li>
<li><a href="https://github.com/doocs/leetcode/blob/main/solution/1300-1399/1326.Minimum%20Number%20of%20Taps%20to%20Open%20to%20Water%20a%20Garden/README.md">1326. 灌溉花园的最少水龙头数目</a></li>
</ul></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int jump(int[] nums) {
        int ans = 0, mx = 0, last = 0;
        for (int i = 0; i &lt; nums.length - 1; ++i) {
            mx = Math.max(mx, i + nums[i]);
            if (last == i) {
                ++ans;
                last = mx;
            }
        }
        return ans;
    }
}
</code></pre>

</section></template>
<template id="panel-q-154"><div class="panel-head">  <div class="q-title-row">    <span class="q-rank">154</span>    <h2 class="q-title">287. 寻找重复数</h2>  </div>  <div class="q-meta">    <span class="pill diff mid">中等</span>    <span class="pill freq">频度 37</span>    <span class="pill algo">位运算、数组、双指针、二分查找</span>    <a class="pill link" href="https://leetcode.cn/problems/find-the-duplicate-number" target="_blank" rel="noopener">原题 ↗</a>  </div></div><div class="q-toolbar">  <button type="button" class="tb-btn" data-toggle="solution">🙈 收起题解</button>  <button type="button" class="tb-btn" data-toggle="code">🙈 收起代码</button>  <span class="tb-hint">提示：可先收起题解自己思考</span></div><section class="q-block desc"><p>给定一个包含<code>n + 1</code>个整数的数组<code>nums</code>，其数字都在<code>1</code>到<code>n</code>**之间（包括<code>1</code>和<code>n</code>），可知至少存在一个重复的整数。</p>
<p>假设<code>nums</code>只有<strong>一个重复的整数</strong>，找出<strong>这个重复的数</strong>。</p>
<p>你设计的解决方案必须不修改数组<code>nums</code>且只用常量级<code>O(1)</code>的额外空间。</p>
<p><strong>示例 1：</strong></p>
<pre><code class="language-text">
输入：nums = [1,3,4,2,2]
输出：2
</code></pre>
<p><strong>示例 2：</strong></p>
<pre><code class="language-text">
输入：nums = [3,1,3,4,2]
输出：3
</code></pre>
<p><strong>示例 3：</strong></p>
<pre><code class="language-text">
输入：nums = [1,1]
输出：1
</code></pre>
<p><strong>示例 4：</strong></p>
<pre><code class="language-text">
输入：nums = [1,1,2]
输出：1
</code></pre>
<p><strong>提示：</strong></p>
<ul>
<li><code>1 &lt;= n &lt;= 10&lt;sup&gt;5&lt;/sup&gt;</code></li>
<li><code>nums.length == n + 1</code></li>
<li><code>1 &lt;= nums[i] &lt;= n</code></li>
<li><code>nums</code>中<strong>只有一个整数</strong>出现<strong>两次或多次</strong>，其余整数均只出现<strong>一次</strong></li>
</ul>
<p><strong>进阶：</strong></p>
<ul>
<li>如何证明<code>nums</code>中至少存在一个重复的数字?</li>
<li>你可以设计一个线性级时间复杂度<code>O(n)</code>的解决方案吗？</li>
</ul></section><section class="q-block solution"><p><strong>方法一：二分查找</strong></p>
<p>我们可以发现，如果 <span class="arithmatex">\([1,..x]\)</span> 中的数字个数大于 <span class="arithmatex">\(x\)</span>，那么重复的数字一定在 <span class="arithmatex">\([1,..x]\)</span> 中，否则重复的数字一定在 <span class="arithmatex">\([x+1,..n]\)</span> 中。</p>
<p>因此，我们可以二分枚举 <span class="arithmatex">\(x\)</span>，每次判断 <span class="arithmatex">\([1,..x]\)</span> 中的数字个数是否大于 <span class="arithmatex">\(x\)</span>，从而确定重复的数字在哪个区间中，进而缩小区间范围，直到找到重复的数字。</p>
<p>时间复杂度 <span class="arithmatex">\(O(n \times \log n)\)</span>，其中 <span class="arithmatex">\(n\)</span> 是数组 <span class="arithmatex">\(nums\)</span> 的长度。空间复杂度 <span class="arithmatex">\(O(1)\)</span>。</p></section><section class="q-block code"><pre><code class="language-java">class Solution {
    public int findDuplicate(int[] nums) {
        int l = 0, r = nums.length - 1;
        while (l &lt; r) {
            int mid = (l + r) &gt;&gt; 1;
            int cnt = 0;
            for (int v : nums) {
                if (v &lt;= mid) {
                    ++cnt;
                }
            }
            if (cnt &gt; mid) {
                r = mid;
            } else {
                l = mid + 1;
            }
        }
        return l;
    }
}
</code></pre>

</section></template>
