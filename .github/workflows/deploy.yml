name: Deploy to GitHub Pages

on:
  push:
    # The React site lives on its own branch; main still holds the Hexo source.
    branches: [react-site]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Least privilege: only what the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight run, but let a running deploy finish
# rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Requires Pages to be set to "GitHub Actions" in repo settings first.
      # The `enablement: true` input can create it via API, but only with a PAT
      # (GITHUB_TOKEN lacks the administration:write permission), so it is not
      # used here.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
